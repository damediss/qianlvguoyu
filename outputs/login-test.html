<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>千铝国昱云平台 - 管理端登录</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:linear-gradient(135deg,#0f766e,#0d9488); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .panel { background:#fff; border-radius:12px; padding:40px; width:400px; box-shadow:0 20px 60px rgba(0,0,0,.15); }
    .logo { display:flex; align-items:center; gap:12px; margin-bottom:32px; }
    .logo-mark { width:44px; height:44px; background:#0f766e; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; font-weight:700; }
    h1 { font-size:20px; color:#172033; }
    .subtitle { font-size:14px; color:#667085; margin-top:2px; }
    .form-group { margin-bottom:20px; }
    label { display:block; font-size:14px; color:#344054; margin-bottom:6px; font-weight:500; }
    input { width:100%; padding:8px 12px; border:1px solid #d9e1e8; border-radius:6px; font-size:14px; outline:none; transition:.2s; }
    input:focus { border-color:#0f766e; box-shadow:0 0 0 3px rgba(15,118,110,.1); }
    button { width:100%; padding:9px; background:#0f766e; color:#fff; border:none; border-radius:6px; font-size:15px; cursor:pointer; transition:.2s; }
    button:hover { background:#0d6660; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .error { background:#fef2f2; color:#dc2626; padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:16px; display:none; }
    .success { background:#f0fdf4; color:#16a34a; padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:16px; display:none; }
    .dashboard { display:none; }
    .dashboard h2 { font-size:18px; color:#172033; margin-bottom:16px; }
    .info-row { display:flex; padding:10px 0; border-bottom:1px solid #eaedf0; font-size:14px; }
    .info-label { color:#667085; width:100px; }
    .info-value { color:#172033; flex:1; }
    .logout-btn { margin-top:24px; padding:8px 16px; background:#fff; color:#dc2626; border:1px solid #fecaca; border-radius:6px; cursor:pointer; font-size:13px; }
    .logout-btn:hover { background:#fef2f2; }
  </style>
</head>
<body>
<div class="panel" id="app">
  <div class="logo">
    <div class="logo-mark">千</div>
    <div><h1>千铝国昱云平台</h1><div class="subtitle">管理端登录</div></div>
  </div>

  <div id="loginForm">
    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>
    <div class="form-group">
      <label>租户编码</label>
      <input id="tenantCode" value="demo" />
    </div>
    <div class="form-group">
      <label>账号</label>
      <input id="username" value="admin" />
    </div>
    <div class="form-group">
      <label>密码</label>
      <input id="password" type="password" value="Admin@123456" />
    </div>
    <button id="loginBtn" onclick="doLogin()">登 录</button>
  </div>

  <div id="dashboard" class="dashboard">
    <h2>登录成功 ✅</h2>
    <div class="info-row"><span class="info-label">用户名</span><span class="info-value" id="infoName"></span></div>
    <div class="info-row"><span class="info-label">显示名</span><span class="info-value" id="infoDisplay"></span></div>
    <div class="info-row"><span class="info-label">用户类型</span><span class="info-value" id="infoType"></span></div>
    <div class="info-row"><span class="info-label">角色</span><span class="info-value" id="infoRoles"></span></div>
    <div class="info-row"><span class="info-label">Token</span><span class="info-value" id="infoToken" style="font-size:11px;word-break:break-all;"></span></div>
    <button class="logout-btn" onclick="doLogout()">退出登录</button>
  </div>
</div>

<script>
const API = '/api';

async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  errorBox.style.display = 'none';
  successBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tenantCode: document.getElementById('tenantCode').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.code !== 0) {
      showError(data.message || '登录失败');
      return;
    }
    // Show dashboard
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('infoName').textContent = data.data.currentUser.username;
    document.getElementById('infoDisplay').textContent = data.data.currentUser.displayName;
    document.getElementById('infoType').textContent = data.data.currentUser.userType;
    document.getElementById('infoRoles').textContent = data.data.currentUser.roleCodes.join(', ');
    document.getElementById('infoToken').textContent = data.data.accessToken.substring(0, 80) + '...';
  } catch(e) {
    showError('网络错误: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.style.display = 'block';
}

function doLogout() {
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
}
</script>
</body>
</html>
