<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开班申报 - 智训企业版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #2A6DFF;
      --primary-hover: #1E5AE8;
      --primary-light: #E8F0FF;
      --bg: #F5F7FC;
      --card: #FFFFFF;
      --text: #1A2332;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(42, 109, 255, 0.06);
      --radius-card: 20px;
      --radius-btn: 12px;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: var(--radius-btn); transition: all 0.2s;
    }
    .back-link:hover { background: var(--primary-light); color: var(--primary); }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar .sub { font-size: 13px; color: var(--text-secondary); }
    .process-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 6px 12px;
      background: var(--primary-light); color: var(--primary);
      border-radius: 20px; font-weight: 500;
    }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stat-card .val { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat-card .val.success { color: var(--success); }
    .stat-card .val.warn { color: var(--warning); }
    .stat-card .lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .card-head {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-head .title-wrap { display: flex; align-items: center; gap: 10px; }
    .card-head i { color: var(--primary); }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
    }
    .form-group textarea { min-height: 72px; resize: vertical; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(42, 109, 255, 0.12);
    }
    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 8px 16px; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .project-banner {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--primary-light);
      border-radius: var(--radius-btn);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px 24px;
      font-size: 13px;
    }
    .project-banner .item label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
    .project-banner .item strong { font-weight: 600; }
    .workspace-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .workspace-empty i { font-size: 40px; color: var(--border); margin-bottom: 16px; display: block; }
    .alert-banner {
      padding: 14px 18px;
      border-radius: var(--radius-btn);
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .alert-banner.warn { background: #FEF3C7; color: #92400E; }
    .alert-banner a { font-weight: 600; color: inherit; }
    .flow-steps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .flow-step {
      flex: 1;
      min-width: 120px;
      text-align: center;
      padding: 12px 8px;
      border-radius: var(--radius-btn);
      background: var(--bg);
      font-size: 12px;
      color: var(--text-secondary);
      position: relative;
    }
    .flow-step.done { background: #D1FAE5; color: #059669; font-weight: 600; }
    .flow-step.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .flow-step i { display: block; font-size: 18px; margin-bottom: 6px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th {
      text-align: left; padding: 12px 14px; font-size: 12px; color: var(--text-secondary);
      background: #FAFBFD; border-bottom: 2px solid var(--border);
    }
    .data-table td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .data-table tr:hover td { background: rgba(42, 109, 255, 0.02); }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
      white-space: nowrap;
    }
    .st-draft { background: #F1F5F9; color: #64748B; }
    .st-prep { background: #E8F0FF; color: var(--primary); }
    .st-submit { background: #FEF3C7; color: #D97706; }
    .st-review { background: #EDE9FE; color: #7C3AED; }
    .st-approved { background: #D1FAE5; color: #059669; }
    .st-open { background: #059669; color: #fff; }
    .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .action-btn {
      width: 32px; height: 32px; border: none; border-radius: 8px;
      background: var(--bg); color: var(--text-secondary); cursor: pointer;
    }
    .action-btn:hover { background: var(--primary-light); color: var(--primary); }
    .material-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    .material-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: var(--radius-btn);
      font-size: 13px;
    }
    .material-item input { width: auto; }
    .material-item.done { background: #D1FAE5; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h3 { margin-bottom: 20px; font-size: 18px; }
    .check-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="培训管理系统 主页面.html?panel=process" class="back-link">
        <i class="fas fa-arrow-left"></i> 返回培训流程
      </a>
      <div>
        <h1>开班申报</h1>
        <span class="sub" id="pageSub">按项目办理开班申报 · 步骤 4 / 9</span>
      </div>
    </div>
    <span class="process-badge"><i class="fas fa-door-open"></i> … → 开班申报 → 培训实施 → …</span>
  </header>

  <main class="page">
    <div class="card">
      <div class="card-head">
        <div class="title-wrap"><i class="fas fa-folder-open"></i> 培训项目</div>
        <a href="任务档案.html" class="btn btn-secondary btn-sm"><i class="fas fa-list"></i> 任务档案</a>
      </div>
      <div class="form-group">
        <label>选择企业培训项目（开班针对该项目已排课班级）</label>
        <select id="projectSelect">
          <option value="">请选择项目…</option>
        </select>
      </div>
      <div id="projectBanner" class="project-banner" style="display:none"></div>
    </div>

    <div id="workspaceEmpty" class="workspace-empty">
      <i class="fas fa-hand-pointer"></i>
      <p>请先选择<strong>企业培训项目</strong>，再办理各班级开班申请与仪式。</p>
      <p style="margin-top:8px;font-size:13px">需先完成 <a href="人才识别.html">人才识别</a>、<a href="最终方案.html">最终方案</a>；也可从任务档案进入。</p>
    </div>

    <div id="kaibanWorkspace" style="display:none">
      <div id="noClassAlert" class="alert-banner warn" style="display:none">
        <i class="fas fa-exclamation-triangle"></i>
        <div>本项目尚无班级，请先 <a href="#" id="linkRencai">人才识别</a> 并完成 <a href="#" id="linkZuizhong">最终方案</a>。</div>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <div class="val" id="statTotal">0</div>
          <div class="lbl">待办班级</div>
        </div>
        <div class="stat-card">
          <div class="val warn" id="statPending">0</div>
          <div class="lbl">审批中</div>
        </div>
        <div class="stat-card">
          <div class="val success" id="statOpened">0</div>
          <div class="lbl">已正式开班</div>
        </div>
        <div class="stat-card">
          <div class="val" id="statCeremony">0</div>
          <div class="lbl">仪式已完成</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="title-wrap"><i class="fas fa-route"></i> 开班流程</div>
          <span style="font-size:12px;color:var(--text-secondary)">开班申请 → 承诺书 → 人社提交 → 审批通过 → 正式开班</span>
        </div>
        <div class="flow-steps" id="flowSteps"></div>
        <div class="toolbar">
          <button type="button" class="btn btn-primary" id="btnGenMaterials">
            <i class="fas fa-file-archive"></i> 批量生成开班材料包
          </button>
          <button type="button" class="btn btn-secondary" id="btnSubmitRsb">
            <i class="fas fa-cloud-upload-alt"></i> 提交人社系统
          </button>
          <button type="button" class="btn btn-secondary" id="btnNotifyEnterprise">
            <i class="fas fa-bell"></i> 通知企业确认
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="title-wrap"><i class="fas fa-chalkboard"></i> 班级开班台账</div>
        </div>
        <div class="table-wrap" style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>班级</th>
                <th>学员数</th>
                <th>开班日期</th>
                <th>场地</th>
                <th>仪式时间</th>
                <th>材料</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="classBody"></tbody>
          </table>
        </div>
      </div>

      <div style="display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap">
        <a href="最终方案.html" class="btn btn-secondary" id="linkBackZuizhong"><i class="fas fa-calendar-alt"></i> 返回最终方案</a>
        <a href="培训管理系统 主页面.html?panel=process" class="btn btn-secondary">保存并返回流程</a>
        <button type="button" class="btn btn-success" id="btnNextStep">
          <i class="fas fa-arrow-right"></i> 完成开班申报，进入培训实施
        </button>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="classModal">
    <div class="modal-box">
      <h3 id="classModalTitle">班级开班信息</h3>
      <input type="hidden" id="editClassId">
      <div class="form-grid">
        <div class="form-group full">
          <label>班级名称</label>
          <input type="text" id="modalClassName" readonly style="background:var(--bg)">
        </div>
        <div class="form-group">
          <label>计划开班日期</label>
          <input type="date" id="openDate">
        </div>
        <div class="form-group">
          <label>开班仪式时间</label>
          <input type="time" id="ceremonyTime" value="09:00">
        </div>
        <div class="form-group">
          <label>培训场地</label>
          <select id="openVenue"></select>
        </div>
        <div class="form-group">
          <label>班主任</label>
          <input type="text" id="headTeacher" placeholder="姓名">
        </div>
        <div class="form-group">
          <label>开班状态</label>
          <select id="openStatus">
            <option value="待申请">待申请</option>
            <option value="材料准备中">材料准备中</option>
            <option value="已提交人社">已提交人社</option>
            <option value="审批中">审批中</option>
            <option value="已批准">已批准</option>
            <option value="正式开班">正式开班</option>
          </select>
        </div>
        <div class="form-group full">
          <label>开班材料清单</label>
          <div class="material-grid" id="materialChecklist"></div>
        </div>
        <div class="form-group full check-row">
          <input type="checkbox" id="commitmentSigned">
          <label for="commitmentSigned" style="margin:0">企业/机构已签署开班承诺书</label>
        </div>
        <div class="form-group full check-row">
          <input type="checkbox" id="ceremonyDone">
          <label for="ceremonyDone" style="margin:0">开班仪式已完成（5–10 分钟）</label>
        </div>
        <div class="form-group full">
          <label>备注</label>
          <textarea id="openRemark" placeholder="场地确认、企业参与情况等"></textarea>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:24px">
        <button type="button" class="btn btn-secondary" id="classModalCancel">取消</button>
        <button type="button" class="btn btn-primary" id="classModalSave">保存</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_TASKS = 'zhixun_tasks';
    const STORAGE_FENBAN = 'zhixun_fenban_by_project';
    const STORAGE_PAIKE = 'zhixun_paike_by_project';
    const STORAGE_KAIBAN = 'zhixun_kaiban_by_project';

    const VENUES = ['总部培训中心', '华东实训基地A区', '华南技能中心', '柳州培训基地', '桂林教学点'];
    const MATERIAL_KEYS = [
      { key: 'application', label: '开班申请表' },
      { key: 'roster', label: '开班花名册' },
      { key: 'commitment', label: '开班承诺书' },
      { key: 'schedule', label: '已发布课表' },
      { key: 'venue', label: '场地确认单' }
    ];
    const FLOW_LABELS = ['开班申请', '承诺书签署', '人社提交', '审批通过', '正式开班'];

    let tasks = [];
    let currentProjectId = null;
    let currentProject = null;
    let classRecords = [];

    function loadTasks() {
      try { tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS) || '[]'); }
      catch (e) { tasks = []; }
    }

    function getFenban(projectId) {
      try {
        const all = JSON.parse(localStorage.getItem(STORAGE_FENBAN) || '{}');
        return all[String(projectId)] || null;
      } catch (e) { return null; }
    }

    function getPaike(projectId) {
      try {
        const all = JSON.parse(localStorage.getItem(STORAGE_PAIKE) || '{}');
        return all[String(projectId)] || null;
      } catch (e) { return null; }
    }

    function getAllKaiban() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KAIBAN) || '{}'); }
      catch (e) { return {}; }
    }

    function defaultMaterials(paikePublished) {
      const m = {};
      MATERIAL_KEYS.forEach(x => { m[x.key] = false; });
      if (paikePublished) m.schedule = true;
      return m;
    }

    function inferFromPaike(classId, paike) {
      const courses = (paike?.courses || []).filter(c => c.classId === classId);
      if (!courses.length) return { date: '', venue: VENUES[0] };
      const sorted = [...courses].sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      return { date: sorted[0].date, venue: sorted[0].venue || VENUES[0] };
    }

    function buildRecordsFromFenban(projectId, savedRecords) {
      const fenban = getFenban(projectId);
      const paike = getPaike(projectId);
      const classes = fenban?.classes || [];
      const savedMap = {};
      (savedRecords || []).forEach(r => { savedMap[r.classId] = r; });

      return classes.map(cls => {
        const existing = savedMap[cls.id];
        if (existing) return { ...existing, className: cls.name, studentCount: cls.studentIds?.length || 0 };
        const hint = inferFromPaike(cls.id, paike);
        return {
          classId: cls.id,
          className: cls.name,
          studentCount: cls.studentIds?.length || 0,
          openDate: hint.date || '',
          venue: hint.venue || cls.region ? `${cls.region}培训基地` : VENUES[0],
          ceremonyTime: '09:00',
          headTeacher: cls.teacher || '',
          status: paike?.published ? '材料准备中' : '待申请',
          materials: defaultMaterials(!!paike?.published),
          commitmentSigned: false,
          ceremonyDone: false,
          remark: '',
          rsbSubmittedAt: null,
          enterpriseNotified: false
        };
      });
    }

    function loadProjectData(projectId) {
      const project = tasks.find(t => t.id === projectId);
      if (!project) return;

      currentProjectId = projectId;
      currentProject = project;

      const all = getAllKaiban();
      const bundle = all[String(projectId)] || {};
      classRecords = buildRecordsFromFenban(projectId, bundle.records);

      if (!all[String(projectId)]) {
        all[String(projectId)] = { projectId, records: classRecords };
        localStorage.setItem(STORAGE_KAIBAN, JSON.stringify(all));
      }

      document.getElementById('linkRencai').href = `人才识别.html?projectId=${projectId}`;
      document.getElementById('linkZuizhong').href = `最终方案.html?projectId=${projectId}`;
      document.getElementById('linkBackZuizhong').href = `最终方案.html?projectId=${projectId}`;

      renderProjectBanner();
      toggleWorkspace(true);
      document.getElementById('noClassAlert').style.display = classRecords.length ? 'none' : 'flex';
      renderAll();
    }

    function saveData() {
      if (!currentProjectId) return;
      const all = getAllKaiban();
      all[String(currentProjectId)] = { projectId: currentProjectId, records: classRecords };
      localStorage.setItem(STORAGE_KAIBAN, JSON.stringify(all));
    }

    function renderProjectBanner() {
      const banner = document.getElementById('projectBanner');
      const p = currentProject;
      banner.style.display = 'grid';
      banner.innerHTML = `
        <div class="item"><label>企业</label><strong>${p.enterprise || '—'}</strong></div>
        <div class="item"><label>培训项目</label><strong>${p.name || '—'}</strong></div>
        <div class="item"><label>工种</label><strong>${p.occupation || '—'}</strong></div>
        <div class="item"><label>班级数</label><strong>${classRecords.length} 个</strong></div>
        <div class="item"><label>负责人</label><strong>${p.owner || '—'}</strong></div>
      `;
      document.getElementById('pageSub').textContent = `${p.enterprise || ''} · ${p.name || ''} · 步骤 4 / 9`;
    }

    function toggleWorkspace(show) {
      document.getElementById('kaibanWorkspace').style.display = show ? 'block' : 'none';
      document.getElementById('workspaceEmpty').style.display = show ? 'none' : 'block';
    }

    function populateProjectSelect() {
      const sel = document.getElementById('projectSelect');
      sel.innerHTML = '<option value="">请选择项目…</option>' +
        tasks.map(t => `<option value="${t.id}">${t.enterprise || '—'} · ${t.name}</option>`).join('');
    }

    function statusClass(status) {
      const map = {
        '待申请': 'st-draft',
        '材料准备中': 'st-prep',
        '已提交人社': 'st-submit',
        '审批中': 'st-review',
        '已批准': 'st-approved',
        '正式开班': 'st-open'
      };
      return map[status] || 'st-draft';
    }

    function materialsProgress(m) {
      const total = MATERIAL_KEYS.length;
      const done = MATERIAL_KEYS.filter(k => m[k.key]).length;
      return `${done}/${total}`;
    }

    function flowIndexForStatus(status) {
      const order = ['待申请', '材料准备中', '已提交人社', '审批中', '已批准', '正式开班'];
      const i = order.indexOf(status);
      if (i <= 0) return 0;
      if (i === 1) return 1;
      if (i === 2) return 2;
      if (i === 3) return 3;
      if (i === 4) return 4;
      return 5;
    }

    function renderFlowSteps() {
      const avg = classRecords.length
        ? Math.round(classRecords.reduce((s, r) => s + flowIndexForStatus(r.status), 0) / classRecords.length)
        : 0;
      document.getElementById('flowSteps').innerHTML = FLOW_LABELS.map((label, i) => {
        let cls = 'flow-step';
        if (i < avg) cls += ' done';
        else if (i === avg) cls += ' active';
        const icons = ['fa-file-signature', 'fa-handshake', 'fa-cloud-upload-alt', 'fa-check-double', 'fa-door-open'];
        return `<div class="${cls}"><i class="fas ${icons[i]}"></i>${label}</div>`;
      }).join('');
    }

    function updateStats() {
      const total = classRecords.length;
      const pending = classRecords.filter(r => r.status === '审批中' || r.status === '已提交人社').length;
      const opened = classRecords.filter(r => r.status === '正式开班').length;
      const ceremony = classRecords.filter(r => r.ceremonyDone).length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statOpened').textContent = opened;
      document.getElementById('statCeremony').textContent = ceremony;
    }

    function renderClassTable() {
      const tbody = document.getElementById('classBody');
      if (!classRecords.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-secondary);padding:24px">暂无班级，请先分班排课</td></tr>';
        updateStats();
        renderFlowSteps();
        return;
      }
      tbody.innerHTML = classRecords.map(r => `
        <tr>
          <td><strong>${r.className}</strong></td>
          <td>${r.studentCount} 人</td>
          <td>${r.openDate || '—'}</td>
          <td>${r.venue || '—'}</td>
          <td>${r.ceremonyTime || '—'}</td>
          <td>${materialsProgress(r.materials || {})}</td>
          <td><span class="status-badge ${statusClass(r.status)}">${r.status}</span></td>
          <td>
            <div class="action-btns">
              <button type="button" class="action-btn edit-open" data-id="${r.classId}" title="编辑"><i class="fas fa-edit"></i></button>
              <button type="button" class="action-btn quick-rsb" data-id="${r.classId}" title="提交人社"><i class="fas fa-cloud-upload-alt"></i></button>
            </div>
          </td>
        </tr>
      `).join('');
      updateStats();
      renderFlowSteps();
    }

    function renderAll() {
      renderClassTable();
    }

    function openClassModal(classId) {
      const r = classRecords.find(x => x.classId === classId);
      if (!r) return;
      document.getElementById('editClassId').value = classId;
      document.getElementById('modalClassName').value = r.className;
      document.getElementById('openDate').value = r.openDate || '';
      document.getElementById('ceremonyTime').value = r.ceremonyTime || '09:00';
      document.getElementById('headTeacher').value = r.headTeacher || '';
      document.getElementById('openStatus').value = r.status;
      document.getElementById('commitmentSigned').checked = !!r.commitmentSigned;
      document.getElementById('ceremonyDone').checked = !!r.ceremonyDone;
      document.getElementById('openRemark').value = r.remark || '';

      const vSel = document.getElementById('openVenue');
      vSel.innerHTML = VENUES.map(v =>
        `<option value="${v}" ${v === r.venue ? 'selected' : ''}>${v}</option>`
      ).join('');
      if (r.venue && !VENUES.includes(r.venue)) {
        vSel.innerHTML += `<option value="${r.venue}" selected>${r.venue}</option>`;
      }

      document.getElementById('materialChecklist').innerHTML = MATERIAL_KEYS.map(m => `
        <label class="material-item ${r.materials[m.key] ? 'done' : ''}">
          <input type="checkbox" data-mkey="${m.key}" ${r.materials[m.key] ? 'checked' : ''}>
          ${m.label}
        </label>
      `).join('');

      document.getElementById('classModal').classList.add('show');
    }

    function saveClassModal() {
      const classId = parseInt(document.getElementById('editClassId').value);
      const idx = classRecords.findIndex(r => r.classId === classId);
      if (idx === -1) return;

      const materials = {};
      document.querySelectorAll('#materialChecklist input[data-mkey]').forEach(cb => {
        materials[cb.dataset.mkey] = cb.checked;
      });

      classRecords[idx] = {
        ...classRecords[idx],
        openDate: document.getElementById('openDate').value,
        ceremonyTime: document.getElementById('ceremonyTime').value,
        venue: document.getElementById('openVenue').value,
        headTeacher: document.getElementById('headTeacher').value.trim(),
        status: document.getElementById('openStatus').value,
        materials,
        commitmentSigned: document.getElementById('commitmentSigned').checked,
        ceremonyDone: document.getElementById('ceremonyDone').checked,
        remark: document.getElementById('openRemark').value.trim()
      };

      document.getElementById('classModal').classList.remove('show');
      saveData();
      renderAll();
    }

    function allMaterialsReady(r) {
      return MATERIAL_KEYS.every(k => r.materials[k.key]);
    }

    function btnGenMaterials() {
      if (!classRecords.length) { alert('暂无班级'); return; }
      classRecords.forEach(r => {
        MATERIAL_KEYS.forEach(k => { r.materials[k.key] = true; });
        if (r.status === '待申请') r.status = '材料准备中';
      });
      saveData();
      renderAll();
      alert('已为本项目全部班级勾选开班材料清单（演示）');
    }

    function submitToRsb(records, single) {
      const ready = records.filter(allMaterialsReady);
      const notReady = records.filter(r => !allMaterialsReady(r));
      if (!ready.length) {
        alert('请先完善开班材料清单（申请表、花名册、承诺书、课表、场地确认单）');
        return;
      }
      if (notReady.length && !single) {
        if (!confirm(`${notReady.length} 个班级材料未齐，仅提交已齐备的 ${ready.length} 个班？`)) return;
      }
      ready.forEach(r => {
        r.status = '已提交人社';
        r.rsbSubmittedAt = new Date().toISOString().slice(0, 10);
        setTimeout(() => { r.status = '审批中'; }, 0);
      });
      saveData();
      renderAll();
      alert(single
        ? `班级「${ready[0].className}」开班材料已提交人社系统（演示）`
        : `已向人社系统提交 ${ready.length} 个班级的开班材料（演示），状态进入审批中`);
    }

    document.getElementById('btnGenMaterials').addEventListener('click', btnGenMaterials);
    document.getElementById('btnSubmitRsb').addEventListener('click', () => submitToRsb(classRecords, false));
    document.getElementById('btnNotifyEnterprise').addEventListener('click', () => {
      if (!currentProject) return;
      classRecords.forEach(r => { r.enterpriseNotified = true; });
      saveData();
      alert(`已向企业「${currentProject.enterprise}」发送开班时间与场地确认通知（演示）`);
    });
    document.getElementById('classModalCancel').addEventListener('click', () => {
      document.getElementById('classModal').classList.remove('show');
    });
    document.getElementById('classModalSave').addEventListener('click', saveClassModal);
    document.getElementById('classBody').addEventListener('click', e => {
      const edit = e.target.closest('.edit-open');
      const rsb = e.target.closest('.quick-rsb');
      if (edit) openClassModal(parseInt(edit.dataset.id));
      if (rsb) {
        const r = classRecords.find(x => x.classId === parseInt(rsb.dataset.id));
        if (r) submitToRsb([r], true);
      }
    });
    document.getElementById('btnNextStep').addEventListener('click', () => {
      if (!currentProjectId) { alert('请先选择项目'); return; }
      const notOpen = classRecords.filter(r => r.status !== '正式开班');
      if (notOpen.length && classRecords.length) {
        if (!confirm(`${notOpen.length} 个班级尚未「正式开班」，仍要进入培训环节？`)) return;
      }
      saveData();
      alert(`项目「${currentProject?.name || ''}」开班信息已保存，进入培训环节`);
      window.location.href = `培训.html?projectId=${currentProjectId}`;
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      populateProjectSelect();
      const params = new URLSearchParams(window.location.search);
      const pid = params.get('projectId');
      if (pid && tasks.some(t => String(t.id) === String(pid))) {
        document.getElementById('projectSelect').value = pid;
        loadProjectData(parseInt(pid, 10));
      } else {
        toggleWorkspace(false);
      }
      document.getElementById('projectSelect').addEventListener('change', e => {
        const v = e.target.value;
        if (!v) {
          if (currentProjectId) saveData();
          currentProjectId = null;
          currentProject = null;
          toggleWorkspace(false);
          document.getElementById('projectBanner').style.display = 'none';
          document.getElementById('pageSub').textContent = '按项目办理开班申报 · 步骤 4 / 9';
          const url = new URL(window.location.href);
          url.searchParams.delete('projectId');
          history.replaceState(null, '', url);
          return;
        }
        if (currentProjectId) saveData();
        const url = new URL(window.location.href);
        url.searchParams.set('projectId', v);
        history.replaceState(null, '', url);
        loadProjectData(parseInt(v, 10));
      });
    });
  </script>
</body>
</html>
