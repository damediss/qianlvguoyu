services:
  mysql:
    image: mysql:8.4
    container_name: guoyu-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: guoyu_platform
      MYSQL_USER: guoyu
      MYSQL_PASSWORD: guoyu_dev_password
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - guoyu_platform_mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.4
    container_name: guoyu-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - guoyu_platform_redis:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: guoyu-platform-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guoyu
      RABBITMQ_DEFAULT_PASS: guoyu_dev_password
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Shanghai
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - guoyu_platform_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  guoyu_platform_mysql:
  guoyu_platform_redis:
  guoyu_platform_rabbitmq:
