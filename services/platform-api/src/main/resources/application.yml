server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: native
  undertow:
    max-http-post-size: 1GB
  tomcat:
    max-http-form-post-size: 50MB

spring:
  application:
    name: platform-api
  servlet:
    multipart:
      enabled: true
      max-file-size: 1GB
      max-request-size: 1GB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    # connectTimeout/socketTimeout/tcpKeepAlive：远程 MySQL 经公网/NAT 时降低 Communications link failure 概率
    url: ${MYSQL_URL:jdbc:mysql://43.138.163.7:3308/gjjddb2026?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=60000&tcpKeepAlive=true}
    username: ${MYSQL_USERNAME:gjjd}
    password: ${MYSQL_PASSWORD:w-#Y+=g7jdsJLjD8}
#    url: jdbc:mysql://192.168.1.200:3308/gjjd_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
#    username: root
#    password: guoyu_dev!513
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
#      connection-init-sqls:
#        - "SET SESSION sql_mode = 'NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'"
#        - "SET SESSION time_zone = '+08:00'"
      # 远程库空闲连接常被 NAT/防火墙在 30~60s 掐断；保活间隔需短于该阈值
      time-between-eviction-runs-millis: 15000
      min-evictable-idle-time-millis: 60000
      max-evictable-idle-time-millis: 180000
      keep-alive: true
      keep-alive-between-time-millis: 50000
      phy-timeout-millis: 600000
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 关闭监控统计
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
      filters: wall
      filter:
        wall:
          enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # Redis 命令超时：防止 Redis 不响应时 Lettuce 无限等待，
      # 进而拖垮 DB 连接池（@CacheEvict 卡住 → 事务不提交 → 连接不释放 → 连接池耗尽）
      timeout: 3s
      lettuce:
        # 连接池：Lettuce 默认单连接非池化，一个操作 hang 会堵全部 Redis 操作
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
        # 关闭时等待未完成命令的最长时间
        shutdown-timeout: 100ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # 竞赛通知等才依赖 Rabbit；本地未起 MQ 时默认不把 rabbit 计入 health，避免整体 DOWN
    # 需要监控时：RABBIT_HEALTH_ENABLED=true
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

flowable:
  database-schema-update: ${FLOWABLE_DATABASE_SCHEMA_UPDATE:true}
  database-type: mysql
  async-executor-activate: true
  history-level: full
  # 关闭 Spring Boot 内置自动部署，避免 ACT_RE_PROCDEF 版本冲突（见 FlowableProcessDeploymentRunner）
  check-process-definitions: false
  process-definition-location-prefix: classpath:/workflows/bpmn/
  process-definition-location-suffixes:
    - "**.bpmn20.xml"

weknora:
  base-url: ${WEKNORA_BASE_URL:http://43.138.163.7:8088}
  channel-id: ${WEKNORA_CHANNEL_ID:aa3a676b-a1cb-4719-8e06-6636932d9bb2}
  publish-token: ${WEKNORA_PUBLISH_TOKEN:}
  origin: ${WEKNORA_ORIGIN:http://localhost:5173}

platform:
  bot:
    # MCP 与 platform-api 必须配置相同的随机值（至少 32 字符），禁止提交真实密钥。
    actor-context-secret: ${BOT_ACTOR_CONTEXT_SECRET:}
  competition:
    player:
      sms:
        code-ttl-seconds: ${COMPETITION_PLAYER_SMS_CODE_TTL_SECONDS:300}
        resend-cooldown-seconds: ${COMPETITION_PLAYER_SMS_RESEND_COOLDOWN_SECONDS:60}
        daily-limit-per-mobile: ${COMPETITION_PLAYER_SMS_DAILY_LIMIT_PER_MOBILE:5}
        daily-limit-per-player: ${COMPETITION_PLAYER_SMS_DAILY_LIMIT_PER_PLAYER:5}
        max-failed-attempts: ${COMPETITION_PLAYER_SMS_MAX_FAILED_ATTEMPTS:5}
        lock-seconds: ${COMPETITION_PLAYER_SMS_LOCK_SECONDS:1800}
        aliyun:
          enabled: ${COMPETITION_PLAYER_SMS_ALIYUN_ENABLED:false}
          endpoint: ${COMPETITION_PLAYER_SMS_ALIYUN_ENDPOINT:https://dysmsapi.aliyuncs.com}
          region-id: ${COMPETITION_PLAYER_SMS_ALIYUN_REGION_ID:cn-hangzhou}
          sign-name: ${COMPETITION_PLAYER_SMS_ALIYUN_SIGN_NAME:}
          template-code: ${COMPETITION_PLAYER_SMS_ALIYUN_TEMPLATE_CODE:}
    messaging:
      enabled: ${COMPETITION_MESSAGING_ENABLED:false}
      dispatch-delay-millis: ${COMPETITION_MESSAGING_DISPATCH_DELAY_MILLIS:5000}
      batch-size: ${COMPETITION_MESSAGING_BATCH_SIZE:50}
      max-attempts: ${COMPETITION_MESSAGING_MAX_ATTEMPTS:10}
      exchange: ${COMPETITION_MESSAGING_EXCHANGE:competition.events}
      routing-key: ${COMPETITION_MESSAGING_ROUTING_KEY:competition.notice.published.v1}
      queue: ${COMPETITION_MESSAGING_QUEUE:competition.notice.delivery}
      dead-letter-queue: ${COMPETITION_MESSAGING_DEAD_LETTER_QUEUE:competition.notice.delivery.dlq}
      dead-letter-exchange: ${COMPETITION_MESSAGING_DEAD_LETTER_EXCHANGE:competition.dlx}
  training:
    division:
      # 主路径门禁：排班表必填；名单默认也要求（可关，仅作人员补全建议）
      require-roster: ${TRAINING_DIVISION_REQUIRE_ROSTER:true}
  certification:
    collection:
      # PDFBox 嵌入中文字体；为空时探测 Windows simhei.ttf 或 Linux WQY TTC 字体。
      # OTF/CFF 字体不受 PDFBox PDType0Font 支持；Linux 推荐 fonts-wqy-zenhei。
      pdf-font-path: ${COLLECTION_PDF_FONT_PATH:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:7200}
    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:604800}
  file:
    storage-provider: ${FILE_STORAGE_PROVIDER:cos}
    local-root: ${FILE_LOCAL_ROOT:./storage/files}
    cos:
      secret-id: ${COS_SECRET_ID:AKIDTD0e8QWQ8f09TcZKzTlqiQxIUVRBjYCe}
      secret-key: ${COS_SECRET_KEY:JQM5cw52mJenjSo260kMmGeu55tZDtRp}
      region: ${COS_REGION:ap-guangzhou}
      bucket: ${COS_BUCKET:qlgysaas-1327842189}
      # 请求域名（默认访问域名）。留空会自动拼为 https://{bucket}.cos.{region}.myqcloud.com
      url-prefix: ${COS_URL_PREFIX:https://qlgysaas-1327842189.cos.ap-guangzhou.myqcloud.com}
  cdn:
    # 与 gjjd_phalcon（PHP 源系统）对齐：身份证图片物理路径与 CDN 域名
    # 部署时请用环境变量 CDN_PATH 覆盖（与 PHP 项目 cdn/ 目录保持同步）
    # 生产 CDN 域名：https://cdn.app.gjjd168.com
    # 本地开发用 /api/exam/files/**（后端 ExamTaskXimuController 走 cdn.path + file.local-root 读盘）
    # 默认指向 gjjd_phalcon/cdn（PHP 老系统的 cdn 目录，已有大量图片素材）
    path: ${CDN_PATH:D:/phpApp/gjjd_phalcon/cdn}
    # 后端读盘/本地开发直链（可带 :8080）
    url: ${CDN_URL:http://localhost:8080/api/exam/files}
    # 写入库/返回 App 的公网地址（生产务必走 Nginx，不要 :8080）
    # 本地无 sign-up/** 文件时也会 302 到此地址（App 扫码上传只在 API 机磁盘，不在 cdn.app）
    public-url: ${CDN_PUBLIC_URL:http://43.138.163.7/api/exam/files}
    # 本地磁盘无文件时回退到历史 PHP CDN（idCard/upload 等；勿用于 sign-up/**）
    remote-fallback-url: ${CDN_REMOTE_FALLBACK_URL:https://cdn.app.gjjd168.com}
  wechat:
    mini:
      # 与 gjjd_phalcon WxminiController 保持一致，生产环境请用环境变量覆盖
      app-id: ${WECHAT_MINI_APP_ID:wx67133f973ccd5592}
      app-secret: ${WECHAT_MINI_APP_SECRET:a927524973ea144a9405b9739a2b2c51}
  baidu:
    api-key: ${BAIDU_API_KEY:JHKuRKyAaLiqdWRi79Bfriim}
    secret-key: ${BAIDU_SECRET_KEY:nLJlBKKsan5ArKiJNzw8NgVmU4RT94yb}
    # 身份证裁剪内收比例（相对宽/高，四周各收一圈，减小 card_image / card_location 多余背景边）
    # 0=不内收；建议 0.02~0.06，过大可能切到证件内容
    idcard-crop-inset-ratio: ${BAIDU_IDCARD_CROP_INSET_RATIO:0.04}
  # 报名页面公开访问地址（用于生成二维码，扫码跳转用）
  # 本地开发：http://localhost:8080  生产：https://api.gjjd168.com
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  h5:
    # H5 前端地址（企业调研人员采集二维码跳转）
    base-url: ${H5_BASE_URL:https://h5.gjjd168.com}
  # App 端默认租户（AppHomeApplicationService 读取 platform.app.default-tenant-id）
  # PHP 库 10159 与 SaaS 库 1 为同一租户，SaaS 侧统一以 1 为准（鉴权方案 v1.2 Q2，2026-08-03 已与需求方确认）
  app:
    default-tenant-id: ${APP_DEFAULT_TENANT_ID:1}
  # 我的页客服电话/协议链接
  kefu-phone: ${APP_KEFU_PHONE:18977081413}
  agreement-url: ${APP_AGREEMENT_URL:}
  privacy-url: ${APP_PRIVACY_URL:}
  sms:
    # false=开发模式：验证码写入 platform_sms 并打日志，不调用阿里云
    enabled: ${SMS_ENABLED:false}
  weknora:
    # WeKnora 本地知识库（AI 陪练代理目标）
    enabled: ${WEKNORA_ENABLED:true}
    base-url: ${WEKNORA_BASE_URL:http://43.138.163.7:8088/api/v1}
    api-key: ${WEKNORA_API_KEY:sk-9u9kws6uBLRVmSHThzGjNeCrCEjWx61sOEEgg52VqowzWsDi}
    # 逗号分隔的知识库 ID，在 WeKnora 控制台获取
    default-knowledge-base-ids: ${WEKNORA_KB_IDS:}
    default-agent-id: ${WEKNORA_AGENT_ID:a6223b7c-96ed-494a-b0ef-2c39dac77064}
    # 自定义智能体走 agent-chat；内置 builtin-* 可走 knowledge-chat
    use-agent-chat: ${WEKNORA_USE_AGENT_CHAT:true}
    connect-timeout-seconds: ${WEKNORA_CONNECT_TIMEOUT:15}
    read-timeout-seconds: ${WEKNORA_READ_TIMEOUT:180}
    # 可选备用：platform-api 自行调视觉 API 识图（需单独配 COACH_VISION_API_KEY）
    # 默认 false：拍照图片直接交给 WeKnora 智能体（使用控制台里已配的 MiniMax-M3 VLM）
    vision-preprocess-enabled: ${COACH_VISION_PREPROCESS:false}
    vision-api-url: ${COACH_VISION_API_URL:https://api.scnet.cn/api/llm/v1/chat/completions}
    vision-api-key: ${COACH_VISION_API_KEY:}
    vision-model: ${COACH_VISION_MODEL:MiniMax-M3}
  rencaishibie:
    # 本地开发请启动本机 rencaishibie（AUTH_ENABLED=false），勿直连线上 8001：
    # 线上引擎会用线上 SaaS 校验本地 Sa-Token，必然 HTTP 401。
    # 同机生产：RENCAI_BASE_URL=http://127.0.0.1:8001
    enabled: ${RENCAI_ENABLED:true}
    base-url: ${RENCAI_BASE_URL:http://127.0.0.1:8001}
    internal-token: ${RENCAI_INTERNAL_TOKEN:}
    connect-timeout-seconds: ${RENCAI_CONNECT_TIMEOUT:15}
    read-timeout-seconds: ${RENCAI_READ_TIMEOUT:300}
  # PHP→SaaS 三表轮询同步（platform_user / platform_user_token / platform_user_detail）
  # 对应《手机端调用SaaS鉴权方案》§3.5.3；PHP 库只读第二数据源，不挂多租户拦截器
  sync:
    # 默认关闭：指纹比对是 PHP 库全表 MD5 扫描（消耗其 CPU/IO），且轮询产生跨公网流量。
    # 本机调试保持 false；仅生产服务器（43.138.163.7）部署时 env 显式 PLATFORM_SYNC_ENABLED=true
    enabled: ${PLATFORM_SYNC_ENABLED:false}
    interval-ms: ${PLATFORM_SYNC_INTERVAL_MS:3000}
    initial-delay-ms: ${PLATFORM_SYNC_INITIAL_DELAY_MS:10000}
    # user/detail 指纹比对节流间隔：水位线快路径（走主键索引，代价极低）仍每周期跑，
    # 指纹比对按本间隔执行；token 表小且踢人敏感，不受本配置影响（仍每周期全量对账）
    fingerprint-interval-ms: ${PLATFORM_SYNC_FINGERPRINT_INTERVAL_MS:60000}
    batch-size: ${PLATFORM_SYNC_BATCH_SIZE:500}
    fail-alert-threshold: ${PLATFORM_SYNC_FAIL_ALERT_THRESHOLD:20}
    # 试运行：只读 PHP 库记录将发生的变更，不写镜像、不推进水位线
    dry-run: ${PLATFORM_SYNC_DRY_RUN:false}
    daily-reconcile-cron: "${PLATFORM_SYNC_DAILY_CRON:0 30 3 * * *}"
    php:
      # 注意：URL 必须带 tinyInt1isBit=false——mysql-connector-j 默认把 TINYINT(1) 映射为 Boolean，
      # 会丢失 level=2/3 的真实值（2026-08-04 权重解析因此全部归一化为空的线上事故）172.16.16.8
      url: ${PHP_MYSQL_URL:jdbc:mysql://114.132.67.185:3308/gjjddb?connectTimeout=3000&socketTimeout=10000&useSSL=false&tinyInt1isBit=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
      username: ${PHP_MYSQL_USERNAME:gjjddb}
      password: ${PHP_MYSQL_PASSWORD:q-#Z+=g7jgtbbJsJLjD8}
      max-active: ${PHP_MYSQL_MAX_ACTIVE:3}
      max-wait-ms: ${PHP_MYSQL_MAX_WAIT_MS:3000}
      query-timeout-seconds: ${PHP_MYSQL_QUERY_TIMEOUT:10}
  # AI 同步学定时任务（与三表同步共用 PHP 数据源）
  review-sync:
    # 同 platform.sync.enabled：定时任务会读 PHP 库，本机调试默认关闭，生产显式 =true
    jobs-enabled: ${REVIEW_SYNC_JOBS_ENABLED:false}
    daily-cron: "${REVIEW_SYNC_DAILY_CRON:0 0 4 * * *}"
    weekly-cron: "${REVIEW_SYNC_WEEKLY_CRON:0 0 5 * * SUN}"
    writeback-compensate-ms: ${REVIEW_SYNC_WRITEBACK_COMPENSATE_MS:300000}
    writeback-compensate-initial-ms: ${REVIEW_SYNC_WRITEBACK_COMPENSATE_INITIAL_MS:60000}

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 259200
  active-timeout: -1
  is-concurrent: true
  is-share: true
  is-log: true
  token-style: uuid          # P0: tik → uuid，支持 Redis 存储
  is-read-cookie: false

logging:
  level:
    com.guoyu.platform.config.CacheConfig: INFO
    com.guoyu.platform.system.service.MenuApplicationService: INFO
