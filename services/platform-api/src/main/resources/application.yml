server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: native

spring:
  application:
    name: platform-api
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${MYSQL_URL:jdbc:mysql://43.138.163.7:3308/gjjddb2026?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:gjjd}
    password: ${MYSQL_PASSWORD:w-#Y+=g7jdsJLjD8}
#    url: jdbc:mysql://192.168.1.200:3308/gjjd_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
#    username: root
#    password: guoyu_dev!513
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
#      connection-init-sqls:
#        - "SET SESSION sql_mode = 'NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'"
#        - "SET SESSION time_zone = '+08:00'"
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 关闭监控统计
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
      filters: wall
      filter:
        wall:
          enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # Redis 命令超时：防止 Redis 不响应时 Lettuce 无限等待，
      # 进而拖垮 DB 连接池（@CacheEvict 卡住 → 事务不提交 → 连接不释放 → 连接池耗尽）
      timeout: 3s
      lettuce:
        # 连接池：Lettuce 默认单连接非池化，一个操作 hang 会堵全部 Redis 操作
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
        # 关闭时等待未完成命令的最长时间
        shutdown-timeout: 100ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false
    repair-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

flowable:
  database-schema-update: ${FLOWABLE_DATABASE_SCHEMA_UPDATE:true}
  database-type: mysql
  async-executor-activate: true
  history-level: full
  # 关闭 Spring Boot 内置自动部署，避免 ACT_RE_PROCDEF 版本冲突（见 FlowableProcessDeploymentRunner）
  check-process-definitions: false
  process-definition-location-prefix: classpath:/workflows/bpmn/
  process-definition-location-suffixes:
    - "**.bpmn20.xml"

platform:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:7200}
    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:604800}
  file:
    storage-provider: ${FILE_STORAGE_PROVIDER:local}
    local-root: ${FILE_LOCAL_ROOT:D:/phpApp/qianlvguoyu_saas/storage/files}
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      region: ${COS_REGION:ap-guangzhou}
      bucket: ${COS_BUCKET:}
      url-prefix: ${COS_URL_PREFIX:}
  cdn:
    # 与 gjjd_phalcon（PHP 源系统）对齐：身份证图片物理路径与 CDN 域名
    # 部署时请用环境变量 CDN_PATH 覆盖（与 PHP 项目 cdn/ 目录保持同步）
    # 生产 CDN 域名：https://cdn.app.gjjd168.com
    # 本地开发用 /api/exam/files/**（后端 ExamTaskXimuController 走 cdn.path + file.local-root 读盘）
    # 默认指向 gjjd_phalcon/cdn（PHP 老系统的 cdn 目录，已有大量图片素材）
    path: ${CDN_PATH:D:/phpApp/gjjd_phalcon/cdn}
    url: ${CDN_URL:http://localhost:8080/api/exam/files}
    # 本地磁盘无文件时回退到生产 CDN（数据库迁移后的 upload/common 等路径）
    remote-fallback-url: ${CDN_REMOTE_FALLBACK_URL:https://cdn.app.gjjd168.com}
  wechat:
    mini:
      # 与 gjjd_phalcon WxminiController 保持一致，生产环境请用环境变量覆盖
      app-id: ${WECHAT_MINI_APP_ID:wx67133f973ccd5592}
      app-secret: ${WECHAT_MINI_APP_SECRET:a927524973ea144a9405b9739a2b2c51}
  baidu:
    api-key: ${BAIDU_API_KEY:JHKuRKyAaLiqdWRi79Bfriim}
    secret-key: ${BAIDU_SECRET_KEY:nLJlBKKsan5ArKiJNzw8NgVmU4RT94yb}
  # 报名页面公开访问地址（用于生成二维码，扫码跳转用）
  # 本地开发：http://localhost:8080  生产：https://api.gjjd168.com
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  sms:
    # false=开发模式：验证码写入 platform_sms 并打日志，不调用阿里云
    enabled: ${SMS_ENABLED:false}

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 259200
  active-timeout: -1
  is-concurrent: true
  is-share: true
  is-log: true
  token-style: uuid          # P0: tik → uuid，支持 Redis 存储
  is-read-cookie: false

logging:
  level:
    com.guoyu.platform.config.CacheConfig: INFO
    com.guoyu.platform.system.service.MenuApplicationService: INFO