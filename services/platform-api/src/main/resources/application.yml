    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:604800}
  file:
    storage-provider: ${FILE_STORAGE_PROVIDER:cos}
    local-root: ${FILE_LOCAL_ROOT:./storage/files}
    cos:
      secret-id: ${COS_SECRET_ID:AKIDTD0e8QWQ8f09TcZKzTlqiQxIUVRBjYCe}
      secret-key: ${COS_SECRET_KEY:JQM5cw52mJenjSo260kMmGeu55tZDtRp}
      region: ${COS_REGION:ap-guangzhou}
      bucket: ${COS_BUCKET:qlgysaas-1327842189}
      # 请求域名（默认访问域名）。留空会自动拼为 https://{bucket}.cos.{region}.myqcloud.com
      url-prefix: ${COS_URL_PREFIX:https://qlgysaas-1327842189.cos.ap-guangzhou.myqcloud.com}
  cdn:
