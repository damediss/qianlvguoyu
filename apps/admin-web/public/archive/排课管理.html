<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排课管理 - 智训企业版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #2A6DFF;
      --primary-hover: #1E5AE8;
      --primary-light: #E8F0FF;
      --bg: #F5F7FC;
      --card: #FFFFFF;
      --text: #1A2332;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(42, 109, 255, 0.06);
      --radius-card: 20px;
      --radius-btn: 12px;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: var(--radius-btn); transition: all 0.2s;
    }
    .back-link:hover { background: var(--primary-light); color: var(--primary); }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar .sub { font-size: 13px; color: var(--text-secondary); }
    .process-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 6px 12px;
      background: var(--primary-light); color: var(--primary);
      border-radius: 20px; font-weight: 500;
    }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stat-card .val { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat-card .val.warn { color: var(--warning); }
    .stat-card .val.danger { color: var(--danger); }
    .stat-card .lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .card-head {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-head .title-wrap { display: flex; align-items: center; gap: 10px; }
    .card-head i { color: var(--primary); }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(42, 109, 255, 0.12);
    }
    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 8px 16px; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .project-banner {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--primary-light);
      border-radius: var(--radius-btn);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px 24px;
      font-size: 13px;
    }
    .project-banner .item label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
    .project-banner .item strong { font-weight: 600; }
    .workspace-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .workspace-empty i { font-size: 40px; color: var(--border); margin-bottom: 16px; display: block; }
    .alert-banner {
      padding: 14px 18px;
      border-radius: var(--radius-btn);
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .alert-banner.warn { background: #FEF3C7; color: #92400E; }
    .alert-banner.info { background: var(--primary-light); color: var(--primary); }
    .alert-banner a { color: inherit; font-weight: 600; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th {
      text-align: left; padding: 12px 14px; font-size: 12px; color: var(--text-secondary);
      background: #FAFBFD; border-bottom: 2px solid var(--border);
    }
    .data-table td { padding: 14px; border-bottom: 1px solid var(--border); }
    .data-table tr:hover td { background: rgba(42, 109, 255, 0.02); }
    .data-table tr.conflict td { background: #FEF2F2; }
    .type-badge {
      display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
    }
    .type-theory { background: #E8F0FF; color: var(--primary); }
    .type-practice { background: #D1FAE5; color: #059669; }
    .type-exam { background: #FEF3C7; color: #D97706; }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
    }
    .status-draft { background: #F1F5F9; color: #64748B; }
    .status-published { background: #D1FAE5; color: #059669; }
    .action-btns { display: flex; gap: 6px; }
    .action-btn {
      width: 32px; height: 32px; border: none; border-radius: 8px;
      background: var(--bg); color: var(--text-secondary); cursor: pointer;
    }
    .action-btn:hover { background: var(--primary-light); color: var(--primary); }
    .action-btn.delete:hover { background: #FEE2E2; color: var(--danger); }
    .week-grid {
      display: grid;
      grid-template-columns: 72px repeat(5, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: var(--radius-btn);
      overflow: hidden;
      font-size: 12px;
    }
    .week-grid .head {
      background: #FAFBFD;
      padding: 10px 8px;
      font-weight: 600;
      text-align: center;
    }
    .week-grid .slot-label {
      background: #FAFBFD;
      padding: 8px;
      color: var(--text-secondary);
      font-size: 11px;
    }
    .week-grid .cell {
      background: var(--card);
      min-height: 64px;
      padding: 6px;
      vertical-align: top;
    }
    .week-course {
      padding: 6px 8px;
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 11px;
      line-height: 1.35;
      cursor: default;
    }
    .week-course.theory { background: #E8F0FF; border-left: 3px solid var(--primary); }
    .week-course.practice { background: #D1FAE5; border-left: 3px solid var(--success); }
    .week-course.exam { background: #FEF3C7; border-left: 3px solid var(--warning); }
    .week-course.conflict { box-shadow: inset 0 0 0 2px var(--danger); }
    .conflict-list { font-size: 13px; line-height: 1.7; }
    .conflict-list li { margin-bottom: 8px; padding: 10px 12px; background: #FEF2F2; border-radius: 8px; color: #991B1B; }
    .conflict-ok { color: var(--success); font-size: 14px; padding: 12px 0; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
    .filter-bar .form-group { margin: 0; min-width: 180px; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h3 { margin-bottom: 20px; font-size: 18px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="培训管理系统 主页面.html?panel=process" class="back-link">
        <i class="fas fa-arrow-left"></i> 返回培训流程
      </a>
      <div>
        <h1>排课管理</h1>
        <span class="sub" id="pageSub">按项目班级安排课程 · 协同工作台</span>
      </div>
    </div>
    <span class="process-badge" id="modeBadge"><i class="fas fa-calendar-alt"></i> 草案模式</span>
  </header>

  <main class="page">
    <div id="modeBanner" style="display:none;padding:14px 18px;border-radius:10px;margin-bottom:20px;background:#E8F0FF;color:#1E40AF;font-size:14px;align-items:center;gap:10px">
      <i class="fas fa-info-circle"></i>
      <span id="modeBannerText"></span>
      <a href="#" id="linkHub" style="margin-left:12px;font-weight:600">返回协同工作台</a>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="title-wrap"><i class="fas fa-folder-open"></i> 培训项目</div>
        <a href="任务档案.html" class="btn btn-secondary btn-sm"><i class="fas fa-list"></i> 任务档案</a>
      </div>
      <div class="form-group">
        <label>选择企业培训项目（排课基于该项目已建班级）</label>
        <select id="projectSelect">
          <option value="">请选择项目…</option>
        </select>
      </div>
      <div id="projectBanner" class="project-banner" style="display:none"></div>
    </div>

    <div id="workspaceEmpty" class="workspace-empty">
      <i class="fas fa-hand-pointer"></i>
      <p>请先选择<strong>企业培训项目</strong>，再为该项目各班级安排课表。</p>
      <p style="margin-top:8px;font-size:13px">需先完成 <a href="分班管理.html">分班管理</a> 建立班级；也可从任务档案进入。</p>
    </div>

    <div id="paikeWorkspace" style="display:none">
      <div id="noClassAlert" class="alert-banner warn" style="display:none">
        <i class="fas fa-exclamation-triangle"></i>
        <div>本项目尚未建立班级，请先完成 <a href="#" id="linkFenban">分班</a> 后再排课。</div>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <div class="val" id="statClasses">0</div>
          <div class="lbl">在排班级</div>
        </div>
        <div class="stat-card">
          <div class="val" id="statCourses">0</div>
          <div class="lbl">已排课程</div>
        </div>
        <div class="stat-card">
          <div class="val" id="statHours">0</div>
          <div class="lbl">本周课时</div>
        </div>
        <div class="stat-card">
          <div class="val warn" id="statConflicts">0</div>
          <div class="lbl">冲突预警</div>
        </div>
      </div>

      <!-- 排课参数 -->
      <div class="card">
        <div class="card-head">
          <div class="title-wrap"><i class="fas fa-sliders-h"></i> 排课参数</div>
          <span style="font-size:12px;color:var(--text-secondary)">对应需求：课程安排、冲突检测、课表发布</span>
        </div>
        <div class="filter-bar">
          <div class="form-group">
            <label>筛选班级</label>
            <select id="filterClass">
              <option value="">全部班级</option>
            </select>
          </div>
          <div class="form-group">
            <label>周起始日</label>
            <input type="date" id="weekStart">
          </div>
          <div class="form-group">
            <label>默认时段</label>
            <select id="defaultSlot">
              <option value="morning">上午 09:00-11:30</option>
              <option value="afternoon">下午 14:00-17:00</option>
              <option value="evening">晚上 19:00-21:00</option>
            </select>
          </div>
        </div>
        <div class="toolbar">
          <button type="button" class="btn btn-primary" id="btnSmartSchedule">
            <i class="fas fa-magic"></i> 智能排课
          </button>
          <button type="button" class="btn btn-secondary" id="btnAddCourse">
            <i class="fas fa-plus"></i> 新增课程
          </button>
          <button type="button" class="btn btn-secondary" id="btnDetectConflict">
            <i class="fas fa-search"></i> 冲突检测
          </button>
          <button type="button" class="btn btn-secondary" id="btnClearConflict" title="自动调整时间、讲师、场地以消解冲突">
            <i class="fas fa-broom"></i> 一键清除冲突
          </button>
          <button type="button" class="btn btn-secondary" id="btnViewToggle"><i class="fas fa-calendar-day"></i> 切换日视图</button>
          <button type="button" class="btn btn-secondary" id="btnExportCsv"><i class="fas fa-file-csv"></i> 导出 CSV</button>
          <button type="button" class="btn btn-secondary" id="btnExportPrint"><i class="fas fa-print"></i> 打印课表</button>
          <button type="button" class="btn btn-success" id="btnPublish">
            <i class="fas fa-bullhorn"></i> <span id="btnPublishLabel">保存课表草案</span>
          </button>
        </div>
      </div>

      <div class="grid-2">
        <!-- 周视图 -->
        <div class="card" style="margin-bottom:0">
          <div class="card-head">
            <div class="title-wrap"><i class="fas fa-calendar-week"></i> <span id="scheduleViewTitle">周课表视图</span></div>
          </div>
          <div id="weekGrid" class="week-grid"></div>
          <div id="dayGrid" style="display:none;margin-top:12px;font-size:13px;line-height:1.8"></div>
        </div>

        <!-- 冲突 -->
        <div class="card" style="margin-bottom:0">
          <div class="card-head">
            <div class="title-wrap"><i class="fas fa-exclamation-circle"></i> 冲突检测</div>
          </div>
          <div id="conflictPanel">
            <p class="conflict-ok"><i class="fas fa-check-circle"></i> 点击「冲突检测」扫描师资、场地与时间冲突</p>
          </div>
        </div>
      </div>

      <!-- 课程台账 -->
      <div class="card">
        <div class="card-head">
          <div class="title-wrap"><i class="fas fa-list-alt"></i> 课程安排台账</div>
        </div>
        <div class="table-wrap" style="overflow-x:auto">
          <table class="data-table" id="courseTable">
            <thead>
              <tr>
                <th>班级</th>
                <th>课程名称</th>
                <th>类型</th>
                <th>日期</th>
                <th>时段</th>
                <th>讲师</th>
                <th>场地</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="courseBody"></tbody>
          </table>
        </div>
      </div>

      <div style="display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap">
        <a href="#" class="btn btn-secondary" id="linkBackFenban"><i class="fas fa-users-cog"></i> 返回分班</a>
        <a href="#" class="btn btn-secondary" id="linkBackPlan"><i class="fas fa-file-alt"></i> 返回方案页</a>
        <a href="培训管理系统 主页面.html?panel=process" class="btn btn-secondary">保存并返回流程</a>
        <button type="button" class="btn btn-success" id="btnNextStep">
          <i class="fas fa-arrow-right"></i> 完成排课，进入开班
        </button>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="courseModal">
    <div class="modal-box">
      <h3 id="courseModalTitle">新增课程</h3>
      <input type="hidden" id="editCourseId">
      <div class="form-grid">
        <div class="form-group full">
          <label>所属班级</label>
          <select id="courseClassId"></select>
        </div>
        <div class="form-group full">
          <label>课程名称</label>
          <input type="text" id="courseName" placeholder="如：电工安全规范">
        </div>
        <div class="form-group">
          <label>课程类型</label>
          <select id="courseType">
            <option value="理论">理论课</option>
            <option value="实操">实操课</option>
            <option value="考核">考核</option>
          </select>
        </div>
        <div class="form-group">
          <label>上课日期</label>
          <input type="date" id="courseDate">
        </div>
        <div class="form-group">
          <label>开始时间</label>
          <input type="time" id="courseStart" value="09:00">
        </div>
        <div class="form-group">
          <label>结束时间</label>
          <input type="time" id="courseEnd" value="11:30">
        </div>
        <div class="form-group">
          <label>授课讲师</label>
          <select id="courseTeacher"></select>
        </div>
        <div class="form-group">
          <label>培训场地</label>
          <select id="courseVenue"></select>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:24px">
        <button type="button" class="btn btn-secondary" id="courseModalCancel">取消</button>
        <button type="button" class="btn btn-primary" id="courseModalSave">保存</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_TASKS = 'zhixun_tasks';
    const STORAGE_FENBAN = 'zhixun_fenban_by_project';
    const STORAGE_PAIKE = 'zhixun_paike_by_project';

    const TEACHERS = ['陈教授', '刘师傅', '周工', '吴律师', '张建国', '李秀英', '王德明', '赵志强'];
    const VENUES = ['总部培训中心', '华东实训基地A区', '华南技能中心', '柳州培训基地', '桂林教学点'];
    const SLOTS = {
      morning: { start: '09:00', end: '11:30', label: '09:00-11:30' },
      afternoon: { start: '14:00', end: '17:00', label: '14:00-17:00' },
      evening: { start: '19:00', end: '21:00', label: '19:00-21:00' }
    };
    const WEEKDAYS = ['周一', '周二', '周三', '周四', '周五'];
    const TIME_ROWS = ['上午', '下午'];

    let tasks = [];
    let currentProjectId = null;
    let currentProject = null;
    let projectClasses = [];
    let courses = [];
    let published = false;
    let conflictIds = new Set();
    let courseIdCounter = 1;
    let pageMode = 'draft';
    let viewMode = 'week';

    function loadTasks() {
      try {
        tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS) || '[]');
      } catch (e) {
        tasks = [];
      }
    }

    function getFenbanBundle(projectId) {
      try {
        const all = JSON.parse(localStorage.getItem(STORAGE_FENBAN) || '{}');
        return all[String(projectId)] || null;
      } catch (e) {
        return null;
      }
    }

    function getAllPaike() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_PAIKE) || '{}');
      } catch (e) {
        return {};
      }
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay() || 7;
      if (day !== 1) date.setDate(date.getDate() - day + 1);
      return date.toISOString().slice(0, 10);
    }

    function loadProjectData(projectId) {
      if (!projectId) return;
      const project = tasks.find(t => t.id === projectId);
      if (!project) return;

      currentProjectId = projectId;
      currentProject = project;

      const fenban = getFenbanBundle(projectId);
      projectClasses = (fenban?.classes || []).filter(c => (c.studentIds?.length || 0) > 0 || c.name);
      if (!projectClasses.length && fenban?.classes?.length) {
        projectClasses = [...fenban.classes];
      }

      const all = getAllPaike();
      let bundle = all[String(projectId)];
      if (!bundle) {
        bundle = { courses: [], published: false, weekStart: getMonday(new Date()) };
        all[String(projectId)] = bundle;
        localStorage.setItem(STORAGE_PAIKE, JSON.stringify(all));
      }

    function filteredCourses() {
      const classId = document.getElementById('filterClass').value;
      if (!classId) return courses;
      return courses.filter(c => String(c.classId) === String(classId));

    function timeToMin(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function timesOverlap(s1, e1, s2, e2) {
      return timeToMin(s1) < timeToMin(e2) && timeToMin(s2) < timeToMin(e1);
    }

    function coursesConflict(a, b) {
      if (a.id === b.id) return false;
      if (a.date !== b.date) return false;
      if (!timesOverlap(a.startTime, a.endTime, b.startTime, b.endTime)) return false;
      if (a.teacher === b.teacher) return true;
      if (a.venue === b.venue) return true;
      if (a.classId === b.classId) return true;
      return false;
    }

    function courseHasConflict(c, others) {
      return others.some(o => coursesConflict(c, o));
    }

    function detectConflicts() {
      conflictIds = new Set();
      const list = [];
      for (let i = 0; i < courses.length; i++) {
        for (let j = i + 1; j < courses.length; j++) {
          const a = courses[i];
          const b = courses[j];
          if (!coursesConflict(a, b)) continue;

          let reason = '';
          if (a.teacher === b.teacher) reason = `讲师「${a.teacher}」时间冲突`;
          else if (a.venue === b.venue) reason = `场地「${a.venue}」时间冲突`;
          else reason = `班级「${a.className || b.className}」课程时间重叠`;

          conflictIds.add(a.id);
          conflictIds.add(b.id);
          list.push(`${a.date} ${a.startTime}-${a.endTime}：${a.courseName} 与 ${b.courseName} — ${reason}`);
        }
      }
      return list;
    }

    function clearConflicts() {
      if (!courses.length) {
        alert('暂无课程安排');
        return;
      }
      let before = detectConflicts().length;
      if (!before) {
        alert('当前无冲突，无需清除');
        return;
      }
      if (!confirm(`检测到 ${before} 处冲突，将自动调整时间/讲师/场地进行消解，是否继续？`)) return;

      const dates = getWeekDates();
      const slotOptions = [SLOTS.morning, SLOTS.afternoon, SLOTS.evening];
      let fixCount = 0;
      const maxPasses = 80;

      for (let pass = 0; pass < maxPasses; pass++) {
        const list = detectConflicts();
        if (!list.length) break;

        const idsToFix = [...conflictIds].sort((a, b) => b - a);
        let progressed = false;

        for (const id of idsToFix) {
          const c = courses.find(x => x.id === id);
          if (!c) continue;
          const others = courses.filter(x => x.id !== c.id);

          let fixed = false;
          outer: for (const date of dates) {
            for (const slot of slotOptions) {
              for (let ti = 0; ti < TEACHERS.length; ti++) {
                for (let vi = 0; vi < VENUES.length; vi++) {
                  const trial = {
                    ...c,
                    date,
                    startTime: slot.start,
                    endTime: slot.end,
                    teacher: TEACHERS[ti],
                    venue: VENUES[vi]
                  };
                  if (!courseHasConflict(trial, others)) {
                    c.date = date;
                    c.startTime = slot.start;
                    c.endTime = slot.end;
                    c.teacher = TEACHERS[ti];
                    c.venue = VENUES[vi];
                    fixCount++;
                    fixed = true;
                    progressed = true;
                    break outer;
                  }
                }
              }
            }
          }
        }

        if (!progressed) break;
      }

      saveData();
      const remaining = detectConflicts().length;
      renderAll();
      if (remaining === 0) {
        alert(`冲突已清除：共自动调整 ${fixCount} 项排课安排`);
      } else {
        alert(`已调整 ${fixCount} 项，仍有 ${remaining} 处冲突（课量过密时可删减课程或扩展周次）`);
      }
    }

    function renderConflictPanel() {

      if (!list.length) {

      panel.innerHTML = '<ul class="conflict-list">' + list.map(x => `<li><i class="fas fa-times-circle"></i> ${x}</li>`).join('') + '</ul>';
    }

    function courseHours() {
      return courses.reduce((sum, c) => {
        const mins = timeToMin(c.endTime) - timeToMin(c.startTime);
        return sum + (mins > 0 ? mins / 60 : 0);
      }, 0);
    }

    function getWeekDates() {
      const start = document.getElementById('weekStart').value;
      const dates = [];
      const base = new Date(start + 'T00:00:00');
      for (let i = 0; i < 5; i++) {
        const d = new Date(base);
        d.setDate(base.getDate() + i);
        dates.push(d.toISOString().slice(0, 10));
      }
      return dates;
    }

    function renderWeekGrid() {
      const grid = document.getElementById('weekGrid');
      const dates = getWeekDates();
      const list = filteredCourses();

      let html = '<div class="head"></div>';
      dates.forEach((d, i) => {
        html += `<div class="head">${WEEKDAYS[i]}<br><span style="font-weight:400;font-size:11px;color:var(--text-secondary)">${d.slice(5)}</span></div>`;
      });

      TIME_ROWS.forEach(row => {
        html += `<div class="slot-label">${row}</div>`;
        dates.forEach(date => {
          const slotCourses = list.filter(c => {
            if (c.date !== date) return false;
            const mid = timeToMin(c.startTime);
            if (row === '上午') return mid < 12 * 60;
            return mid >= 12 * 60;
          });
          html += '<div class="cell">';
          slotCourses.forEach(c => {
            const cls = typeClass(c.courseType);
            const conflict = conflictIds.has(c.id) ? ' conflict' : '';
            html += `<div class="week-course ${cls}${conflict}" title="${c.teacher} · ${c.venue}">
              <strong>${c.courseName}</strong><br>${c.className}<br>${c.startTime}-${c.endTime}
            </div>`;
          });
          html += '</div>';
        });
      });

      grid.innerHTML = html;
    }

    function courseTemplates(occupation) {
      const occ = occupation || '通用';
      return [
        { name: `${occ}安全规范`, type: '理论' },
        { name: `${occ}理论基础`, type: '理论' },
        { name: `${occ}工艺实操`, type: '实操' },

    function smartSchedule() {
      if (!projectClasses.length) {
        alert('请先在分班环节建立班级');
        return;
      }
      if (courses.length && !confirm('将追加智能排课结果，是否继续？')) return;

      const weekStart = document.getElementById('weekStart').value;
      const slotKey = document.getElementById('defaultSlot').value;
      const slot = SLOTS[slotKey];
      const dates = getWeekDates();
      const templates = courseTemplates(currentProject?.occupation);
      let added = 0;

      projectClasses.forEach((cls, ci) => {
        templates.forEach((tpl, ti) => {
          const useAfternoon = tpl.type === '实操' || tpl.type === '考核';
          const preferred = useAfternoon ? [SLOTS.afternoon, SLOTS.morning, SLOTS.evening] : [SLOTS.morning, SLOTS.afternoon, SLOTS.evening];
          let placed = false;
          for (let dOff = 0; dOff < dates.length && !placed; dOff++) {
            const date = dates[(ci * 2 + ti + dOff) % dates.length];
            for (const s of preferred) {
              for (let ti2 = 0; ti2 < TEACHERS.length; ti2++) {
                for (let vi = 0; vi < VENUES.length; vi++) {
                  const teacher = TEACHERS[(ci + ti + ti2) % TEACHERS.length];
                  const venue = VENUES[(ci + vi) % VENUES.length];
                  const trial = {
                    id: -1,
                    classId: cls.id,
                    className: cls.name,
                    courseName: tpl.name,
                    courseType: tpl.type,
                    date,
                    startTime: s.start,
                    endTime: s.end,
                    teacher,
                    venue,
                    status: '草稿'
                  };
                  if (!courseHasConflict(trial, courses)) {
                    courses.push({ ...trial, id: courseIdCounter++ });
                    added++;
                    placed = true;
                    break;
                  }
                }
                if (placed) break;
              }
              if (placed) break;
            }
          }
        });
      });

      saveData();
      detectConflicts();
      renderAll();
      alert(`智能排课完成：为本项目 ${projectClasses.length} 个班级共安排 ${added} 节课`);
    }

          url.searchParams.delete('projectId');
          history.replaceState(null, '', url);
          return;
        }
        if (currentProjectId) saveData();
        const url = new URL(window.location.href);
        url.searchParams.set('projectId', v);
        history.replaceState(null, '', url);
        loadProjectData(parseInt(v, 10));
      });
    });
  </script>
</body>
</html>
