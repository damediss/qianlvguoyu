# =============================================================================
# 千铝国昱云平台 / 公网测试环境 nginx 配置(IP 直连,无域名,无 HTTPS)
# 用法:
#   1) sudo cp deploy/nginx.conf /etc/nginx/sites-available/guoyu
#   2) sudo ln -sf /etc/nginx/sites-available/guoyu /etc/nginx/sites-enabled/guoyu
#   3) sudo nginx -t && sudo systemctl reload nginx
# 假设:
#   - 公网 IP: $PUBLIC_IP(从 .env 读)
#   - 前端 dist: /data/guoyu/web/dist(Vite build 产物)
#   - 后端 jar: /data/guoyu/platform-api-0.1.0-SNAPSHOT.jar(systemd 守护,监听 127.0.0.1:8080)
#   - local 文件存储目录: /data/guoyu/storage/files(COS 模式可忽略)
# =============================================================================

# 上传/导出/模板 xlsx 较大,需要放大 body 限制
client_max_body_size 50M;
client_body_buffer_size 1M;
client_body_timeout 120s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_connect_timeout 30s;

# gzip 压缩静态资源
gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/x-font-ttf font/opentype;
gzip_vary on;

# ========== HTTP 服务(IP 直连,默认 80) ==========
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;  # 任意 hostname(IP 直连场景)

    # ---- 1) 前端 SPA ----
    root /data/guoyu/web/dist;
    index index.html;

    # favicon / 静态资源
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 路由 fallback(让 React Router 自己处理)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 2) 后端 API 反代 ----
    location /api/ {
        # CORS 预检:OPTIONS 直接在 nginx 层返回,避免请求到 Java 后又被拒
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Tenant-Id' always;
            add_header 'Access-Control-Max-Age' 3600 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 文件上传大 body
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ---- 3) health check (LB / 监控用) ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 4) access log ----
    access_log /var/log/nginx/guoyu.access.log;
    error_log  /var/log/nginx/guoyu.error.log warn;
}
