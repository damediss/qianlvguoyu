<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目回款 - 智训企业版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #2A6DFF;
      --primary-hover: #1E5AE8;
      --primary-light: #E8F0FF;
      --bg: #F5F7FC;
      --card: #FFFFFF;
      --text: #1A2332;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(42, 109, 255, 0.06);
      --radius-card: 20px;
      --radius-btn: 12px;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: var(--radius-btn); transition: all 0.2s;
    }
    .back-link:hover { background: var(--primary-light); color: var(--primary); }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar .sub { font-size: 13px; color: var(--text-secondary); }
    .process-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 6px 12px;
      background: #FFF7ED; color: #D97706;
      border-radius: 20px; font-weight: 500;
    }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stat-card .val { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat-card .val.success { color: var(--success); }
    .stat-card .val.warn { color: var(--warning); }
    .stat-card .val.danger { color: var(--danger); }
    .stat-card .lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .card-head {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-head .title-wrap { display: flex; align-items: center; gap: 10px; }
    .card-head i { color: var(--primary); }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
    }
    .form-group textarea { min-height: 72px; resize: vertical; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 8px 16px; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .project-banner {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--primary-light);
      border-radius: var(--radius-btn);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px 24px;
      font-size: 13px;
    }
    .project-banner .item label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
    .workspace-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .workspace-empty i { font-size: 40px; color: var(--border); margin-bottom: 16px; display: block; }
    .flow-steps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .flow-step {
      flex: 1; min-width: 120px; text-align: center; padding: 12px 8px;
      border-radius: var(--radius-btn); background: var(--bg);
      font-size: 12px; color: var(--text-secondary);
    }
    .flow-step.done { background: #D1FAE5; color: #059669; font-weight: 600; }
    .flow-step.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .flow-step i { display: block; font-size: 18px; margin-bottom: 6px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th {
      text-align: left; padding: 12px 14px; font-size: 12px; color: var(--text-secondary);
      background: #FAFBFD; border-bottom: 2px solid var(--border);
    }
    .data-table td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
    }
    .st-pending { background: #FEF3C7; color: #D97706; }
    .st-done { background: #D1FAE5; color: #059669; }
    .st-draft { background: #F1F5F9; color: #64748B; }
    .st-overdue { background: #FEE2E2; color: #DC2626; }
    .st-partial { background: #E8F0FF; color: var(--primary); }
    .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn {
      padding: 10px 18px; border: 1px solid var(--border); border-radius: var(--radius-btn);
      background: var(--card); font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; color: var(--text-secondary);
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .panel { display: none; }
    .panel.active { display: block; }
    .alert-banner {
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .alert-banner.warn { background: #FEF3C7; color: #92400E; }
    .settlement-box {
      padding: 20px;
      background: var(--bg);
      border-radius: var(--radius-btn);
      margin-top: 16px;
    }
    .settlement-box .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 14px;
    }
    .settlement-box .row:last-child { border-bottom: none; font-weight: 700; font-size: 16px; }
    .approval-track {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }
    .approval-node {
      flex: 1;
      min-width: 140px;
      padding: 14px;
      border-radius: var(--radius-btn);
      background: var(--bg);
      text-align: center;
      font-size: 13px;
    }
    .approval-node.done { background: #D1FAE5; color: #059669; }
    .approval-node.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="培训管理系统 主页面.html?panel=process" class="back-link">
        <i class="fas fa-arrow-left"></i> 返回培训流程
      </a>
      <div>
        <h1>项目回款</h1>
        <span class="sub" id="pageSub">合同回款与项目结算 · 步骤 9 / 9</span>
      </div>
    </div>
    <span class="process-badge"><i class="fas fa-yen-sign"></i> … → 结业 → 回款 ✓</span>
  </header>

  <main class="page">
    <div class="card">
      <div class="card-head">
        <div class="title-wrap"><i class="fas fa-folder-open"></i> 培训项目</div>
        <a href="任务档案.html" class="btn btn-secondary btn-sm"><i class="fas fa-list"></i> 任务档案</a>
      </div>
      <div class="form-group">
        <label>选择企业培训项目</label>
        <select id="projectSelect"><option value="">请选择项目…</option></select>
      </div>
      <div id="projectBanner" class="project-banner" style="display:none"></div>
    </div>

    <div id="workspaceEmpty" class="workspace-empty">
      <i class="fas fa-hand-pointer"></i>
      <p>请先选择<strong>企业培训项目</strong>，再管理回款计划、收款登记与项目结算。</p>
      <p style="margin-top:8px;font-size:13px">建议先完成 <a href="结业.html">结业</a> 与 <a href="申报.html">申报</a>；也可从任务档案进入。</p>
    </div>

    <div id="huikuanWorkspace" style="display:none">
      <div id="overdueAlert" class="alert-banner warn" style="display:none">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="overdueText"></span>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <div class="val" id="statContract">0</div>
          <div class="lbl">合同金额（万）</div>
        </div>
        <div class="stat-card">
          <div class="val success" id="statReceived">0</div>
          <div class="lbl">已回款（万）</div>
        </div>
        <div class="stat-card">
          <div class="val warn" id="statPending">0</div>
          <div class="lbl">待回款（万）</div>
        </div>
        <div class="stat-card">
          <div class="val" id="statRate">0%</div>
          <div class="lbl">回款率</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="title-wrap"><i class="fas fa-route"></i> 回款与结算流程</div>
          <span style="font-size:12px;color:var(--text-secondary)">回款计划 → 收款登记 → 项目结算 → 审批结案</span>
        </div>
        <div class="flow-steps" id="flowSteps"></div>
        <div class="form-grid" style="margin-bottom:20px">
          <div class="form-group">
            <label>培训合同金额（元）</label>
            <input type="number" id="contractAmount" min="0" placeholder="企业培训服务合同总额">
          </div>
          <div class="form-group">
            <label>补贴拨款状态（来自申报）</label>
            <input type="text" id="subsidyRefundStatus" readonly>
          </div>
          <div class="form-group">
            <label>预计补贴金额（元）</label>
            <input type="number" id="subsidyAmount" readonly>
          </div>
          <div class="form-group">
            <label>机构分成比例（%）</label>
            <input type="number" id="orgSharePct" min="0" max="100" value="70">
          </div>
        </div>
        <div class="toolbar">
          <button type="button" class="btn btn-primary btn-sm" id="btnGenPlan">
            <i class="fas fa-calendar-check"></i> 生成回款计划
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnRegisterPay">
            <i class="fas fa-hand-holding-usd"></i> 登记收款
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnGenSettlement">
            <i class="fas fa-file-invoice-dollar"></i> 生成结算单
          </button>
          <button type="button" class="btn btn-success btn-sm" id="btnSubmitApproval">
            <i class="fas fa-stamp"></i> 提交结算审批
          </button>
        </div>

        <div class="tab-bar">
          <button type="button" class="tab-btn active" data-tab="plan">回款计划</button>
          <button type="button" class="tab-btn" data-tab="payment">收款明细</button>
          <button type="button" class="tab-btn" data-tab="settlement">项目结算</button>
        </div>

        <div id="panel-plan" class="panel active">
          <div class="table-wrap" style="overflow-x:auto">
            <table class="data-table">
              <thead>
                <tr>
                  <th>期次</th>
                  <th>计划回款日</th>
                  <th>计划金额（元）</th>
                  <th>账龄</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="planBody"></tbody>
            </table>
          </div>
        </div>

        <div id="panel-payment" class="panel">
          <div class="table-wrap" style="overflow-x:auto">
            <table class="data-table">
              <thead>
                <tr>
                  <th>收款日期</th>
                  <th>金额（元）</th>
                  <th>对应期次</th>
                  <th>方式</th>
                  <th>备注</th>
                </tr>
              </thead>
              <tbody id="paymentBody"></tbody>
            </table>
          </div>
        </div>

        <div id="panel-settlement" class="panel">
          <div id="settlementEmpty" style="text-align:center;padding:32px;color:var(--text-secondary)">
            请先生成项目结算单
          </div>
          <div id="settlementContent" style="display:none">
            <div class="settlement-box" id="settlementDetail"></div>
            <div class="approval-track" id="approvalTrack"></div>
            <div class="form-group" style="margin-top:20px">
              <label>项目总结摘要</label>
              <textarea id="projectSummary" placeholder="填写项目结算说明、经验沉淀要点（可选）"></textarea>
            </div>
          </div>
        </div>
      </div>

      <div style="display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap">
        <a href="结业.html" class="btn btn-secondary" id="linkBackJieye"><i class="fas fa-graduation-cap"></i> 返回结业</a>
        <a href="培训管理系统 主页面.html?panel=process" class="btn btn-secondary">保存并返回流程</a>
        <button type="button" class="btn btn-success" id="btnFinish">
          <i class="fas fa-check-circle"></i> 完成全流程
        </button>
      </div>
    </div>
  </main>

  <script>
    const STORAGE_TASKS = 'zhixun_tasks';
    const STORAGE_SHENBAO = 'zhixun_shenbao_by_project';
    const STORAGE_HUIKUAN = 'zhixun_huikuan_by_project';

    const FLOW_LABELS = ['回款计划', '收款登记', '项目结算', '审批结案'];
    const APPROVAL_NODES = ['培训部提交', '财务复核', '总经理审批', '企业确认'];

    let tasks = [];
    let currentProjectId = null;
    let currentProject = null;
    let data = null;

    function loadTasks() {
      try { tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS) || '[]'); }
      catch (e) { tasks = []; }
    }

    function getStore(key) {
      try { return JSON.parse(localStorage.getItem(key) || '{}'); }
      catch (e) { return {}; }
    }

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function formatWan(yuan) {
      return (yuan / 10000).toFixed(2);
    }

    function defaultContractAmount(project) {
      const n = project.planCount || 40;
      return n * 45000;
    }

    function getShenbao(projectId) {
      return getStore(STORAGE_SHENBAO)[String(projectId)] || null;
    }

    function initData(projectId, saved, project) {
      const shenbao = getShenbao(projectId);
      if (saved) {
        return {
          ...saved,
          paymentPlan: (saved.paymentPlan || []).map(p => ({ ...p })),
          payments: (saved.payments || []).map(p => ({ ...p }))
        };
      }
      const contract = defaultContractAmount(project);
      return {
        projectId,
        contractAmount: contract,
        planGenerated: false,
        paymentPlan: [],
        payments: [],
        orgSharePct: 70,
        settlement: {
          generated: false,
          orgAmount: 0,
          enterpriseAmount: 0,
          subsidyAmount: shenbao?.subsidyAmount || 0,
          approvalStatus: '草稿',
          approvalStep: 0
        },
        projectSummary: '',
        projectClosed: false
      };
    }

    function totalReceived() {
      return (data.payments || []).reduce((s, p) => s + (p.amount || 0), 0);
    }

    function syncPlanStatus() {
      if (!data.paymentPlan.length) return;
      const received = totalReceived();
      let allocated = 0;
      data.paymentPlan.forEach(plan => {
        const planAmt = plan.amount || 0;
        if (allocated + planAmt <= received) {
          plan.status = '已回款';
          allocated += planAmt;
        } else if (allocated < received) {
          plan.status = '部分回款';
          allocated = received;
        } else {
          const due = new Date(plan.dueDate);
          const today = new Date(todayStr());
          plan.status = due < today ? '逾期' : '待回款';
        }
      });
    }

    function loadProjectData(projectId) {
      const project = tasks.find(t => t.id === projectId);
      if (!project) return;
      currentProjectId = projectId;
      currentProject = project;

      const all = getStore(STORAGE_HUIKUAN);
      data = initData(projectId, all[String(projectId)], project);
      all[String(projectId)] = data;
      localStorage.setItem(STORAGE_HUIKUAN, JSON.stringify(all));

      const shenbao = getShenbao(projectId);
      document.getElementById('linkBackJieye').href = `结业.html?projectId=${projectId}`;
      document.getElementById('contractAmount').value = data.contractAmount || '';
      document.getElementById('orgSharePct').value = data.orgSharePct ?? 70;
      document.getElementById('subsidyRefundStatus').value = shenbao?.refundStatus || '未申报';
      document.getElementById('subsidyAmount').value = shenbao?.subsidyAmount || data.settlement?.subsidyAmount || 0;
      document.getElementById('projectSummary').value = data.projectSummary || '';

      renderProjectBanner();
      toggleWorkspace(true);
      renderAll();
    }

    function saveData() {
      if (!currentProjectId || !data) return;
      data.contractAmount = +document.getElementById('contractAmount').value || 0;
      data.orgSharePct = +document.getElementById('orgSharePct').value || 70;
      data.projectSummary = document.getElementById('projectSummary').value;
      syncPlanStatus();
      const all = getStore(STORAGE_HUIKUAN);
      all[String(currentProjectId)] = data;
      localStorage.setItem(STORAGE_HUIKUAN, JSON.stringify(all));
    }

    function renderProjectBanner() {
      const p = currentProject;
      const contract = data.contractAmount || 0;
      const received = totalReceived();
      document.getElementById('projectBanner').style.display = 'grid';
      document.getElementById('projectBanner').innerHTML = `
        <div class="item"><label>企业</label><strong>${p.enterprise || '—'}</strong></div>
        <div class="item"><label>培训项目</label><strong>${p.name || '—'}</strong></div>
        <div class="item"><label>合同金额</label><strong>${formatWan(contract)} 万</strong></div>
        <div class="item"><label>已回款</label><strong>${formatWan(received)} 万</strong></div>
        <div class="item"><label>结算状态</label><strong>${data.settlement?.approvalStatus || '草稿'}</strong></div>
      `;
      document.getElementById('pageSub').textContent = `${p.enterprise || ''} · ${p.name || ''} · 步骤 9 / 9`;
    }

    function toggleWorkspace(show) {
      document.getElementById('huikuanWorkspace').style.display = show ? 'block' : 'none';
      document.getElementById('workspaceEmpty').style.display = show ? 'none' : 'block';
    }

    function populateProjectSelect() {
      document.getElementById('projectSelect').innerHTML =
        '<option value="">请选择项目…</option>' +
        tasks.map(t => `<option value="${t.id}">${t.enterprise || '—'} · ${t.name}</option>`).join('');
    }

    function updateStats() {
      const contract = data.contractAmount || 0;
      const received = totalReceived();
      const pending = Math.max(0, contract - received);
      const rate = contract ? Math.round((received / contract) * 100) : 0;
      document.getElementById('statContract').textContent = formatWan(contract);
      document.getElementById('statReceived').textContent = formatWan(received);
      document.getElementById('statPending').textContent = formatWan(pending);
      document.getElementById('statRate').textContent = rate + '%';
      document.getElementById('statRate').className = 'val' + (rate >= 100 ? ' success' : rate >= 50 ? '' : ' warn');

      const overdue = (data.paymentPlan || []).filter(p => p.status === '逾期');
      const alertEl = document.getElementById('overdueAlert');
      if (overdue.length) {
        alertEl.style.display = 'block';
        document.getElementById('overdueText').textContent =
          `有 ${overdue.length} 期回款计划已逾期，请跟进企业付款或更新收款登记。`;
      } else {
        alertEl.style.display = 'none';
      }
    }

    function agingLabel(dueDate) {
      const due = new Date(dueDate);
      const today = new Date(todayStr());
      const days = Math.floor((today - due) / (86400000));
      if (days < 0) return `剩余 ${-days} 天`;
      if (days === 0) return '今日到期';
      if (days <= 30) return `${days} 天`;
      if (days <= 90) return `31-90天`;
      return `90天以上`;
    }

    function planStatusClass(st) {
      if (st === '已回款') return 'st-done';
      if (st === '逾期') return 'st-overdue';
      if (st === '部分回款') return 'st-partial';
      return 'st-pending';
    }

    function flowStep() {
      if (data.projectClosed || data.settlement?.approvalStatus === '已结案') return 4;
      if (data.settlement?.approvalStatus === '审批中' || data.settlement?.approvalStatus === '已通过') return 3;
      if (data.settlement?.generated) return 2;
      if (data.payments?.length) return 1;
      if (data.planGenerated) return 1;
      return 0;
    }

    function renderFlowSteps() {
      const step = Math.min(flowStep(), 3);
      const icons = ['fa-calendar-check', 'fa-hand-holding-usd', 'fa-file-invoice-dollar', 'fa-stamp'];
      document.getElementById('flowSteps').innerHTML = FLOW_LABELS.map((label, i) => {
        let cls = 'flow-step';
        if (i < step) cls += ' done';
        else if (i === step) cls += ' active';
        return `<div class="${cls}"><i class="fas ${icons[i]}"></i>${label}</div>`;
      }).join('');
    }

    function renderPlanTable() {
      const tbody = document.getElementById('planBody');
      syncPlanStatus();
      if (!data.paymentPlan.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-secondary)">请点击「生成回款计划」</td></tr>';
        return;
      }
      tbody.innerHTML = data.paymentPlan.map(p => `
        <tr>
          <td><strong>${p.phase}</strong></td>
          <td>${p.dueDate}</td>
          <td>${(p.amount || 0).toLocaleString()}</td>
          <td>${agingLabel(p.dueDate)}</td>
          <td><span class="status-badge ${planStatusClass(p.status)}">${p.status}</span></td>
        </tr>
      `).join('');
    }

    function renderPaymentTable() {
      const tbody = document.getElementById('paymentBody');
      if (!data.payments.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-secondary)">暂无收款记录</td></tr>';
        return;
      }
      tbody.innerHTML = data.payments.map(p => `
        <tr>
          <td>${p.date}</td>
          <td>${(p.amount || 0).toLocaleString()}</td>
          <td>${p.phase || '—'}</td>
          <td>${p.method || '银行转账'}</td>
          <td>${p.remark || '—'}</td>
        </tr>
      `).join('');
    }

    function renderSettlement() {
      const empty = document.getElementById('settlementEmpty');
      const content = document.getElementById('settlementContent');
      if (!data.settlement?.generated) {
        empty.style.display = 'block';
        content.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      content.style.display = 'block';
      const s = data.settlement;
      const contract = data.contractAmount || 0;
      const received = totalReceived();
      const subsidy = s.subsidyAmount || 0;
      document.getElementById('settlementDetail').innerHTML = `
        <div class="row"><span>培训合同总额</span><span>${contract.toLocaleString()} 元</span></div>
        <div class="row"><span>累计已回款</span><span>${received.toLocaleString()} 元</span></div>
        <div class="row"><span>补贴到账（预计）</span><span>${subsidy.toLocaleString()} 元</span></div>
        <div class="row"><span>机构分成（${data.orgSharePct}%）</span><span>${s.orgAmount.toLocaleString()} 元</span></div>
        <div class="row"><span>企业结算份额</span><span>${s.enterpriseAmount.toLocaleString()} 元</span></div>
        <div class="row"><span>结算单状态</span><span>${s.approvalStatus}</span></div>
      `;
      const step = s.approvalStep || 0;
      document.getElementById('approvalTrack').innerHTML = APPROVAL_NODES.map((name, i) => {
        let cls = 'approval-node';
        if (i < step) cls += ' done';
        else if (i === step && s.approvalStatus === '审批中') cls += ' active';
        else if (s.approvalStatus === '已结案' || s.approvalStatus === '已通过') cls += ' done';
        return `<div class="${cls}">${name}</div>`;
      }).join('');
    }

    function renderAll() {
      updateStats();
      renderFlowSteps();
      renderPlanTable();
      renderPaymentTable();
      renderSettlement();
      renderProjectBanner();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('btnGenPlan').addEventListener('click', () => {
      const contract = +document.getElementById('contractAmount').value || data.contractAmount;
      if (!contract) { alert('请填写培训合同金额'); return; }
      data.contractAmount = contract;
      const p1 = Math.round(contract * 0.4);
      const p2 = Math.round(contract * 0.4);
      const p3 = contract - p1 - p2;
      const base = new Date();
      const addDays = d => {
        const x = new Date(base);
        x.setDate(x.getDate() + d);
        return x.toISOString().slice(0, 10);
      };
      data.paymentPlan = [
        { phase: '首期（40%）', dueDate: addDays(0), amount: p1, status: '待回款' },
        { phase: '中期（40%）', dueDate: addDays(60), amount: p2, status: '待回款' },
        { phase: '尾款（20%）', dueDate: addDays(120), amount: p3, status: '待回款' }
      ];
      data.planGenerated = true;
      saveData();
      renderAll();
      alert('已生成三期回款计划（演示）');
    });

    document.getElementById('btnRegisterPay').addEventListener('click', () => {
      if (!data.planGenerated) { alert('请先生成回款计划'); return; }
      const pending = data.paymentPlan.find(p => p.status !== '已回款');
      const phase = pending?.phase || '补充收款';
      const amountStr = prompt(`登记收款金额（元）\n对应期次：${phase}`, pending ? String(pending.amount) : '');
      if (amountStr === null) return;
      const amount = +amountStr;
      if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
      data.payments.push({
        id: Date.now(),
        date: todayStr(),
        amount,
        phase,
        method: '银行转账',
        remark: '企业付款'
      });
      syncPlanStatus();
      saveData();
      renderAll();
      alert(`已登记收款 ${amount.toLocaleString()} 元（演示）`);
    });

    document.getElementById('btnGenSettlement').addEventListener('click', () => {
      const contract = data.contractAmount || 0;
      const received = totalReceived();
      if (!contract) { alert('请填写合同金额'); return; }
      const shenbao = getShenbao(currentProjectId);
      const subsidy = shenbao?.subsidyAmount || 0;
      const totalSettle = received + (shenbao?.refundStatus === '已拨款' ? subsidy : 0);
      const orgPct = +document.getElementById('orgSharePct').value || 70;
      data.orgSharePct = orgPct;
      data.settlement = {
        generated: true,
        orgAmount: Math.round(totalSettle * orgPct / 100),
        enterpriseAmount: Math.round(totalSettle * (100 - orgPct) / 100),
        subsidyAmount: subsidy,
        approvalStatus: '草稿',
        approvalStep: 0
      };
      saveData();
      renderAll();
      alert('项目结算单已生成（演示）');
    });

    document.getElementById('btnSubmitApproval').addEventListener('click', () => {
      if (!data.settlement?.generated) { alert('请先生成结算单'); return; }
      const s = data.settlement;
      if (s.approvalStatus === '草稿') {
        s.approvalStatus = '审批中';
        s.approvalStep = 1;
        alert('结算单已提交，进入财务复核（演示）');
      } else if (s.approvalStatus === '审批中') {
        if (s.approvalStep < APPROVAL_NODES.length) {
          s.approvalStep++;
          if (s.approvalStep >= APPROVAL_NODES.length) {
            s.approvalStatus = '已通过';
            alert('结算审批已全部通过（演示）');
          } else {
            alert(`当前节点：${APPROVAL_NODES[s.approvalStep]}（演示）`);
          }
        }
      } else if (s.approvalStatus === '已通过') {
        s.approvalStatus = '已结案';
        data.projectClosed = true;
        alert('项目已结案，全流程完成（演示）');
      } else {
        alert('当前状态：' + s.approvalStatus);
        return;
      }
      saveData();
      renderAll();
    });

    document.getElementById('contractAmount').addEventListener('change', saveData);
    document.getElementById('orgSharePct').addEventListener('change', saveData);
    document.getElementById('projectSummary').addEventListener('blur', saveData);

    document.getElementById('btnFinish').addEventListener('click', () => {
      if (!currentProjectId) { alert('请先选择项目'); return; }
      saveData();
      if (!data.projectClosed && data.settlement?.approvalStatus !== '已结案') {
        if (!confirm('项目尚未结案，仍要返回流程首页吗？')) return;
      }
      alert(`项目「${currentProject?.name || ''}」回款信息已保存，培训全流程结束。`);
      window.location.href = '培训管理系统 主页面.html?panel=process';
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      populateProjectSelect();
      const params = new URLSearchParams(window.location.search);
      const pid = params.get('projectId');
      if (pid && tasks.some(t => String(t.id) === String(pid))) {
        document.getElementById('projectSelect').value = pid;
        loadProjectData(parseInt(pid, 10));
      } else {
        toggleWorkspace(false);
      }
      document.getElementById('projectSelect').addEventListener('change', e => {
        const v = e.target.value;
        if (!v) {
          if (currentProjectId) saveData();
          currentProjectId = null;
          currentProject = null;
          data = null;
          toggleWorkspace(false);
          document.getElementById('projectBanner').style.display = 'none';
          document.getElementById('pageSub').textContent = '合同回款与项目结算 · 步骤 9 / 9';
          const url = new URL(window.location.href);
          url.searchParams.delete('projectId');
          history.replaceState(null, '', url);
          return;
        }
        if (currentProjectId) saveData();
        const url = new URL(window.location.href);
        url.searchParams.set('projectId', v);
        history.replaceState(null, '', url);
        loadProjectData(parseInt(v, 10));
      });
    });
  </script>
</body>
</html>
