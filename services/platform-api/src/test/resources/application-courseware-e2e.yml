# EA 级 E2E profile(CoursewareE2ETest):真实 MySQL 测试库 gjjddb2026 + 真实 Flyway 迁移
# + 本地文件存储(不依赖 COS)。
# 背景:测试 classpath 的 application.yml 遮蔽 main/resources/application.yml(Spring Boot 单文件
# 解析),故本 profile 重建关键段;dev 测试库密码与主 yml/AGENTS.md 公开的本地开发凭据一致,不含生产密钥。
# 2026-10-24 测试库已迁至 114.132.67.185:3309(原 43.138.163.7:3308 已废弃),默认值同步更新。
server:
  servlet:
    context-path: /api

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${MYSQL_URL:}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 2
      max-active: 20
      # 测试池同样要给 wall 拦 PREPARE 留路:迁移走独立直连(同主 yml 口径,踩坑 #25)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

flowable:
  database-schema-update: true
  database-type: mysql
  async-executor-activate: true
  check-process-definitions: false

platform:
  file:
    storage-provider: local
    local-root: ./target/courseware-e2e-files

# 主 yml 的 sa-token 段被测试 classpath application.yml 遮蔽,必须在此重建
# (缺省 token-name=satoken,会导致 Authorization: Bearer 头读不到 token,全链路 401)
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 259200
  active-timeout: -1
  is-concurrent: true
  is-share: true
  is-log: true
  token-style: uuid
  is-read-cookie: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    cn.dev33.satoken: DEBUG
    com.guoyu.platform.security.filter: DEBUG
