<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务档案 - 智训企业版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #2A6DFF;
      --primary-hover: #1E5AE8;
      --primary-light: #E8F0FF;
      --bg: #F5F7FC;
      --card: #FFFFFF;
      --text: #1A2332;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(42, 109, 255, 0.06);
      --radius-card: 20px;
      --radius-btn: 12px;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: var(--radius-btn); transition: all 0.2s;
    }
    .back-link:hover { background: var(--primary-light); color: var(--primary); }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar .sub { font-size: 13px; color: var(--text-secondary); font-weight: 400; }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 20px 22px;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .stat-card:hover, .stat-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .stat-card .val { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat-card .lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }
    .search-box input {
      width: 100%;
      padding: 11px 16px 11px 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
    }
    .filter-select {
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      background: var(--card);
      min-width: 120px;
    }
    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg); }
    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left;
      padding: 14px 16px;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 12px;
      background: #FAFBFD;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: rgba(42, 109, 255, 0.02); }
    tr.clickable { cursor: pointer; }
    .task-name { font-weight: 500; color: var(--text); }
    .task-code { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
    .priority-badge, .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .priority-high { background: #FEE2E2; color: #DC2626; }
    .priority-medium { background: #FEF3C7; color: #D97706; }
    .priority-low { background: #D1FAE5; color: #059669; }
    .status-active { background: #D1FAE5; color: #059669; }
    .status-draft { background: #F1F5F9; color: #64748B; }
    .status-pending { background: #FEF3C7; color: #D97706; }
    .status-done { background: #DBEAFE; color: #2563EB; }
    .progress-wrap { min-width: 80px; }
    .progress-bar {
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; }
    .progress-text { font-size: 11px; color: var(--text-secondary); }
    .action-btns { display: flex; gap: 6px; }
    .action-btn {
      width: 34px; height: 34px;
      border: none; border-radius: 8px;
      background: var(--bg);
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.2s;
    }
    .action-btn:hover { background: var(--primary-light); color: var(--primary); }
    .action-btn.delete:hover { background: #FEE2E2; color: var(--danger); }
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-secondary);
    }
    .empty-state i { font-size: 48px; color: var(--border); margin-bottom: 16px; }
    /* 详情抽屉 */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 200;
    }
    .drawer-overlay.show { display: block; }
    .drawer {
      position: fixed;
      top: 0; right: -480px;
      width: 100%; max-width: 460px;
      height: 100vh;
      background: var(--card);
      box-shadow: -8px 0 40px rgba(0,0,0,.12);
      z-index: 201;
      transition: right 0.3s ease;
      overflow-y: auto;
    }
    .drawer-overlay.show .drawer { right: 0; }
    .drawer-head {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .drawer-head h2 { font-size: 18px; margin-bottom: 6px; padding-right: 16px; }
    .drawer-close {
      border: none; background: var(--bg);
      width: 36px; height: 36px; border-radius: 10px;
      cursor: pointer; color: var(--text-secondary);
    }
    .drawer-body { padding: 24px; }
    .detail-section { margin-bottom: 24px; }
    .detail-section h4 {
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 14px;
    }
    .detail-item label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .detail-item span { font-weight: 500; }
    .config-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .config-tag {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--bg);
    }
    .config-tag.done { background: #D1FAE5; color: #059669; }
    .drawer-actions {
      padding: 16px 24px 24px;
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--border);
    }
    @media (max-width: 768px) {
      .detail-grid { grid-template-columns: 1fr; }
      .drawer { max-width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="培训管理系统 主页面.html?panel=tasks" class="back-link">
        <i class="fas fa-arrow-left"></i> 返回任务管理
      </a>
      <div>
        <h1>任务档案</h1>
        <span class="sub">培训任务台账 · 查询、筛选与详情</span>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a href="资料档案.html" class="btn btn-secondary">
        <i class="fas fa-archive"></i> 资料档案
      </a>
      <a href="创建任务.html" class="btn btn-primary">
        <i class="fas fa-plus"></i> 新建任务
      </a>
    </div>
  </header>

  <main class="page">
    <!-- 统计卡片 -->
    <div class="stat-row" id="statRow">
      <div class="stat-card active" data-filter="all">
        <div class="val" id="statAll">0</div>
        <div class="lbl">全部任务</div>
      </div>
      <div class="stat-card" data-filter="进行中">
        <div class="val" id="statActive">0</div>
        <div class="lbl">进行中</div>
      </div>
      <div class="stat-card" data-filter="draft">
        <div class="val" id="statDraft">0</div>
        <div class="lbl">草稿 / 待审批</div>
      </div>
      <div class="stat-card" data-filter="overdue">
        <div class="val" id="statOverdue">0</div>
        <div class="lbl">已逾期</div>
      </div>
    </div>

    <!-- 筛选工具栏 -->
    <div class="toolbar">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="搜索任务名称、企业、负责人…">
      </div>
      <select class="filter-select" id="filterStatus">
        <option value="">全部状态</option>
        <option value="进行中">进行中</option>
        <option value="草稿">草稿</option>
        <option value="待审批">待审批</option>
        <option value="已完成">已完成</option>
      </select>
      <select class="filter-select" id="filterPriority">
        <option value="">全部优先级</option>
        <option value="高">高</option>
        <option value="中">中</option>
        <option value="低">低</option>
      </select>
      <select class="filter-select" id="filterOccupation">
        <option value="">全部工种</option>
        <option value="电工">电工</option>
        <option value="焊工">焊工</option>
        <option value="起重工">起重工</option>
        <option value="安全员">安全员</option>
      </select>
      <select class="filter-select" id="filterRegion">
        <option value="">全部区域</option>
        <option value="南宁">南宁</option>
        <option value="桂林">桂林</option>
        <option value="柳州">柳州</option>
        <option value="玉林">玉林</option>
        <option value="梧州">梧州</option>
      </select>
      <button type="button" class="btn btn-secondary" id="resetFilter">
        <i class="fas fa-redo"></i> 重置
      </button>
      <button type="button" class="btn btn-secondary" id="exportBtn">
        <i class="fas fa-file-export"></i> 导出
      </button>
    </div>

    <!-- 任务列表 -->
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>任务</th>
              <th>企业</th>
              <th>工种 / 等级</th>
              <th>区域</th>
              <th>负责人</th>
              <th>截止日期</th>
              <th>优先级</th>
              <th>状态</th>
              <th>配置</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" style="display:none">
        <i class="fas fa-inbox"></i>
        <p>暂无符合条件的任务</p>
        <a href="创建任务.html" class="btn btn-primary" style="margin-top:16px">创建第一个任务</a>
      </div>
    </div>
  </main>

  <!-- 详情抽屉 -->
  <div class="drawer-overlay" id="drawerOverlay">
    <div class="drawer">
      <div class="drawer-head">
        <div>
          <h2 id="drawerTitle">—</h2>
          <span class="task-code" id="drawerCode"></span>
        </div>
        <button type="button" class="drawer-close" id="drawerClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-actions">
        <a href="#" class="btn btn-primary" id="drawerEdit"><i class="fas fa-edit"></i> 编辑任务</a>
        <a href="培训管理系统 主页面.html?panel=process" class="btn btn-secondary"><i class="fas fa-sitemap"></i> 培训流程</a>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'zhixun_tasks';
    const CONFIG_TOTAL = 9;

    const DEFAULT_TASKS = [
      { id: 1, name: '2026年度安全培训计划编制', owner: '张明', deadline: '2026-06-15', priority: '高', enterprise: '广西建工集团', occupation: '安全员', skillLevel: '高级', region: '南宁', projectType: '安全培训', status: '进行中', planCount: 120, startDate: '2026-03-01', endDate: '2026-06-30' },
      { id: 2, name: '电工高级班认定材料整理', owner: '李芳', deadline: '2026-05-25', priority: '高', enterprise: '南宁供电局', occupation: '电工', skillLevel: '高级', region: '南宁', projectType: '资质认证', status: '进行中', planCount: 42 },
      { id: 3, name: 'Q2培训项目回款跟进', owner: '王强', deadline: '2026-05-30', priority: '中', enterprise: '柳州钢铁有限公司', occupation: '焊工', skillLevel: '中级', region: '柳州', projectType: '新员工培训', status: '草稿', planCount: 36 },
      { id: 4, name: '焊工中级班排课协调', owner: '赵丽', deadline: '2026-05-22', priority: '中', enterprise: '桂林旅游股份公司', occupation: '焊工', skillLevel: '中级', region: '桂林', projectType: '资质认证', status: '待审批', planCount: 28 },
      { id: 5, name: '培训档案年度归档', owner: '陈伟', deadline: '2026-06-30', priority: '低', enterprise: '梧州港务集团', occupation: '起重工', skillLevel: '初级', region: '梧州', projectType: '管理研修', status: '草稿', planCount: 15 }
    ];

    let tasks = [];
    let filteredTasks = [];
    let quickFilter = 'all';

    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* ignore */ }
      return null;
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function initData() {
      const stored = loadTasks();
      if (stored && stored.length) {
        tasks = stored;
      } else {
        tasks = [...DEFAULT_TASKS];
        saveTasks();
      }
    }

    function taskCode(id) {
      return 'TASK-' + String(id).padStart(4, '0');
    }

    function getConfigProgress(task) {
      const cfg = task.taskConfig || task.fiveM;
      if (!cfg) return { done: 0, total: CONFIG_TOTAL };
      const done = Object.values(cfg).filter(c => c && c.configured).length;
      return { done, total: CONFIG_TOTAL };
    }

    function isOverdue(task) {
      if (!task.deadline || task.status === '已完成') return false;
      return new Date(task.deadline) < new Date(new Date().toDateString());
    }

    function priorityClass(p) {
      return { '高': 'priority-high', '中': 'priority-medium', '低': 'priority-low' }[p] || 'priority-medium';
    }

    function statusClass(s) {
      const map = { '进行中': 'status-active', '草稿': 'status-draft', '待审批': 'status-pending', '已完成': 'status-done' };
      return map[s] || 'status-draft';
    }

    function updateStats() {
      const today = new Date(new Date().toDateString());
      document.getElementById('statAll').textContent = tasks.length;
      document.getElementById('statActive').textContent = tasks.filter(t => t.status === '进行中').length;
      document.getElementById('statDraft').textContent = tasks.filter(t => ['草稿', '待审批'].includes(t.status)).length;
      document.getElementById('statOverdue').textContent = tasks.filter(t => isOverdue(t)).length;
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const status = document.getElementById('filterStatus').value;
      const priority = document.getElementById('filterPriority').value;
      const occupation = document.getElementById('filterOccupation').value;
      const region = document.getElementById('filterRegion').value;

      filteredTasks = tasks.filter(t => {
        if (quickFilter === '进行中' && t.status !== '进行中') return false;
        if (quickFilter === 'draft' && !['草稿', '待审批'].includes(t.status)) return false;
        if (quickFilter === 'overdue' && !isOverdue(t)) return false;
        if (status && t.status !== status) return false;
        if (priority && t.priority !== priority) return false;
        if (occupation && t.occupation !== occupation) return false;
        if (region && t.region !== region) return false;
        if (q) {
          const hay = [t.name, t.enterprise, t.owner, t.occupation, taskCode(t.id)].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('taskTableBody');
      const empty = document.getElementById('emptyState');

      if (!filteredTasks.length) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = filteredTasks.map(t => {
        const prog = getConfigProgress(t);
        const pct = Math.round((prog.done / prog.total) * 100);
        const overdue = isOverdue(t);
        return `
          <tr class="clickable" data-id="${t.id}">
            <td>
              <div class="task-name">${t.name}</div>
              <div class="task-code">${taskCode(t.id)}</div>
            </td>
            <td>${t.enterprise || '—'}</td>
            <td>${t.occupation || '—'}${t.skillLevel ? ' · ' + t.skillLevel : ''}</td>
            <td>${t.region || '—'}</td>
            <td>${t.owner}</td>
            <td style="${overdue ? 'color:var(--danger);font-weight:500' : ''}">${t.deadline || '—'}${overdue ? ' <i class="fas fa-exclamation-circle" title="已逾期"></i>' : ''}</td>
            <td><span class="priority-badge ${priorityClass(t.priority)}">${t.priority}</span></td>
            <td><span class="status-badge ${statusClass(t.status)}">${t.status || '草稿'}</span></td>
            <td class="progress-wrap">
              <span class="progress-text">${prog.done}/${prog.total}</span>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            </td>
            <td>
              <div class="action-btns" onclick="event.stopPropagation()">
                <button type="button" class="action-btn view-btn" data-id="${t.id}" title="查看"><i class="fas fa-eye"></i></button>
                <a class="action-btn" href="创建任务.html?id=${t.id}" title="编辑"><i class="fas fa-edit"></i></a>
                <a class="action-btn" href="人才识别.html?projectId=${t.id}" title="人才识别"><i class="fas fa-user-check"></i></a>
                <a class="action-btn" href="初步方案.html?projectId=${t.id}" title="初步方案"><i class="fas fa-file-alt"></i></a>
                <a class="action-btn" href="最终方案.html?projectId=${t.id}" title="最终方案"><i class="fas fa-file-signature"></i></a>
                <a class="action-btn" href="开班.html?projectId=${t.id}" title="开班申报"><i class="fas fa-clipboard-list"></i></a>
                <a class="action-btn" href="培训.html?projectId=${t.id}" title="培训实施"><i class="fas fa-chalkboard-teacher"></i></a>
                <a class="action-btn" href="认定.html?projectId=${t.id}" title="认定准备"><i class="fas fa-certificate"></i></a>
                <a class="action-btn" href="申报.html?projectId=${t.id}" title="申报服务"><i class="fas fa-file-upload"></i></a>
                <a class="action-btn" href="结业.html?projectId=${t.id}" title="培训结业"><i class="fas fa-graduation-cap"></i></a>
                <a class="action-btn" href="回款.html?projectId=${t.id}" title="项目回款"><i class="fas fa-yen-sign"></i></a>
                <a class="action-btn" href="资料档案.html?projectId=${t.id}" title="资料档案"><i class="fas fa-archive"></i></a>
                <button type="button" class="action-btn delete delete-btn" data-id="${t.id}" title="删除"><i class="fas fa-trash-alt"></i></button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    const CONFIG_LABELS = {
      humanTeacher: '师资与教务',
      humanStudent: '参训学员',
      machine: '机构与场地',
      materialCourse: '课程与课件',
      materialCost: '预算与费用',
      lawSchedule: '分班排课',
      lawMode: '培养方案',
      lawRule: '业务规则',
      environment: '开班与合规'
    };

    function openDrawer(id) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      document.getElementById('drawerTitle').textContent = t.name;
      document.getElementById('drawerCode').textContent = taskCode(t.id);
      document.getElementById('drawerEdit').href = '创建任务.html?id=' + t.id;

      const prog = getConfigProgress(t);
      const cfg = t.taskConfig || t.fiveM || {};
      const configHtml = Object.keys(CONFIG_LABELS).map(key => {
        const c = cfg[key];
        const done = c && c.configured;
        return `<span class="config-tag ${done ? 'done' : ''}">${CONFIG_LABELS[key]}${done ? ' ✓' : ''}</span>`;
      }).join('');

      document.getElementById('drawerBody').innerHTML = `
        <div class="detail-section">
          <h4>基本信息</h4>
          <div class="detail-grid">
            <div class="detail-item"><label>负责人</label><span>${t.owner}</span></div>
            <div class="detail-item"><label>截止日期</label><span>${t.deadline || '—'}</span></div>
            <div class="detail-item"><label>优先级</label><span>${t.priority}</span></div>
            <div class="detail-item"><label>状态</label><span>${t.status || '草稿'}</span></div>
          </div>
          ${t.description ? `<p style="margin-top:12px;font-size:13px;color:var(--text-secondary)">${t.description}</p>` : ''}
        </div>
        <div class="detail-section">
          <h4>项目信息</h4>
          <div class="detail-grid">
            <div class="detail-item"><label>委托企业</label><span>${t.enterprise || '—'}</span></div>
            <div class="detail-item"><label>所属区域</label><span>${t.region || '—'}</span></div>
            <div class="detail-item"><label>培训工种</label><span>${t.occupation || '—'} · ${t.skillLevel || '—'}</span></div>
            <div class="detail-item"><label>项目类型</label><span>${t.projectType || '—'}</span></div>
            <div class="detail-item"><label>计划人数</label><span>${t.planCount || '—'} 人</span></div>
            <div class="detail-item"><label>计划周期</label><span>${t.startDate || '—'} ~ ${t.endDate || '—'}</span></div>
          </div>
        </div>
        <div class="detail-section">
          <h4>任务配置（${prog.done}/${prog.total}）</h4>
          <div class="config-tags">${configHtml}</div>
        </div>
      `;
      document.getElementById('drawerOverlay').classList.add('show');
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.remove('show');
    }

    function deleteTask(id) {
      if (!confirm('确定删除该任务？')) return;
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      updateStats();
      applyFilters();
    }

    // 事件绑定
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    ['filterStatus', 'filterPriority', 'filterOccupation', 'filterRegion'].forEach(id => {
      document.getElementById(id).addEventListener('change', applyFilters);
    });
    document.getElementById('resetFilter').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterPriority').value = '';
      document.getElementById('filterOccupation').value = '';
      document.getElementById('filterRegion').value = '';
      quickFilter = 'all';
      document.querySelectorAll('.stat-card').forEach(c => c.classList.toggle('active', c.dataset.filter === 'all'));
      applyFilters();
    });
    document.getElementById('exportBtn').addEventListener('click', () => {
      alert('导出演示：共 ' + filteredTasks.length + ' 条任务（未实际生成文件）');
    });
    document.getElementById('statRow').addEventListener('click', e => {
      const card = e.target.closest('.stat-card');
      if (!card) return;
      quickFilter = card.dataset.filter;
      document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      applyFilters();
    });
    document.getElementById('taskTableBody').addEventListener('click', e => {
      const row = e.target.closest('tr.clickable');
      const viewBtn = e.target.closest('.view-btn');
      const delBtn = e.target.closest('.delete-btn');
      if (delBtn) { deleteTask(parseInt(delBtn.dataset.id)); return; }
      const id = viewBtn ? parseInt(viewBtn.dataset.id) : row ? parseInt(row.dataset.id) : null;
      if (id) openDrawer(id);
    });
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('drawerOverlay').addEventListener('click', e => {
      if (e.target.id === 'drawerOverlay') closeDrawer();
    });

    // URL ?id= 打开详情
    document.addEventListener('DOMContentLoaded', () => {
      initData();
      updateStats();
      applyFilters();
      const id = new URLSearchParams(location.search).get('id');
      if (id) openDrawer(parseInt(id));
    });
  </script>
</body>
</html>
