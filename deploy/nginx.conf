# =============================================================================
# 千铝国昱云平台 / 公网测试环境 nginx 配置(IP 直连,无域名)
# 用法:
#   1) sudo cp deploy/nginx.conf /etc/nginx/sites-available/guoyu
#   2) sudo ln -sf /etc/nginx/sites-available/guoyu /etc/nginx/sites-enabled/guoyu
#   3) sudo nginx -t && sudo systemctl reload nginx
#
# 【重要】本文件仅用于 IP 直连的公网测试环境,无 HTTPS。
#   - 生产环境必须走域名 + HTTPS(443),并额外配置 HSTS:
#       add_header Strict-Transport-Security "max-age=31536000" always;
#     80 端口只保留到 443 的跳转(见修订方案 §3.8:先查 access log 确认裸 IP:80
#     无合法业务流量,再由安全组关闭 80 或对裸 IP 返回 444)。
#   - 安全响应头见下方 /api/ 段落,生产同款配置必须一并带上。
# =============================================================================

# 上传/导出/模板 xlsx 较大,需要放大 body 限制
# 历年真题批量导入 zip 上限 200MB（方案 R5），故全局放宽到 210M；
# 单 PDF 50MB 与 zip 内条目数由 platform-api 代码层强制。
client_max_body_size 210M;
client_body_buffer_size 1M;
client_body_timeout 120s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_connect_timeout 30s;

# gzip 压缩静态资源
gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/x-font-ttf font/opentype;
gzip_vary on;

# ========== HTTP 服务(IP 直连,默认 80) ==========
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;  # 任意 hostname(IP 直连场景)

    # ---- 1) 前端 SPA ----
    root /data/guoyu/web/dist;
    index index.html;

    # favicon / 静态资源
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 路由 fallback(让 React Router 自己处理)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 2a) 竞赛选手公告实时通道 ----
    location = /api/ws/competition-player {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # ---- 2) 后端 API 反代 ----
    location /api/ {
        # 【P1-1 / §2.4】OPTIONS 预检不再由 nginx 返回 Access-Control-Allow-Origin: *。
        # 此前这里直接放通通配源,等于绕过后端 CorsConfig 的白名单校验;
        # 现改为透传给后端,由 CorsConfig 按 platform.cors.allowed-origins 统一裁决。
        # 依赖顺序:必须先在生产配置好 allowed-origins(含 appnext H5 源)再上本文件,
        # 否则浏览器跨域调用会被拒(见修订方案 §8.5 上线顺序)。
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 【P2-3】安全响应头(生产 HTTPS 环境另需 HSTS,见文件头说明)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 文件上传大 body
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ---- 3) health check (LB / 监控用) ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 4) access log ----
    access_log /var/log/nginx/guoyu.access.log;
    error_log  /var/log/nginx/guoyu.error.log warn;
}
