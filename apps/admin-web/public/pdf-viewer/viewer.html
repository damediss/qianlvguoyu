<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>历年真题预览</title>
  <link rel="stylesheet" href="./pdf_viewer.css">
  <link rel="stylesheet" href="./viewer.css">
</head>
<body>
  <header id="toolbar">
    <button id="prev" type="button" aria-label="上一页">上一页</button>
    <span id="pageInfo" class="info">- / -</span>
    <button id="next" type="button" aria-label="下一页">下一页</button>
    <span class="spacer"></span>
    <button id="zoomOut" type="button" aria-label="缩小">－</button>
    <span id="zoomInfo" class="info">100%</span>
    <button id="zoomIn" type="button" aria-label="放大">＋</button>
    <button id="fitWidth" type="button">适应宽度</button>
  </header>

  <div id="error" class="error" hidden></div>
  <div id="loading" class="loading">正在加载真题…</div>

  <!-- 仅在线预览：本页不提供下载、打印、打开原文件、分享入口 -->
  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
  </div>

  <script src="./build/pdf.js"></script>
  <script src="./pdf_viewer.js"></script>
  <script src="./viewer.js"></script>
</body>
</html>
