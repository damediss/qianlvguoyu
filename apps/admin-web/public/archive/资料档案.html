<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资料档案 - 智训企业版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #2A6DFF;
      --primary-hover: #1E5AE8;
      --primary-light: #E8F0FF;
      --bg: #F5F7FC;
      --card: #FFFFFF;
      --text: #1A2332;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(42, 109, 255, 0.06);
      --radius-card: 20px;
      --radius-btn: 12px;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: var(--radius-btn); transition: all 0.2s;
    }
    .back-link:hover { background: var(--primary-light); color: var(--primary); }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar .sub { font-size: 13px; color: var(--text-secondary); }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stat-card .val { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat-card .val.success { color: var(--success); }
    .stat-card .val.warn { color: var(--warning); }
    .stat-card .lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .card-head {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-head .title-wrap { display: flex; align-items: center; gap: 10px; }
    .card-head i { color: var(--primary); }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
    }
    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 8px 16px; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .project-banner {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--primary-light);
      border-radius: var(--radius-btn);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px 24px;
      font-size: 13px;
    }
    .project-banner .item label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
    .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn {
      padding: 10px 18px; border: 1px solid var(--border); border-radius: var(--radius-btn);
      background: var(--card); font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; color: var(--text-secondary);
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .panel { display: none; }
    .panel.active { display: block; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th {
      text-align: left; padding: 12px 14px; font-size: 12px; color: var(--text-secondary);
      background: #FAFBFD; border-bottom: 2px solid var(--border);
    }
    .data-table td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
    }
    .st-done { background: #D1FAE5; color: #059669; }
    .st-pending { background: #FEF3C7; color: #D97706; }
    .st-draft { background: #F1F5F9; color: #64748B; }
    .st-archived { background: #E8F0FF; color: var(--primary); }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
    .filter-bar .form-group { margin: 0; min-width: 140px; flex: 1; }
    .file-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 16px; margin-right: 10px;
    }
    .file-ppt { background: #FEE2E2; color: #DC2626; }
    .file-pdf { background: #FEE2E2; color: #B91C1C; }
    .file-doc { background: #DBEAFE; color: #2563EB; }
    .file-cert { background: #D1FAE5; color: #059669; }
    .file-xls { background: #D1FAE5; color: #047857; }
    .ledger-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .ledger-item {
      padding: 16px;
      background: var(--bg);
      border-radius: var(--radius-btn);
      font-size: 13px;
    }
    .ledger-item label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }
    .ledger-item strong { font-size: 18px; color: var(--primary); }
    .approval-track { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
    .approval-node {
      flex: 1; min-width: 120px; padding: 14px; border-radius: var(--radius-btn);
      background: var(--bg); text-align: center; font-size: 13px;
    }
    .approval-node.done { background: #D1FAE5; color: #059669; }
    .approval-node.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .progress-bar {
      height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 6px;
    }
    .progress-bar span { display: block; height: 100%; background: var(--primary); border-radius: 4px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="培训管理系统 主页面.html?panel=archives" class="back-link">
        <i class="fas fa-arrow-left"></i> 返回资料档案
      </a>
      <div>
        <h1>资料档案</h1>
        <span class="sub" id="pageSub">多项目资料归档 · 项目-班级-阶段-版本</span>
      </div>
    </div>
    <span style="font-size:12px;padding:6px 12px;background:var(--primary-light);color:var(--primary);border-radius:20px;font-weight:500">
      <i class="fas fa-database"></i> 列表 · 业务档案 · 数据台账
    </span>
  </header>

  <main class="page">
    <div class="card">
      <div class="card-head">
        <div class="title-wrap"><i class="fas fa-filter"></i> 检索与项目</div>
        <a href="任务档案.html" class="btn btn-secondary btn-sm"><i class="fas fa-list"></i> 任务档案</a>
      </div>
      <div class="filter-bar">
        <div class="form-group">
          <label>企业培训项目</label>
          <select id="projectSelect"><option value="">全部项目…</option></select>
        </div>
        <div class="form-group">
          <label>资料分类</label>
          <select id="filterCategory">
            <option value="">全部分类</option>
            <option value="协议合同">协议合同</option>
            <option value="培训课件">培训课件</option>
            <option value="过程留痕">过程留痕</option>
            <option value="认定证书">认定证书</option>
            <option value="补贴申报">补贴申报</option>
            <option value="结业归档">结业归档</option>
            <option value="结算收尾">结算收尾</option>
          </select>
        </div>
        <div class="form-group">
          <label>流程阶段</label>
          <select id="filterStage">
            <option value="">全部阶段</option>
            <option value="立项">立项</option>
            <option value="人才识别">人才识别</option>
            <option value="初步方案">初步方案</option>
            <option value="最终方案">最终方案</option>
            <option value="开班申报">开班申报</option>
            <option value="培训实施">培训实施</option>
            <option value="认定准备">认定准备</option>
            <option value="申报服务">申报服务</option>
            <option value="培训结业">培训结业</option>
            <option value="项目回款">项目回款</option>
          </select>
        </div>
        <div class="form-group">
          <label>关键词</label>
          <input type="text" id="searchKeyword" placeholder="文件名、企业名…">
        </div>
      </div>
      <div id="projectBanner" class="project-banner" style="display:none"></div>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="val" id="statProjects">0</div>
        <div class="lbl">在管项目</div>
      </div>
      <div class="stat-card">
        <div class="val success" id="statDocs">0</div>
        <div class="lbl">档案条目</div>
      </div>
      <div class="stat-card">
        <div class="val warn" id="statPending">0</div>
        <div class="lbl">待归档</div>
      </div>
      <div class="stat-card">
        <div class="val" id="statArchived">0</div>
        <div class="lbl">已归档项目</div>
      </div>
    </div>

    <div class="card">
      <div class="tab-bar" id="mainTabs">
        <button type="button" class="tab-btn active" data-tab="list">项目列表</button>
        <button type="button" class="tab-btn" data-tab="business">业务档案</button>
        <button type="button" class="tab-btn" data-tab="ledger">数据台账</button>
        <button type="button" class="tab-btn" data-tab="archive">归档审批</button>
      </div>

      <div id="panel-list" class="panel active">
        <div class="table-wrap" style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>企业 · 项目</th>
                <th>档案完整度</th>
                <th>条目数</th>
                <th>归档状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="projectListBody"></tbody>
          </table>
        </div>
      </div>

      <div id="panel-business" class="panel">
        <div class="toolbar">
          <button type="button" class="btn btn-primary btn-sm" id="btnSyncDocs">
            <i class="fas fa-sync"></i> 同步流程资料
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnUpload">
            <i class="fas fa-cloud-upload-alt"></i> 上传资料
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnReview">
            <i class="fas fa-clipboard-check"></i> 归档审查
          </button>
        </div>
        <div class="table-wrap" style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>资料名称</th>
                <th>分类</th>
                <th>阶段</th>
                <th>版本</th>
                <th>归档状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="docBody"></tbody>
          </table>
        </div>
      </div>

      <div id="panel-ledger" class="panel">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">汇总各培训流程环节产生的结构化数据（人才识别、方案、开班申报、培训实施、认定准备、申报服务、培训结业、项目回款）。</p>
        <div class="ledger-grid" id="ledgerGrid"></div>
      </div>

      <div id="panel-archive" class="panel">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">按 MD 流程：培训部资料归档 → 总经理归档审批 → 电子归档至资料中心。</p>
        <div class="toolbar">
          <button type="button" class="btn btn-primary btn-sm" id="btnPackArchive">
            <i class="fas fa-file-archive"></i> 电子归档打包
          </button>
          <button type="button" class="btn btn-success btn-sm" id="btnSubmitArchive">
            <i class="fas fa-stamp"></i> 提交归档审批
          </button>
        </div>
        <div class="form-group" style="max-width:400px;margin-bottom:16px">
          <label>纸质档案存放位置（可选）</label>
          <input type="text" id="physicalLocation" placeholder="如：档案室 A-12 柜">
        </div>
        <div class="approval-track" id="approvalTrack"></div>
        <div id="archiveSummary" style="margin-top:20px;padding:16px;background:var(--bg);border-radius:12px;font-size:14px;display:none"></div>
      </div>
    </div>
  </main>

  <script>
    const STORAGE_TASKS = 'zhixun_tasks';
    const STORAGE_ZILIAO = 'zhixun_ziliao_by_project';
    const STORAGE_FENBAN = 'zhixun_fenban_by_project';
    const STORAGE_PAIKE = 'zhixun_paike_by_project';
    const STORAGE_KAIBAN = 'zhixun_kaiban_by_project';
    const STORAGE_PEIXUN = 'zhixun_peixun_by_project';
    const STORAGE_RENDING = 'zhixun_rending_by_project';
    const STORAGE_SHENBAO = 'zhixun_shenbao_by_project';
    const STORAGE_JIEYE = 'zhixun_jieye_by_project';
    const STORAGE_HUIKUAN = 'zhixun_huikuan_by_project';

    const APPROVAL_NODES = ['培训部归档', '总经理审批', '资料中心入库'];
    const CATEGORIES = ['协议合同', '培训课件', '过程留痕', '认定证书', '补贴申报', '结业归档', '结算收尾'];

    let tasks = [];
    let currentProjectId = null;
    let allDocs = [];
    let projectMeta = {};

    function loadTasks() {
      try { tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS) || '[]'); }
      catch (e) { tasks = []; }
    }

    function getStore(key) {
      try { return JSON.parse(localStorage.getItem(key) || '{}'); }
      catch (e) { return {}; }
    }

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function fileIcon(type) {
      const map = { ppt: ['file-ppt', 'fa-file-powerpoint'], pdf: ['file-pdf', 'fa-file-pdf'],
        doc: ['file-doc', 'fa-file-word'], cert: ['file-cert', 'fa-certificate'], xls: ['file-xls', 'fa-file-excel'] };
      const [cls, icon] = map[type] || ['file-pdf', 'fa-file'];
      return `<span class="file-icon ${cls}"><i class="fas ${icon}"></i></span>`;
    }

    function getProjectMeta(projectId) {
      const all = getStore(STORAGE_ZILIAO);
      if (!all[String(projectId)]) {
        all[String(projectId)] = {
          projectId,
          documents: [],
          reviewDone: false,
          archived: false,
          approvalStatus: '草稿',
          approvalStep: 0,
          physicalLocation: '',
          archiveDate: ''
        };
        localStorage.setItem(STORAGE_ZILIAO, JSON.stringify(all));
      }
      return all[String(projectId)];
    }

    function saveProjectMeta(projectId, meta) {
      const all = getStore(STORAGE_ZILIAO);
      all[String(projectId)] = meta;
      localStorage.setItem(STORAGE_ZILIAO, JSON.stringify(all));
      projectMeta[String(projectId)] = meta;
    }

    function syncDocsFromFlow(projectId) {
      const pid = String(projectId);
      const docs = [];
      const add = (name, category, stage, version, status, type) => {
        docs.push({
          id: pid + '-' + stage + '-' + docs.length,
          name, category, stage, version: version || 'v1',
          status: status || '待归档', date: todayStr(), type: type || 'pdf',
          projectId: +projectId
        });
      };

      const task = tasks.find(t => t.id === projectId);
      if (task) {
        add(task.name + '-培训服务合同.pdf', '协议合同', '立项', 'v1', '已归档', 'pdf');
        add(task.name + '-项目立项表.xlsx', '协议合同', '立项', 'v1', '待归档', 'xls');
      }

      const fenban = getStore(STORAGE_FENBAN)[pid];
      if (fenban) {
        add('学员名册与分班表.xlsx', '过程留痕', '分班', 'v1', '已生成', 'xls');
        add('班级编制说明.docx', '过程留痕', '分班', 'v1', '待归档', 'doc');
      }
      const paike = getStore(STORAGE_PAIKE)[pid];
      if (paike) add('课程排课表.xlsx', '过程留痕', '排课', 'v1', paike.schedule?.length ? '已生成' : '待归档', 'xls');
      const kaiban = getStore(STORAGE_KAIBAN)[pid];
      if (kaiban) add('开班仪式材料包.zip', '过程留痕', '开班', 'v1', '已生成', 'pdf');
      const peixun = getStore(STORAGE_PEIXUN)[pid];
      if (peixun) {
        add('考勤汇总表.xlsx', '过程留痕', '培训', 'v1', '已生成', 'xls');
        add('课堂留痕证据目录.pdf', '过程留痕', '培训', 'v1', '待归档', 'pdf');
      }
      const rending = getStore(STORAGE_RENDING)[pid];
      if (rending) add('技能认定获证花名册.xlsx', '认定证书', '认定', 'v1', '已生成', 'xls');
      const shenbao = getStore(STORAGE_SHENBAO)[pid];
      if (shenbao) {
        add('补贴申报材料包.pdf', '补贴申报', '申报', 'v1', shenbao.submitStatus === '已通过' ? '已归档' : '待归档', 'pdf');
        add('拨款进度跟踪表.xlsx', '补贴申报', '申报', 'v1', '待归档', 'xls');
      }
      const jieye = getStore(STORAGE_JIEYE)[pid];
      if (jieye) add('结业证明与档案目录.pdf', '结业归档', '结业', 'v1', jieye.packageReady ? '已归档' : '待归档', 'cert');
      const huikuan = getStore(STORAGE_HUIKUAN)[pid];
      if (huikuan) add('项目结算单.pdf', '结算收尾', '回款', 'v1', huikuan.settlement?.generated ? '已生成' : '待归档', 'pdf');

      return docs;
    }

    function buildAllDocs() {
      allDocs = [];
      const ziliaoStore = getStore(STORAGE_ZILIAO);
      tasks.forEach(t => {
        const meta = ziliaoStore[String(t.id)] || getProjectMeta(t.id);
        projectMeta[String(t.id)] = meta;
        let docs = meta.documents && meta.documents.length ? meta.documents : syncDocsFromFlow(t.id);
        if (!meta.documents || !meta.documents.length) {
          meta.documents = docs;
          saveProjectMeta(t.id, meta);
        }
        docs.forEach(d => {
          d.projectId = t.id;
          d.enterprise = t.enterprise;
          d.projectName = t.name;
          allDocs.push(d);
        });
      });
    }

    function filteredDocs() {
      const pid = document.getElementById('projectSelect').value;
      const cat = document.getElementById('filterCategory').value;
      const stage = document.getElementById('filterStage').value;
      const kw = (document.getElementById('searchKeyword').value || '').trim().toLowerCase();
      return allDocs.filter(d => {
        if (pid && String(d.projectId) !== pid) return false;
        if (cat && d.category !== cat) return false;
        if (stage && d.stage !== stage) return false;
        if (kw && !(d.name + (d.enterprise || '') + (d.projectName || '')).toLowerCase().includes(kw)) return false;
        return true;
      });
    }

    function updateGlobalStats() {
      const archivedProjects = tasks.filter(t => {
        const m = projectMeta[String(t.id)] || getProjectMeta(t.id);
        return m.archived || m.approvalStatus === '已入库';
      }).length;
      const pending = allDocs.filter(d => d.status !== '已归档').length;
      document.getElementById('statProjects').textContent = tasks.length;
      document.getElementById('statDocs').textContent = allDocs.length;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statArchived').textContent = archivedProjects;
    }

    function renderProjectList() {
      const tbody = document.getElementById('projectListBody');
      if (!tasks.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-secondary)">暂无培训项目，请先在任务档案创建</td></tr>';
        return;
      }
      tbody.innerHTML = tasks.map(t => {
        const meta = projectMeta[String(t.id)] || getProjectMeta(t.id);
        const docs = allDocs.filter(d => d.projectId === t.id);
        const total = docs.length || 1;
        const done = docs.filter(d => d.status === '已归档').length;
        const pct = Math.round((done / total) * 100);
        const st = meta.archived ? '已入库' : meta.approvalStatus === '审批中' ? '审批中' : '待归档';
        const stCls = meta.archived ? 'st-archived' : meta.approvalStatus === '审批中' ? 'st-pending' : 'st-draft';
        return `<tr>
          <td><strong>${t.enterprise || '—'}</strong><br><small>${t.name}</small></td>
          <td>
            <div style="font-size:13px">${pct}%</div>
            <div class="progress-bar"><span style="width:${pct}%"></span></div>
          </td>
          <td>${docs.length}</td>
          <td><span class="status-badge ${stCls}">${st}</span></td>
          <td>
            <button type="button" class="btn btn-secondary btn-sm open-project" data-id="${t.id}">查看档案</button>
          </td>
        </tr>`;
      }).join('');
    }

    function renderDocTable() {
      const tbody = document.getElementById('docBody');
      const list = filteredDocs();
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-secondary)">暂无资料，请选择项目或点击「同步流程资料」</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(d => {
        const stCls = d.status === '已归档' ? 'st-done' : d.status === '已生成' ? 'st-pending' : 'st-draft';
        return `<tr>
          <td>${fileIcon(d.type)}<strong>${d.name}</strong>
            ${d.projectName ? '<br><small style="color:var(--text-secondary)">' + d.enterprise + ' · ' + d.projectName + '</small>' : ''}</td>
          <td>${d.category}</td>
          <td>${d.stage}</td>
          <td>${d.version}</td>
          <td><span class="status-badge ${stCls}">${d.status}</span></td>
          <td>
            <button type="button" class="btn btn-secondary btn-sm dl-btn" data-name="${d.name}">下载</button>
            <button type="button" class="btn btn-secondary btn-sm mark-archived" data-id="${d.id}">标记归档</button>
          </td>
        </tr>`;
      }).join('');
    }

    function renderLedger() {
      const grid = document.getElementById('ledgerGrid');
      const pid = document.getElementById('projectSelect').value;
      const projects = pid ? tasks.filter(t => String(t.id) === pid) : tasks;
      if (!projects.length) {
        grid.innerHTML = '<p style="color:var(--text-secondary)">请选择项目查看数据台账</p>';
        return;
      }
      const items = [];
      projects.forEach(t => {
        const id = String(t.id);
        const fenban = getStore(STORAGE_FENBAN)[id];
        const peixun = getStore(STORAGE_PEIXUN)[id];
        const rending = getStore(STORAGE_RENDING)[id];
        const shenbao = getStore(STORAGE_SHENBAO)[id];
        const jieye = getStore(STORAGE_JIEYE)[id];
        const huikuan = getStore(STORAGE_HUIKUAN)[id];
        const classCount = fenban?.classes?.length || 0;
        const studentCount = fenban ? (fenban.classes || []).reduce((s, c) => s + (c.studentIds?.length || 0), 0) : 0;
        const certCount = rending?.candidates?.filter(s => s.result === '通过').length || 0;
        let sessionCount = 0;
        (peixun?.classes || []).forEach(c => { sessionCount += (c.sessions?.length || 0); });
        items.push(
          { label: t.name + ' · 班级数', val: classCount },
          { label: '参训学员', val: studentCount + ' 人' },
          { label: '培训课次', val: sessionCount + ' 次' },
          { label: '认定通过', val: certCount + ' 人' },
          { label: '补贴申报', val: shenbao?.submitStatus || '—' },
          { label: '结业归档', val: jieye?.packageReady ? '已完成' : '未完成' },
          { label: '回款状态', val: huikuan?.settlement?.approvalStatus || '—' }
        );
      });
      grid.innerHTML = items.map(it => `
        <div class="ledger-item"><label>${it.label}</label><strong>${it.val}</strong></div>
      `).join('');
    }

    function renderApproval() {
      const pid = document.getElementById('projectSelect').value;
      const track = document.getElementById('approvalTrack');
      const summary = document.getElementById('archiveSummary');
      if (!pid) {
        track.innerHTML = '<p style="color:var(--text-secondary);font-size:14px">请先选择具体项目以办理归档审批</p>';
        summary.style.display = 'none';
        return;
      }
      const meta = getProjectMeta(+pid);
      document.getElementById('physicalLocation').value = meta.physicalLocation || '';
      const step = meta.approvalStep || 0;
      track.innerHTML = APPROVAL_NODES.map((name, i) => {
        let cls = 'approval-node';
        if (meta.archived || meta.approvalStatus === '已入库') cls += ' done';
        else if (i < step) cls += ' done';
        else if (i === step && meta.approvalStatus === '审批中') cls += ' active';
        return `<div class="${cls}">${name}</div>`;
      }).join('');
      if (meta.archiveDate) {
        summary.style.display = 'block';
        summary.innerHTML = `<strong>电子归档包</strong> 已于 ${meta.archiveDate} 打包入库。存放位置：${meta.physicalLocation || '未登记'}`;
      } else summary.style.display = 'none';
    }

    function renderProjectBanner() {
      const pid = document.getElementById('projectSelect').value;
      const banner = document.getElementById('projectBanner');
      if (!pid) { banner.style.display = 'none'; return; }
      const t = tasks.find(x => String(x.id) === pid);
      const meta = getProjectMeta(+pid);
      const docs = allDocs.filter(d => String(d.projectId) === pid);
      banner.style.display = 'grid';
      banner.innerHTML = `
        <div class="item"><label>企业</label><strong>${t?.enterprise || '—'}</strong></div>
        <div class="item"><label>项目</label><strong>${t?.name || '—'}</strong></div>
        <div class="item"><label>档案条目</label><strong>${docs.length} 份</strong></div>
        <div class="item"><label>归档状态</label><strong>${meta.approvalStatus}</strong></div>
      `;
      document.getElementById('pageSub').textContent = `${t?.enterprise || ''} · ${t?.name || ''} · 资料档案`;
    }

    function renderAll() {
      buildAllDocs();
      updateGlobalStats();
      renderProjectList();
      renderDocTable();
      renderLedger();
      renderApproval();
      renderProjectBanner();
    }

    document.querySelectorAll('#mainTabs .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#mainTabs .tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('projectSelect').addEventListener('change', () => {
      currentProjectId = document.getElementById('projectSelect').value || null;
      const url = new URL(window.location.href);
      if (currentProjectId) url.searchParams.set('projectId', currentProjectId);
      else url.searchParams.delete('projectId');
      history.replaceState(null, '', url);
      renderAll();
    });

    ['filterCategory', 'filterStage'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => { renderDocTable(); renderLedger(); });
    });
    document.getElementById('searchKeyword').addEventListener('input', renderDocTable);

    document.getElementById('projectListBody').addEventListener('click', e => {
      const btn = e.target.closest('.open-project');
      if (!btn) return;
      document.getElementById('projectSelect').value = btn.dataset.id;
      document.querySelector('[data-tab="business"]').click();
      currentProjectId = btn.dataset.id;
      renderAll();
    });

    document.getElementById('btnSyncDocs').addEventListener('click', () => {
      const pid = document.getElementById('projectSelect').value;
      const targets = pid ? [+pid] : tasks.map(t => t.id);
      targets.forEach(id => {
        const meta = getProjectMeta(id);
        meta.documents = syncDocsFromFlow(id);
        saveProjectMeta(id, meta);
      });
      renderAll();
      alert('已从培训流程各环节同步资料清单（演示）');
    });

    document.getElementById('btnUpload').addEventListener('click', () => {
      alert('上传资料功能演示（未实际存储文件）');
    });

    document.getElementById('btnReview').addEventListener('click', () => {
      const pid = document.getElementById('projectSelect').value;
      if (!pid) { alert('请先选择项目'); return; }
      const meta = getProjectMeta(+pid);
      const docs = meta.documents || [];
      const missing = docs.filter(d => d.status !== '已归档' && d.status !== '已生成');
      if (missing.length > 5) {
        alert(`归档审查：尚有 ${missing.length} 项资料待补齐\n建议完成培训流程各环节后再提交审批`);
        return;
      }
      meta.reviewDone = true;
      saveProjectMeta(+pid, meta);
      alert('归档审查通过，资料完整度符合要求（演示）');
      renderAll();
    });

    document.getElementById('btnPackArchive').addEventListener('click', () => {
      const pid = document.getElementById('projectSelect').value;
      if (!pid) { alert('请先选择项目'); return; }
      const meta = getProjectMeta(+pid);
      if (!meta.reviewDone) { alert('请先完成归档审查'); return; }
      meta.documents = (meta.documents || []).map(d => ({ ...d, status: '已归档' }));
      meta.archiveDate = todayStr();
      saveProjectMeta(+pid, meta);
      renderAll();
      alert('项目全生命周期资料已打包电子归档（演示）');
    });

    document.getElementById('btnSubmitArchive').addEventListener('click', () => {
      const pid = document.getElementById('projectSelect').value;
      if (!pid) { alert('请先选择项目'); return; }
      const meta = getProjectMeta(+pid);
      meta.physicalLocation = document.getElementById('physicalLocation').value;
      if (meta.approvalStatus === '草稿') {
        if (!meta.archiveDate) { alert('请先电子归档打包'); return; }
        meta.approvalStatus = '审批中';
        meta.approvalStep = 1;
      } else if (meta.approvalStatus === '审批中') {
        meta.approvalStep++;
        if (meta.approvalStep >= APPROVAL_NODES.length) {
          meta.approvalStatus = '已入库';
          meta.archived = true;
        }
      }
      saveProjectMeta(+pid, meta);
      renderAll();
      alert('归档审批进度已更新（演示）');
    });

    document.getElementById('physicalLocation').addEventListener('change', () => {
      const pid = document.getElementById('projectSelect').value;
      if (!pid) return;
      const meta = getProjectMeta(+pid);
      meta.physicalLocation = document.getElementById('physicalLocation').value;
      saveProjectMeta(+pid, meta);
    });

    document.getElementById('docBody').addEventListener('click', e => {
      if (e.target.closest('.dl-btn')) {
        alert('下载演示：' + e.target.closest('.dl-btn').dataset.name);
        return;
      }
      const btn = e.target.closest('.mark-archived');
      if (!btn) return;
      const pid = document.getElementById('projectSelect').value;
      if (!pid) return;
      const meta = getProjectMeta(+pid);
      const doc = (meta.documents || []).find(d => d.id === btn.dataset.id);
      if (doc) { doc.status = '已归档'; saveProjectMeta(+pid, meta); renderAll(); }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      document.getElementById('projectSelect').innerHTML =
        '<option value="">全部项目…</option>' +
        tasks.map(t => `<option value="${t.id}">${t.enterprise || '—'} · ${t.name}</option>`).join('');

      const params = new URLSearchParams(window.location.search);
      const pid = params.get('projectId');
      if (pid && tasks.some(t => String(t.id) === pid)) {
        document.getElementById('projectSelect').value = pid;
        currentProjectId = pid;
        document.querySelector('[data-tab="business"]')?.click();
      }
      renderAll();
    });
  </script>
</body>
</html>
