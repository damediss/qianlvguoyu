    read-timeout-seconds: ${RENCAI_READ_TIMEOUT:300}

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 259200
  active-timeout: -1
  is-concurrent: true
  is-share: true
  is-log: true
  token-style: uuid          # P0: tik → uuid，支持 Redis 存储
  is-read-cookie: false

logging:
  level:
    com.guoyu.platform.config.CacheConfig: INFO
    com.guoyu.platform.system.service.MenuApplicationService: INFO
