worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 8192;
}

http {
  # Docker Desktop advertises an unreachable synthetic AAAA record for the
  # host gateway. Resolve upstreams through Docker DNS with IPv6 disabled.
  resolver 127.0.0.11 ipv6=off valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    # Preserve upstream HTTP/1.1 keep-alive for normal REST requests.
    # WebSocket upgrades still use a dedicated upgraded connection.
    "" "";
  }

  upstream platform_api {
    # Single load-client IP made ip_hash pin every request to one node, while
    # least_conn biased sustained short requests toward the slightly faster JVM.
    # Default round-robin keeps identical load-test nodes deterministically even.
    # WebSocket stays on the node that accepted the upgrade.
    # `resolve` plus the IPv4-only resolver keeps this portable across Docker
    # Desktop restarts, where the host-gateway IPv4 address can change.
    zone platform_api 64k;
    server host.docker.internal:18081 resolve;
    server host.docker.internal:18082 resolve;
    keepalive 128;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 3s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://platform_api;
    }
  }
}
