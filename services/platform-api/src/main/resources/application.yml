server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 25MB

spring:
  application:
    name: platform-api
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${MYSQL_URL:jdbc:mysql://43.138.163.7:3308/gjjddb2026?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:gjjd}
    password: ${MYSQL_PASSWORD:w-#Y+=g7jdsJLjD8}
#    url: jdbc:mysql://192.168.1.200:3308/gjjd_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
#    username: root
#    password: guoyu_dev!513
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
#      connection-init-sqls:
#        - "SET SESSION sql_mode = 'NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'"
#        - "SET SESSION time_zone = '+08:00'"
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 关闭监控统计
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
      filters: wall
      filter:
        wall:
          enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # Redis 命令超时：防止 Redis 不响应时 Lettuce 无限等待，
      # 进而拖垮 DB 连接池（@CacheEvict 卡住 → 事务不提交 → 连接不释放 → 连接池耗尽）
      timeout: 3s
      lettuce:
        # 连接池：Lettuce 默认单连接非池化，一个操作 hang 会堵全部 Redis 操作
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
        # 关闭时等待未完成命令的最长时间
        shutdown-timeout: 100ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

flowable:
  database-schema-update: ${FLOWABLE_DATABASE_SCHEMA_UPDATE:true}
  database-type: mysql
  async-executor-activate: true
  history-level: full
  # 关闭 Spring Boot 内置自动部署，避免 ACT_RE_PROCDEF 版本冲突（见 FlowableProcessDeploymentRunner）
  check-process-definitions: false
  process-definition-location-prefix: classpath:/workflows/bpmn/
  process-definition-location-suffixes:
    - "**.bpmn20.xml"

weknora:
  base-url: ${WEKNORA_BASE_URL:http://43.138.163.7:8088}
  channel-id: ${WEKNORA_CHANNEL_ID:aa3a676b-a1cb-4719-8e06-6636932d9bb2}
  publish-token: ${WEKNORA_PUBLISH_TOKEN:}
  origin: ${WEKNORA_ORIGIN:http://localhost:5173}

platform:
