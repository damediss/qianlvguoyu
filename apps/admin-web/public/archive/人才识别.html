<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人才识别 - 智训企业版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #2A6DFF;
      --primary-hover: #1E5AE8;
      --primary-light: #E8F0FF;
      --identify: #F18F01;
      --identify-hover: #D97A01;
      --identify-light: #FFF7ED;
      --bg: #F5F7FC;
      --card: #FFFFFF;
      --text: #1A2332;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(42, 109, 255, 0.06);
      --radius-card: 16px;
      --radius-btn: 10px;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: var(--radius-btn);
    }
    .back-link:hover { background: var(--primary-light); color: var(--primary); }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar .sub { font-size: 13px; color: var(--text-secondary); }
    .process-badge {
      font-size: 12px; padding: 6px 12px;
      background: var(--identify-light); color: var(--identify);
      border-radius: 20px; font-weight: 600;
    }
    .page { max-width: 1400px; margin: 0 auto; padding: 24px 24px 64px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--primary);
    }
    .stat-card.warn { border-left-color: var(--warning); }
    .stat-card.danger { border-left-color: var(--danger); }
    .stat-card.success { border-left-color: var(--success); }
    .stat-card.identify { border-left-color: var(--identify); }
    .stat-card .val { font-size: 28px; font-weight: 700; }
    .stat-card .val.red { color: var(--danger); }
    .stat-card .val.yellow { color: var(--warning); }
    .stat-card .val.green { color: var(--success); }
    .stat-card .lbl { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 24px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .toolbar-left { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .form-inline {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px;
    }
    .form-inline input, .form-inline select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-identify { background: var(--identify); color: #fff; }
    .btn-identify:hover { background: var(--identify-hover); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-sm { padding: 6px 12px; font-size: 13px; font-weight: 500; }
    .btn-link { background: none; border: none; color: var(--primary); padding: 4px 8px; cursor: pointer; font-size: 13px; }
    .btn-link.warn { color: var(--warning); }
    .btn-link.danger { color: var(--danger); }
    .btn-link:hover { text-decoration: underline; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th {
      text-align: left;
      padding: 12px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: #FAFBFD;
      border-bottom: 2px solid var(--border);
    }
    .data-table td {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .data-table tr:hover td { background: #FAFCFF; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .st-audited { background: #D1FAE5; color: #059669; }
    .st-confirmed { background: #FEF3C7; color: #D97706; }
    .st-pending { background: #FEE2E2; color: #DC2626; }
    .actions { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .pagination-btns { display: flex; gap: 8px; }
    .pagination-btns button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .pagination-btns button.active {
      background: var(--identify-light);
      border-color: var(--identify);
      color: var(--identify);
      font-weight: 600;
    }
    .pagination-btns button:disabled { opacity: 0.5; cursor: not-allowed; }
    .flow-hint {
      padding: 14px 18px;
      background: var(--primary-light);
      border-radius: var(--radius-btn);
      font-size: 13px;
      color: var(--text);
      margin-bottom: 20px;
    }
    .flow-hint strong { color: var(--primary); }
    /* 详情面板 */
    .detail-panel { display: none; }
    .detail-panel.show { display: block; }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .detail-header h2 { font-size: 18px; font-weight: 700; }
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      font-size: 13px;
      cursor: pointer;
    }
    .filter-tab.active { background: var(--identify); color: #fff; border-color: var(--identify); }
    /* 弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--card);
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-head h3 { font-size: 18px; font-weight: 700; }
    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .form-group select, .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-btn); font-family: inherit; }
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-btn);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-zone:hover { border-color: var(--identify); background: var(--identify-light); }
    .upload-zone i { font-size: 36px; color: var(--identify); margin-bottom: 8px; display: block; }
    .file-preview {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: var(--radius-btn);
      font-size: 13px;
      justify-content: space-between;
      align-items: center;
    }
    .file-preview.show { display: flex; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="培训管理系统 主页面.html?panel=process" class="back-link">
        <i class="fas fa-arrow-left"></i> 返回培训流程
      </a>
      <div>
        <h1>人才识别</h1>
        <span class="sub" id="pageSub">企业人才数据识别与确认 · 步骤 1 / 9</span>
      </div>
    </div>
    <span class="process-badge"><i class="fas fa-user-check"></i> 人才识别 → 初步方案 → …</span>
  </header>

  <main class="page">
    <!-- 列表面板 -->
    <div id="listPanel">
      <div class="flow-hint">
        <i class="fas fa-info-circle" style="color:var(--primary)"></i>
        业务流程：<strong>Excel导入人员数据 → 系统技能识别 → 培训部审核 → 企业确认 → 进入初步方案</strong>
      </div>

      <div class="stat-row" id="statRow"></div>

      <div class="card">
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="form-inline">
              <label>状态</label>
              <select id="filterStatus">
                <option value="">全部状态</option>
                <option value="未审核">未审核</option>
                <option value="已确认">已确认</option>
                <option value="已审核">已审核</option>
              </select>
            </div>
            <div class="form-inline">
              <input type="text" id="searchKeyword" placeholder="搜索单位名称…" style="min-width:200px">
            </div>
          </div>
          <button type="button" class="btn btn-identify" id="importBtn">
            <i class="fas fa-file-excel"></i> Excel 导入
          </button>
        </div>

        <div style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>单位名称</th>
                <th>未识别人员</th>
                <th>待确认数量</th>
                <th>已确认数量</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="companyBody"></tbody>
          </table>
        </div>

        <div class="pagination">
          <span id="pageInfo">共 0 条记录</span>
          <div class="pagination-btns">
            <button type="button" disabled>上一页</button>
            <button type="button" class="active">1</button>
            <button type="button" disabled>下一页</button>
          </div>
        </div>
      </div>

      <div class="footer-actions">
        <a href="任务档案.html" class="btn btn-secondary"><i class="fas fa-list"></i> 任务档案</a>
        <button type="button" class="btn btn-primary" id="btnNextStep">
          <i class="fas fa-arrow-right"></i> 完成识别，进入初步方案
        </button>
      </div>
    </div>

    <!-- 单位详情 / 人员识别 -->
    <div id="detailPanel" class="detail-panel card">
      <div class="detail-header">
        <h2 id="detailTitle">单位识别详情</h2>
        <button type="button" class="btn btn-secondary btn-sm" id="btnBackList">
          <i class="fas fa-arrow-left"></i> 返回单位列表
        </button>
      </div>

      <div class="filter-tabs">
        <button type="button" class="filter-tab active" data-filter="all">全部</button>
        <button type="button" class="filter-tab" data-filter="unidentified">未识别</button>
        <button type="button" class="filter-tab" data-filter="pending">待确认</button>
        <button type="button" class="filter-tab" data-filter="confirmed">已确认</button>
      </div>

      <div style="overflow-x:auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>姓名</th>
              <th>工号</th>
              <th>部门</th>
              <th>工种</th>
              <th>技能等级</th>
              <th>识别状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="personBody"></tbody>
        </table>
      </div>

      <div class="footer-actions" style="margin-top:20px">
        <button type="button" class="btn btn-identify btn-sm" id="btnBatchIdentify">
          <i class="fas fa-magic"></i> 批量智能识别
        </button>
        <button type="button" class="btn btn-secondary btn-sm" id="btnSendConfirm">
          <i class="fas fa-paper-plane"></i> 送企业确认
        </button>
        <button type="button" class="btn btn-primary btn-sm" id="btnAudit">
          <i class="fas fa-check-double"></i> 审核通过
        </button>
      </div>
    </div>
  </main>

  <!-- Excel 导入弹窗 -->
  <div class="modal-overlay" id="importModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3><i class="fas fa-file-excel" style="color:var(--identify)"></i> Excel 导入</h3>
        <button type="button" class="modal-close" id="closeModal"><i class="fas fa-times"></i></button>
      </div>
      <div class="form-group">
        <label>选择单位 / 企业</label>
        <select id="importUnit">
          <option value="">请选择单位</option>
        </select>
      </div>
      <div class="form-group">
        <label>上传 Excel 文件</label>
        <label class="upload-zone" for="excelFile">
          <i class="fas fa-cloud-upload-alt"></i>
          <p>点击上传 Excel 文件</p>
          <p style="font-size:12px;color:var(--text-secondary);margin-top:6px">支持 .xlsx / .xls 格式</p>
        </label>
        <input type="file" id="excelFile" accept=".xlsx,.xls" hidden>
        <div class="file-preview" id="filePreview">
          <span id="fileName"></span>
          <button type="button" class="btn-link danger" id="removeFile"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" id="cancelImport">取消</button>
        <button type="button" class="btn btn-identify" id="confirmImport">确认导入</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_TASKS = 'zhixun_tasks';
    const STORAGE_RENCAI = 'zhixun_rencai_by_unit';

    let companies = [];
    let currentUnitId = null;
    let personFilter = 'all';

    const DEFAULT_COMPANIES = [
      { id: 'c1', name: '南南铝业股份有限公司', unidentified: 286, pending: 42, confirmed: 897, status: '已审核' },
      { id: 'c2', name: '华锡集团', unidentified: 156, pending: 28, confirmed: 521, status: '已确认' },
      { id: 'c3', name: '金海不锈钢', unidentified: 98, pending: 15, confirmed: 368, status: '未审核' },
      { id: 'c4', name: '柳州钢铁有限公司', unidentified: 45, pending: 12, confirmed: 210, status: '已确认' },
      { id: 'c5', name: '南宁供电局', unidentified: 32, pending: 8, confirmed: 156, status: '已审核' }
    ];

    function loadCompanies() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(STORAGE_RENCAI) || '{}'); } catch (e) {}
      let tasks = [];
      try { tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS) || '[]'); } catch (e) {}

      const map = {};
      DEFAULT_COMPANIES.forEach(c => { map[c.id] = { ...c }; });

      tasks.forEach(t => {
        const key = 't' + t.id;
        if (saved[key]) {
          map[key] = { id: key, name: t.enterprise || t.name, ...saved[key] };
        } else if (!Object.values(map).some(c => c.name === (t.enterprise || t.name))) {
          map[key] = {
            id: key,
            name: t.enterprise || t.name || '未命名企业',
            unidentified: Math.floor((t.planCount || 30) * 0.3),
            pending: Math.floor((t.planCount || 30) * 0.15),
            confirmed: Math.floor((t.planCount || 30) * 0.5),
            status: '未审核'
          };
        }
      });

      companies = Object.values(map);
      saveCompanies();
    }

    function saveCompanies() {
      const obj = {};
      companies.forEach(c => {
        obj[c.id] = {
          unidentified: c.unidentified,
          pending: c.pending,
          confirmed: c.confirmed,
          status: c.status,
          persons: c.persons
        };
      });
      localStorage.setItem(STORAGE_RENCAI, JSON.stringify(obj));
    }

    function statusClass(st) {
      if (st === '已审核') return 'st-audited';
      if (st === '已确认') return 'st-confirmed';
      return 'st-pending';
    }

    function updateStats() {
      const u = companies.reduce((s, c) => s + c.unidentified, 0);
      const p = companies.reduce((s, c) => s + c.pending, 0);
      const d = companies.reduce((s, c) => s + c.confirmed, 0);
      document.getElementById('statRow').innerHTML = `
        <div class="stat-card identify">
          <div class="val">${companies.length}</div>
          <div class="lbl">参与识别单位</div>
        </div>
        <div class="stat-card danger">
          <div class="val red">${u}</div>
          <div class="lbl">未识别人员</div>
        </div>
        <div class="stat-card warn">
          <div class="val yellow">${p}</div>
          <div class="lbl">待确认数量</div>
        </div>
        <div class="stat-card success">
          <div class="val green">${d}</div>
          <div class="lbl">已确认数量</div>
        </div>
      `;
    }

    function filteredCompanies() {
      const kw = (document.getElementById('searchKeyword').value || '').trim().toLowerCase();
      const st = document.getElementById('filterStatus').value;
      return companies.filter(c => {
        if (st && c.status !== st) return false;
        if (kw && !c.name.toLowerCase().includes(kw)) return false;
        return true;
      });
    }

    function renderCompanyTable() {
      const list = filteredCompanies();
      const tbody = document.getElementById('companyBody');
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-secondary)">暂无单位数据，请先 Excel 导入或从任务档案创建项目</td></tr>';
        document.getElementById('pageInfo').textContent = '共 0 条记录';
        return;
      }
      tbody.innerHTML = list.map(c => `
        <tr>
          <td><strong>${c.name}</strong></td>
          <td><span style="color:var(--danger);font-weight:600">${c.unidentified}</span></td>
          <td><span style="color:var(--warning);font-weight:600">${c.pending}</span></td>
          <td><span style="color:var(--success);font-weight:600">${c.confirmed}</span></td>
          <td><span class="status-badge ${statusClass(c.status)}">${c.status}</span></td>
          <td>
            <div class="actions">
              <button type="button" class="btn-link" data-action="view" data-id="${c.id}"><i class="fas fa-eye"></i> 查看详情</button>
              <button type="button" class="btn-link warn" data-action="edit" data-id="${c.id}"><i class="fas fa-edit"></i> 编辑</button>
              ${c.status === '未审核' ? `<button type="button" class="btn-link" data-action="audit" data-id="${c.id}"><i class="fas fa-stamp"></i> 审核</button>` : ''}
              <button type="button" class="btn-link" data-action="confirm" data-id="${c.id}"><i class="fas fa-paper-plane"></i> 送企业确认</button>
            </div>
          </td>
        </tr>
      `).join('');
      document.getElementById('pageInfo').textContent = `共 ${list.length} 条记录`;
    }

    function genPersons(company) {
      if (company.persons && company.persons.length) return company.persons;
      const names = ['张伟', '李娜', '王强', '赵丽', '刘洋', '陈静', '杨帆', '周敏'];
      const depts = ['生产一部', '生产二部', '质检部', '设备科'];
      const occs = ['电工', '焊工', '起重工', '安全员'];
      const levels = ['初级', '中级', '高级', '技师'];
      const statuses = ['未识别', '待确认', '已确认'];
      const n = Math.min(company.unidentified + company.pending + company.confirmed, 12) || 8;
      const persons = [];
      for (let i = 0; i < n; i++) {
        let st = '已确认';
        if (i < company.unidentified) st = '未识别';
        else if (i < company.unidentified + company.pending) st = '待确认';
        persons.push({
          id: i + 1,
          name: names[i % names.length] + (i > 7 ? i : ''),
          code: 'GH' + String(1000 + i),
          dept: depts[i % depts.length],
          occ: occs[i % occs.length],
          level: levels[i % levels.length],
          status: st
        });
      }
      company.persons = persons;
      return persons;
    }

    function showDetail(unitId) {
      currentUnitId = unitId;
      const c = companies.find(x => x.id === unitId);
      if (!c) return;
      document.getElementById('detailTitle').textContent = c.name + ' · 人员识别明细';
      document.getElementById('listPanel').style.display = 'none';
      document.getElementById('detailPanel').classList.add('show');
      renderPersonTable();
    }

    function hideDetail() {
      currentUnitId = null;
      document.getElementById('listPanel').style.display = 'block';
      document.getElementById('detailPanel').classList.remove('show');
    }

    function renderPersonTable() {
      const c = companies.find(x => x.id === currentUnitId);
      if (!c) return;
      const persons = genPersons(c);
      const filtered = personFilter === 'all' ? persons : persons.filter(p => {
        if (personFilter === 'unidentified') return p.status === '未识别';
        if (personFilter === 'pending') return p.status === '待确认';
        return p.status === '已确认';
      });
      const tbody = document.getElementById('personBody');
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-secondary)">暂无人员</td></tr>';
        return;
      }
      tbody.innerHTML = filtered.map(p => `
        <tr>
          <td><strong>${p.name}</strong></td>
          <td>${p.code}</td>
          <td>${p.dept}</td>
          <td>${p.occ}</td>
          <td>${p.level}</td>
          <td><span class="status-badge ${p.status === '已确认' ? 'st-audited' : p.status === '待确认' ? 'st-confirmed' : 'st-pending'}">${p.status}</span></td>
          <td>
            ${p.status === '未识别' ? `<button type="button" class="btn-link" data-pid="${p.id}" data-do="identify">识别</button>` : ''}
            ${p.status === '待确认' ? `<button type="button" class="btn-link" data-pid="${p.id}" data-do="confirm">确认</button>` : ''}
          </td>
        </tr>
      `).join('');
    }

    function populateImportSelect() {
      const sel = document.getElementById('importUnit');
      sel.innerHTML = '<option value="">请选择单位</option>' +
        companies.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    document.getElementById('companyBody').addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const id = btn.dataset.id;
      const c = companies.find(x => x.id === id);
      if (!c) return;
      const action = btn.dataset.action;
      if (action === 'view') showDetail(id);
      else if (action === 'edit') alert(`编辑单位「${c.name}」信息（演示）`);
      else if (action === 'audit') { c.status = '已审核'; saveCompanies(); renderCompanyTable(); alert('已审核通过'); }
      else if (action === 'confirm') alert(`已向「${c.name}」发送企业确认通知（演示）`);
    });

    document.getElementById('personBody').addEventListener('click', e => {
      const btn = e.target.closest('[data-pid]');
      if (!btn) return;
      const c = companies.find(x => x.id === currentUnitId);
      if (!c) return;
      const p = c.persons.find(x => String(x.id) === btn.dataset.pid);
      if (!p) return;
      if (btn.dataset.do === 'identify') {
        p.status = '待确认';
        c.unidentified = Math.max(0, c.unidentified - 1);
        c.pending++;
      } else if (btn.dataset.do === 'confirm') {
        p.status = '已确认';
        c.pending = Math.max(0, c.pending - 1);
        c.confirmed++;
      }
      saveCompanies();
      updateStats();
      renderPersonTable();
    });

    document.getElementById('btnBackList').addEventListener('click', hideDetail);
    document.getElementById('filterStatus').addEventListener('change', renderCompanyTable);
    document.getElementById('searchKeyword').addEventListener('input', renderCompanyTable);

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        personFilter = tab.dataset.filter;
        renderPersonTable();
      });
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      populateImportSelect();
      document.getElementById('importModal').classList.add('show');
      document.getElementById('excelFile').value = '';
      document.getElementById('filePreview').classList.remove('show');
    });

    function closeImportModal() {
      document.getElementById('importModal').classList.remove('show');
    }
    document.getElementById('closeModal').addEventListener('click', closeImportModal);
    document.getElementById('cancelImport').addEventListener('click', closeImportModal);
    document.getElementById('importModal').addEventListener('click', e => {
      if (e.target.id === 'importModal') closeImportModal();
    });

    document.getElementById('excelFile').addEventListener('change', e => {
      const f = e.target.files[0];
      if (f) {
        document.getElementById('fileName').textContent = f.name;
        document.getElementById('filePreview').classList.add('show');
      }
    });
    document.getElementById('removeFile').addEventListener('click', () => {
      document.getElementById('excelFile').value = '';
      document.getElementById('filePreview').classList.remove('show');
    });

    document.getElementById('confirmImport').addEventListener('click', () => {
      const unitId = document.getElementById('importUnit').value;
      const file = document.getElementById('excelFile').files[0];
      if (!unitId) { alert('请选择单位'); return; }
      if (!file) { alert('请上传 Excel 文件'); return; }
      const c = companies.find(x => x.id === unitId);
      if (c) {
        const add = Math.floor(Math.random() * 30) + 20;
        c.unidentified += add;
        alert(`已向「${c.name}」导入 ${add} 条人员数据（演示）\n文件：${file.name}`);
        saveCompanies();
        updateStats();
        renderCompanyTable();
      }
      closeImportModal();
    });

    document.getElementById('btnBatchIdentify').addEventListener('click', () => {
      const c = companies.find(x => x.id === currentUnitId);
      if (!c) return;
      genPersons(c);
      let n = 0;
      c.persons.forEach(p => {
        if (p.status === '未识别') {
          p.status = '待确认';
          n++;
        }
      });
      c.unidentified = Math.max(0, c.unidentified - n);
      c.pending += n;
      saveCompanies();
      updateStats();
      renderPersonTable();
      alert(`已批量识别 ${n} 人，进入待确认`);
    });

    document.getElementById('btnSendConfirm').addEventListener('click', () => {
      const c = companies.find(x => x.id === currentUnitId);
      if (c) {
        c.status = '已确认';
        saveCompanies();
        renderCompanyTable();
        alert(`「${c.name}」识别结果已送企业确认`);
      }
    });

    document.getElementById('btnAudit').addEventListener('click', () => {
      const c = companies.find(x => x.id === currentUnitId);
      if (c) {
        c.status = '已审核';
        saveCompanies();
        renderCompanyTable();
        alert(`「${c.name}」审核通过`);
      }
    });

    let currentProjectId = null;

    function getQueryProjectId() {
      return new URLSearchParams(window.location.search).get('projectId');
    }

    document.getElementById('btnNextStep').addEventListener('click', () => {
      const q = currentProjectId ? `?projectId=${currentProjectId}` : '';
      if (companies.some(c => c.unidentified > 0)) {
        if (!confirm('仍有未识别人员，是否继续进入初步方案？')) return;
      }
      window.location.href = '初步方案.html' + q;
    });

    function applyProjectContext() {
      const pid = getQueryProjectId();
      if (!pid) return;
      currentProjectId = pid;
      let tasks = [];
      try { tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS) || '[]'); } catch (e) {}
      const project = tasks.find(t => String(t.id) === String(pid));
      if (!project) return;
      const name = project.enterprise || project.name;
      document.getElementById('pageSub').textContent =
        `${name} · 企业人才数据识别与确认 · 步骤 1 / 9`;
      const key = 't' + pid;
      if (!companies.some(c => c.id === key)) {
        companies.unshift({
          id: key,
          name: name || '当前项目企业',
          unidentified: Math.floor((project.planCount || 30) * 0.3),
          pending: Math.floor((project.planCount || 30) * 0.15),
          confirmed: Math.floor((project.planCount || 30) * 0.5),
          status: '未审核'
        });
        saveCompanies();
      }
      document.getElementById('searchKeyword').value = name || '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadCompanies();
      applyProjectContext();
      updateStats();
      renderCompanyTable();
    });
  </script>
</body>
</html>
