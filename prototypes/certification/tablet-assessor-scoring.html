<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认定管理 - 平板考评端原型</title>
  <style>
    :root {
      --bg: #eef3f8;
      --panel: #fff;
      --line: #dbe4ee;
      --line-soft: #edf1f5;
      --text: #172033;
      --muted: #64748b;
      --blue: #1677ff;
      --blue-soft: #eaf3ff;
      --green: #22a06b;
      --amber: #b7791f;
      --red: #d4380d;
      --shadow: 0 8px 24px rgba(30, 55, 90, .06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .shell { min-height: 100vh; }
    .header {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
    }
    .title h1 { margin: 0; font-size: 24px; line-height: 32px; }
    .title p { margin: 4px 0 0; color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .tag.success { color: #166534; border-color: #bbf7d0; background: #f0fdf4; }
    .tag.processing { color: #1d4ed8; border-color: #bfdbfe; background: #eff6ff; }
    .tag.warning { color: #92400e; border-color: #fde68a; background: #fffbeb; }
    .tag.error { color: #991b1b; border-color: #fecaca; background: #fef2f2; }
    .tag.default { color: #475569; border-color: #e2e8f0; background: #f8fafc; }

    .btn {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font-weight: 600;
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .btn.danger { border-color: var(--red); background: var(--red); color: #fff; }
    .btn.ghost { background: #f8fafc; }
    .btn.icon { width: 42px; padding: 0; font-size: 18px; }
    .btn.large { min-height: 56px; padding: 12px 22px; font-size: 18px; }
    .btn:disabled { cursor: not-allowed; opacity: .48; }

    .main {
      display: grid;
      min-height: calc(100vh - 82px);
      grid-template-columns: 330px minmax(0, 1fr);
    }
    .task-list {
      border-right: 1px solid var(--line);
      background: var(--panel);
    }
    .task-list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px;
      border-bottom: 1px solid var(--line-soft);
    }
    .task-list-head h2 { margin: 0; font-size: 18px; }
    .task-card {
      display: flex;
      width: 100%;
      min-height: 112px;
      flex-direction: column;
      gap: 8px;
      padding: 16px 18px;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      background: #fff;
      text-align: left;
    }
    .task-card.selected {
      border-right: 4px solid var(--blue);
      background: var(--blue-soft);
    }
    .task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .task-title { color: #334155; line-height: 1.45; }
    .task-sub { color: var(--muted); font-size: 12px; }

    .workspace { padding: 20px 24px 130px; }
    .mobile-back { display: none; margin-bottom: 12px; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .candidate-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .candidate-bar .label { color: var(--muted); font-size: 14px; }
    .candidate-bar h2 { margin: 2px 0; font-size: 24px; }
    .candidate-info { color: #475569; }
    .live-score { min-width: 128px; text-align: center; }
    .live-score span, .live-score strong { display: block; }
    .live-score span { color: var(--muted); }
    .live-score strong { color: var(--blue); font-size: 42px; line-height: 48px; }

    .alert {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      margin: 14px 0;
      border: 1px solid;
      border-radius: 8px;
      line-height: 1.5;
    }
    .alert strong { display: block; margin-bottom: 2px; }
    .alert.warning { color: #92400e; border-color: #fde68a; background: #fffbeb; }
    .alert.error { color: #991b1b; border-color: #fecaca; background: #fef2f2; }

    .start-gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 28px;
      margin-bottom: 20px;
      border: 2px solid var(--blue);
      border-radius: 8px;
      background: #f0f7ff;
      text-align: center;
    }
    .start-gate h2 { margin: 0; font-size: 24px; }
    .start-steps { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .start-gate .btn { min-width: 320px; }
    .start-note { max-width: 720px; color: var(--muted); line-height: 1.55; }

    .question-card { padding: 20px; margin: 14px 0; }
    .question-card h2 { margin: 0 0 10px; font-size: 22px; }
    .question-card p { margin: 0 0 14px; color: #334155; line-height: 1.65; }
    .prepare-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .prepare-grid div {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px;
      border-radius: 8px;
      background: #f5f8fc;
    }
    .prepare-grid span { color: var(--muted); line-height: 1.5; }

    .progress-row {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      align-items: center;
      margin: 20px 0 12px;
      color: #334155;
      font-weight: 600;
    }
    .progress {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #dbeafe;
    }
    .progress span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
      transition: width .2s ease;
    }

    .score-items { display: grid; gap: 14px; }
    .score-item { padding: 20px; }
    .score-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .score-item-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .item-no {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
    }
    .score-item h3 { margin: 0; font-size: 19px; }
    .item-score { color: var(--blue); font-size: 24px; font-weight: 800; white-space: nowrap; }
    .criterion { margin: 12px 0 0; color: #334155; line-height: 1.65; }
    .deduction-control {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 130px minmax(180px, 1fr);
      gap: 14px;
      align-items: stretch;
      margin: 16px 0;
    }
    .deduction-control .btn { height: 58px; font-size: 17px; font-weight: 800; }
    .deduction-value {
      display: grid;
      min-height: 58px;
      place-items: center;
      border-radius: 8px;
      background: #fff7e6;
      text-align: center;
    }
    .deduction-value span, .deduction-value strong { display: block; }
    .deduction-value span { color: #7c2d12; font-size: 13px; }
    .deduction-value strong { color: var(--red); font-size: 26px; }
    .remark-input, .note-textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: #fff;
      outline: none;
    }
    .remark-input { min-height: 42px; padding: 8px 12px; }
    .note { display: grid; gap: 10px; padding: 20px; margin-top: 16px; }
    .note-textarea { min-height: 88px; resize: vertical; padding: 10px 12px; line-height: 1.6; }
    .remark-input:focus, .note-textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(22, 119, 255, .12); }

    .submit-bar {
      position: fixed;
      z-index: 30;
      right: 0;
      bottom: 0;
      left: 330px;
      display: flex;
      min-height: 96px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 28px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 -8px 24px rgba(30, 55, 90, .08);
    }
    .submit-score span, .submit-score strong { display: block; }
    .submit-score span { color: var(--muted); }
    .submit-score strong { color: var(--blue); font-size: 34px; }
    .submit-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .submit-actions .btn { min-width: 220px; }

    .modal-mask {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, .38);
    }
    .modal-mask.show { display: flex; }
    .modal {
      width: min(460px, 100%);
      padding: 24px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .24);
    }
    .modal h3 { margin: 0 0 8px; font-size: 21px; }
    .modal p { margin: 0 0 22px; color: var(--muted); line-height: 1.6; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

    .toast {
      position: fixed;
      z-index: 90;
      top: 92px;
      left: 50%;
      display: none;
      transform: translateX(-50%);
      padding: 10px 16px;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      background: #f0fdf4;
      color: #166534;
      font-weight: 700;
      box-shadow: var(--shadow);
    }
    .toast.show { display: block; }

    @media (max-width: 900px), (orientation: portrait) {
      .header { padding: 12px 16px; align-items: flex-start; }
      .title h1 { font-size: 21px; }
      .main { display: block; }
      .main.has-selection .task-list { display: none; }
      .main:not(.has-selection) .workspace { display: none; }
      .task-list { border-right: 0; }
      .workspace { padding: 14px 14px 120px; }
      .mobile-back { display: inline-flex; }
      .submit-bar { left: 0; min-height: 88px; padding: 10px 16px; }
      .prepare-grid, .deduction-control { grid-template-columns: 1fr; }
      .deduction-value { min-height: 64px; }
      .candidate-bar { align-items: flex-start; }
      .live-score strong { font-size: 34px; line-height: 40px; }
      .submit-actions .btn { min-width: 160px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="title">
        <h1>实操考评</h1>
        <p>张国强，请独立完成本人评分</p>
      </div>
      <div class="header-actions">
        <span id="onlineTag" class="tag success">在线</span>
        <span id="syncTag" class="tag processing">已同步</span>
        <button class="btn ghost" type="button">切换账号</button>
      </div>
    </header>

    <main id="main" class="main has-selection">
      <aside class="task-list">
        <div class="task-list-head">
          <h2>我的评分任务</h2>
          <button class="btn icon" type="button" onclick="showToast('任务列表已刷新')">↻</button>
        </div>
        <div id="taskList"></div>
      </aside>

      <section class="workspace">
        <button class="btn mobile-back" type="button" onclick="backToTasks()">‹ 返回任务</button>
        <div class="candidate-bar panel">
          <div>
            <div class="label">当前考生</div>
            <h2 id="candidateName"></h2>
            <div id="candidateInfo" class="candidate-info"></div>
          </div>
          <div class="live-score">
            <span>本份试题得分</span>
            <strong id="liveScore">0</strong>
          </div>
        </div>

        <div id="returnAlert" class="alert warning" style="display:none">
          <div>
            <strong>管理员已退回，请重新评分</strong>
            <span id="returnReason"></span>
          </div>
        </div>
        <div id="conflictAlert" class="alert error" style="display:none">
          <div>
            <strong>该任务已在其他设备更新</strong>
            <span>系统已停止自动覆盖。请重新加载服务端版本后继续。</span>
          </div>
          <button class="btn" type="button" onclick="resetConflict()">重新加载</button>
        </div>

        <div id="startGate" class="start-gate">
          <h2>统一开考确认</h2>
          <div class="start-steps">
            <span class="tag success">考生已确认</span>
            <span id="assessorConfirmTag" class="tag processing">考评员 2/3</span>
            <span class="tag success">试卷已匹配</span>
          </div>
          <button class="btn primary large" type="button" onclick="startExam()">组长开始考试</button>
          <button class="btn large" type="button" onclick="confirmReady()">我已核对考生与试卷，确认就绪</button>
          <div class="start-note">组长开始考试后，系统将同步解锁三名考评员的评分界面。</div>
        </div>

        <article class="question-card panel">
          <h2 id="questionTitle"></h2>
          <p id="questionContent"></p>
          <div class="prepare-grid">
            <div>
              <strong>考生准备</strong>
              <span id="studentPrepare"></span>
            </div>
            <div>
              <strong>设备设施</strong>
              <span id="equipmentPrepare"></span>
            </div>
          </div>
        </article>

        <div class="progress-row">
          <span id="progressText">评分要素 0/0</span>
          <div class="progress"><span id="progressBar"></span></div>
        </div>

        <div id="scoreItems" class="score-items"></div>

        <div class="note panel">
          <strong>本题考评说明</strong>
          <textarea id="noteInput" class="note-textarea" placeholder="可记录现场情况，仅管理人员可查看" oninput="markSyncing()"></textarea>
        </div>
      </section>
    </main>

    <footer class="submit-bar">
      <div class="submit-score">
        <span>系统自动计算</span>
        <strong><span id="footerScore">0</span> 分</strong>
      </div>
      <div class="submit-actions">
        <button id="submitBtn" class="btn primary large" type="button" onclick="openSubmitModal()">提交并锁定</button>
        <button id="completeBtn" class="btn large" type="button" disabled onclick="completeExam()">组长完成考试</button>
      </div>
    </footer>
  </div>

  <div id="submitModal" class="modal-mask" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>确认提交本份评分？</h3>
      <p>提交后将锁定，只有管理员退回后才能重新评分。请再次核对所有扣分项。</p>
      <div class="modal-actions">
        <button class="btn" type="button" onclick="closeSubmitModal()">继续检查</button>
        <button class="btn primary" type="button" onclick="submitScore()">确认提交</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const tasks = [
      {
        id: 't1',
        status: 'draft',
        candidateName: '李明',
        candidateNo: 'GZ-202606-018',
        workTypeName: '铝电解操作工',
        levelName: '三级',
        questionTitle: '电解槽异常温度判断与处置',
        questionContent: '考生需根据现场仪表读数、槽况描述和作业票要求，完成异常温度识别、处置步骤选择、口述安全注意事项。',
        studentPrepare: '穿戴防护用品，核对身份信息，确认作业票和设备状态。',
        equipmentPrepare: '仿真实操台、测温仪、记录板、应急处置卡、个人防护用品。',
        startSession: { status: 'waiting', candidateConfirmed: true, confirmedAssessors: 2, requiredAssessors: 3 },
        scoreItems: [
          { itemNo: 1, itemName: '安全确认', criterion: '进入工位前完成劳保穿戴检查，确认警戒线、作业票、设备状态，漏项按标准扣分。', maxScore: 20, maxDeduction: 20, deductionStep: 2, deductedScore: 0, remark: '' },
          { itemNo: 2, itemName: '异常识别', criterion: '能根据温度、电压、电流和现场描述判断异常类型，并说明风险等级。', maxScore: 30, maxDeduction: 30, deductionStep: 3, deductedScore: 3, remark: '风险等级描述不够完整' },
          { itemNo: 3, itemName: '处置步骤', criterion: '按规定顺序完成汇报、隔离、复核、处置和记录，顺序错误或关键步骤遗漏扣分。', maxScore: 35, maxDeduction: 35, deductionStep: 5, deductedScore: 0, remark: '' },
          { itemNo: 4, itemName: '现场记录', criterion: '记录时间、读数、处理结果和复核人信息，记录不清或缺失扣分。', maxScore: 15, maxDeduction: 15, deductionStep: 1, deductedScore: 0, remark: '' }
        ],
        note: ''
      },
      {
        id: 't2',
        status: 'assigned',
        candidateName: '王婷',
        candidateNo: 'GZ-202606-021',
        workTypeName: '铝电解操作工',
        levelName: '三级',
        questionTitle: '阳极效应识别与应急处理',
        questionContent: '考生需完成阳极效应判断、原因分析和现场应急处置口述。',
        studentPrepare: '确认身份、抽题结果和安全承诺。',
        equipmentPrepare: '仿真屏、作业指导书、计时器。',
        startSession: { status: 'started', candidateConfirmed: true, confirmedAssessors: 3, requiredAssessors: 3 },
        scoreItems: [
          { itemNo: 1, itemName: '现象判断', criterion: '准确说出效应电压变化、气体变化和风险点。', maxScore: 30, maxDeduction: 30, deductionStep: 3, deductedScore: 0, remark: '' },
          { itemNo: 2, itemName: '原因分析', criterion: '分析氧化铝浓度、操作节奏和槽况因素。', maxScore: 30, maxDeduction: 30, deductionStep: 3, deductedScore: 0, remark: '' },
          { itemNo: 3, itemName: '应急处置', criterion: '按标准完成汇报、加料、复核和记录。', maxScore: 40, maxDeduction: 40, deductionStep: 5, deductedScore: 5, remark: '复核动作偏慢' }
        ],
        note: ''
      },
      {
        id: 't3',
        status: 'submitted',
        candidateName: '赵磊',
        candidateNo: 'GZ-202606-023',
        workTypeName: '铝电解操作工',
        levelName: '三级',
        questionTitle: '槽况巡视与隐患排查',
        questionContent: '考生需完成标准巡视路线、隐患识别和闭环记录。',
        studentPrepare: '穿戴防护用品，领取巡视记录单。',
        equipmentPrepare: '巡视路线图、记录单、仿真隐患点。',
        startSession: { status: 'completed', candidateConfirmed: true, confirmedAssessors: 3, requiredAssessors: 3 },
        scoreItems: [
          { itemNo: 1, itemName: '巡视路线', criterion: '按规定路线完成巡视，不逆行、不漏点。', maxScore: 30, maxDeduction: 30, deductionStep: 3, deductedScore: 3, remark: '漏检一个点位' },
          { itemNo: 2, itemName: '隐患识别', criterion: '识别全部关键隐患并说明影响。', maxScore: 45, maxDeduction: 45, deductionStep: 5, deductedScore: 5, remark: '' },
          { itemNo: 3, itemName: '闭环记录', criterion: '记录清晰、完整、可追溯。', maxScore: 25, maxDeduction: 25, deductionStep: 2, deductedScore: 0, remark: '' }
        ],
        note: '已完成三方评分汇总。'
      },
      {
        id: 't4',
        status: 'returned',
        candidateName: '周航',
        candidateNo: 'GZ-202606-026',
        workTypeName: '铝电解操作工',
        levelName: '四级',
        questionTitle: '设备点检与故障上报',
        questionContent: '考生需完成点检表核对、故障判断和上报流程。',
        studentPrepare: '确认点检范围和安全风险。',
        equipmentPrepare: '点检表、设备铭牌、异常示意图。',
        returnReason: '第 2 项扣分说明与视频复核不一致，请补充说明后重新提交。',
        startSession: { status: 'started', candidateConfirmed: true, confirmedAssessors: 3, requiredAssessors: 3 },
        scoreItems: [
          { itemNo: 1, itemName: '点检准备', criterion: '正确读取点检表和设备编号。', maxScore: 25, maxDeduction: 25, deductionStep: 2, deductedScore: 0, remark: '' },
          { itemNo: 2, itemName: '故障判断', criterion: '准确判断故障类型和紧急程度。', maxScore: 45, maxDeduction: 45, deductionStep: 5, deductedScore: 10, remark: '需补充判断依据' },
          { itemNo: 3, itemName: '上报流程', criterion: '按规定完成逐级上报和记录。', maxScore: 30, maxDeduction: 30, deductionStep: 3, deductedScore: 3, remark: '' }
        ],
        note: ''
      }
    ];

    let selectedId = 't1';
    let online = true;
    let syncState = 'saved';
    let toastTimer;

    function statusText(status) {
      return { assigned: '待评分', draft: '评分中', submitted: '已提交', returned: '已退回' }[status] || status;
    }

    function statusClass(status) {
      return { assigned: 'processing', draft: 'processing', submitted: 'success', returned: 'error' }[status] || 'default';
    }

    function syncText(status) {
      return { saved: '已同步', syncing: '同步中', offline: '已保存到本机', conflict: '版本冲突' }[status] || status;
    }

    function currentTask() {
      return tasks.find((task) => task.id === selectedId) || tasks[0];
    }

    function renderTasks() {
      document.getElementById('taskList').innerHTML = tasks.map((task) => `
        <button class="task-card ${task.id === selectedId ? 'selected' : ''}" type="button" onclick="selectTask('${task.id}')">
          <div class="task-meta">
            <span class="tag ${statusClass(task.status)}">${statusText(task.status)}</span>
            <strong>${task.candidateName}</strong>
            <span>${task.candidateNo}</span>
          </div>
          <div class="task-title">${task.questionTitle}</div>
          <div class="task-sub">${task.workTypeName} / ${task.levelName}</div>
        </button>
      `).join('');
    }

    function renderDetail() {
      const task = currentTask();
      document.getElementById('main').classList.add('has-selection');
      document.getElementById('candidateName').textContent = task.candidateName;
      document.getElementById('candidateInfo').textContent = `${task.candidateNo || '-'} · ${task.workTypeName} · ${task.levelName}`;
      document.getElementById('questionTitle').textContent = task.questionTitle;
      document.getElementById('questionContent').textContent = task.questionContent;
      document.getElementById('studentPrepare').textContent = task.studentPrepare || '-';
      document.getElementById('equipmentPrepare').textContent = task.equipmentPrepare || '-';
      document.getElementById('noteInput').value = task.note || '';

      const scoringStarted = task.startSession.status === 'started';
      const sessionCompleted = task.startSession.status === 'completed';
      document.getElementById('startGate').style.display = scoringStarted || sessionCompleted ? 'none' : 'flex';
      document.getElementById('assessorConfirmTag').textContent = `考评员 ${task.startSession.confirmedAssessors}/${task.startSession.requiredAssessors}`;
      document.getElementById('assessorConfirmTag').className = task.startSession.confirmedAssessors === task.startSession.requiredAssessors ? 'tag success' : 'tag processing';
      document.getElementById('returnAlert').style.display = task.status === 'returned' ? 'flex' : 'none';
      document.getElementById('returnReason').textContent = task.returnReason || '';

      document.getElementById('scoreItems').innerHTML = task.scoreItems.map((item) => {
        const awarded = Math.max(0, item.maxScore - item.deductedScore);
        const disabled = !scoringStarted || sessionCompleted || task.status === 'submitted';
        return `
          <article class="score-item panel">
            <div class="score-item-head">
              <div class="score-item-name">
                <span class="item-no">${item.itemNo}</span>
                <h3>${item.itemName}</h3>
              </div>
              <div class="item-score"><span id="awarded-${item.itemNo}">${awarded}</span> / ${item.maxScore}分</div>
            </div>
            <p class="criterion">${item.criterion}</p>
            <div class="deduction-control">
              <button class="btn" type="button" ${disabled || item.deductedScore <= 0 ? 'disabled' : ''} onclick="adjust(${item.itemNo}, -${item.deductionStep})">− 撤销 ${item.deductionStep} 分</button>
              <div class="deduction-value">
                <span>当前扣分</span>
                <strong id="deducted-${item.itemNo}">${item.deductedScore}</strong>
              </div>
              <button class="btn danger" type="button" ${disabled || item.deductedScore >= item.maxDeduction ? 'disabled' : ''} onclick="adjust(${item.itemNo}, ${item.deductionStep})">＋ 扣 ${item.deductionStep} 分</button>
            </div>
            <input class="remark-input" value="${item.remark || ''}" ${disabled ? 'disabled' : ''} placeholder="扣分说明（选填）" oninput="updateRemark(${item.itemNo}, this.value)">
          </article>
        `;
      }).join('');

      document.getElementById('noteInput').disabled = !scoringStarted || sessionCompleted || task.status === 'submitted';
      document.getElementById('submitBtn').disabled = !scoringStarted || sessionCompleted || !online || syncState === 'syncing' || syncState === 'conflict' || task.status === 'submitted';
      document.getElementById('submitBtn').textContent = task.status === 'submitted' ? '已提交' : online ? '提交并锁定' : '联网后提交';
      document.getElementById('completeBtn').disabled = !scoringStarted || task.status !== 'submitted';
      document.getElementById('completeBtn').textContent = sessionCompleted ? '考试已完成' : '组长完成考试';
      updateScore();
    }

    function selectTask(id) {
      selectedId = id;
      syncState = 'saved';
      renderAll();
    }

    function backToTasks() {
      document.getElementById('main').classList.remove('has-selection');
    }

    function adjust(itemNo, delta) {
      const task = currentTask();
      const item = task.scoreItems.find((scoreItem) => scoreItem.itemNo === itemNo);
      item.deductedScore = Math.min(item.maxDeduction, Math.max(0, item.deductedScore + delta));
      markSyncing();
      renderAll();
    }

    function updateRemark(itemNo, value) {
      const item = currentTask().scoreItems.find((scoreItem) => scoreItem.itemNo === itemNo);
      item.remark = value;
      markSyncing();
    }

    function markSyncing() {
      const task = currentTask();
      task.note = document.getElementById('noteInput') ? document.getElementById('noteInput').value : task.note;
      syncState = online ? 'syncing' : 'offline';
      updateStatusTags();
      window.clearTimeout(markSyncing.timer);
      if (online) {
        markSyncing.timer = window.setTimeout(() => {
          syncState = 'saved';
          updateStatusTags();
        }, 900);
      }
    }

    function updateScore() {
      const task = currentTask();
      const total = task.scoreItems.reduce((sum, item) => sum + Math.max(0, item.maxScore - item.deductedScore), 0);
      const completed = task.scoreItems.filter((item) => item.deductedScore !== undefined).length;
      const percent = task.scoreItems.length ? Math.round(completed * 100 / task.scoreItems.length) : 0;
      document.getElementById('liveScore').textContent = total;
      document.getElementById('footerScore').textContent = total;
      document.getElementById('progressText').textContent = `评分要素 ${completed}/${task.scoreItems.length}`;
      document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function updateStatusTags() {
      const onlineTag = document.getElementById('onlineTag');
      onlineTag.className = online ? 'tag success' : 'tag warning';
      onlineTag.textContent = online ? '在线' : '短时断网';
      const syncTag = document.getElementById('syncTag');
      syncTag.className = syncState === 'conflict' ? 'tag error' : syncState === 'offline' ? 'tag warning' : 'tag processing';
      syncTag.textContent = syncText(syncState);
      document.getElementById('conflictAlert').style.display = syncState === 'conflict' ? 'flex' : 'none';
    }

    function confirmReady() {
      const session = currentTask().startSession;
      session.confirmedAssessors = Math.min(session.requiredAssessors, session.confirmedAssessors + 1);
      showToast(session.confirmedAssessors === session.requiredAssessors ? '全员已确认，可开始考试' : '已确认，正在等待其他人员');
      renderAll();
    }

    function startExam() {
      const task = currentTask();
      task.startSession.status = 'started';
      task.startSession.confirmedAssessors = task.startSession.requiredAssessors;
      if (task.status === 'assigned') task.status = 'draft';
      showToast('考试已开始，评分界面已同步解锁');
      renderAll();
    }

    function openSubmitModal() {
      document.getElementById('submitModal').classList.add('show');
    }

    function closeSubmitModal() {
      document.getElementById('submitModal').classList.remove('show');
    }

    function submitScore() {
      const task = currentTask();
      task.status = 'submitted';
      syncState = 'saved';
      closeSubmitModal();
      showToast('评分已提交并锁定');
      renderAll();
    }

    function completeExam() {
      currentTask().startSession.status = 'completed';
      showToast('考试已完成，评分数据已锁定');
      renderAll();
    }

    function resetConflict() {
      syncState = 'saved';
      showToast('已重新加载服务端版本');
      renderAll();
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function renderAll() {
      renderTasks();
      renderDetail();
      updateStatusTags();
    }

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeSubmitModal();
    });

    renderAll();
  </script>
</body>
</html>
