<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认定准备 - 智训企业版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #2A6DFF;
      --primary-hover: #1E5AE8;
      --primary-light: #E8F0FF;
      --bg: #F5F7FC;
      --card: #FFFFFF;
      --text: #1A2332;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(42, 109, 255, 0.06);
      --radius-card: 20px;
      --radius-btn: 12px;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: var(--radius-btn); transition: all 0.2s;
    }
    .back-link:hover { background: var(--primary-light); color: var(--primary); }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar .sub { font-size: 13px; color: var(--text-secondary); }
    .process-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 6px 12px;
      background: var(--primary-light); color: var(--primary);
      border-radius: 20px; font-weight: 500;
    }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stat-card .val { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat-card .val.success { color: var(--success); }
    .stat-card .val.warn { color: var(--warning); }
    .stat-card .lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .card-head {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-head .title-wrap { display: flex; align-items: center; gap: 10px; }
    .card-head i { color: var(--primary); }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 8px 16px; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .project-banner {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--primary-light);
      border-radius: var(--radius-btn);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px 24px;
      font-size: 13px;
    }
    .project-banner .item label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
    .workspace-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .workspace-empty i { font-size: 40px; color: var(--border); margin-bottom: 16px; display: block; }
    .alert-banner {
      padding: 14px 18px;
      border-radius: var(--radius-btn);
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .alert-banner.warn { background: #FEF3C7; color: #92400E; }
    .alert-banner a { font-weight: 600; color: inherit; }
    .flow-steps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .flow-step {
      flex: 1;
      min-width: 110px;
      text-align: center;
      padding: 12px 8px;
      border-radius: var(--radius-btn);
      background: var(--bg);
      font-size: 12px;
      color: var(--text-secondary);
    }
    .flow-step.done { background: #D1FAE5; color: #059669; font-weight: 600; }
    .flow-step.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .flow-step i { display: block; font-size: 18px; margin-bottom: 6px; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
    .filter-bar .form-group { margin: 0; min-width: 160px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th {
      text-align: left; padding: 12px 14px; font-size: 12px; color: var(--text-secondary);
      background: #FAFBFD; border-bottom: 2px solid var(--border);
    }
    .data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .data-table tr:hover td { background: rgba(42, 109, 255, 0.02); }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
      white-space: nowrap;
    }
    .st-pending { background: #F1F5F9; color: #64748B; }
    .st-pass { background: #D1FAE5; color: #059669; }
    .st-fail { background: #FEE2E2; color: #DC2626; }
    .st-ok { background: #E8F0FF; color: var(--primary); }
    .st-rsb { background: #FEF3C7; color: #D97706; }
    .st-cert { background: #059669; color: #fff; }
    .action-btns { display: flex; gap: 6px; }
    .action-btn {
      width: 32px; height: 32px; border: none; border-radius: 8px;
      background: var(--bg); color: var(--text-secondary); cursor: pointer;
    }
    .action-btn:hover { background: var(--primary-light); color: var(--primary); }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
    }
    .modal-box h3 { margin-bottom: 20px; font-size: 18px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="培训管理系统 主页面.html?panel=process" class="back-link">
        <i class="fas fa-arrow-left"></i> 返回培训流程
      </a>
      <div>
        <h1>认定准备</h1>
        <span class="sub" id="pageSub">按项目组织认定准备与获证 · 步骤 6 / 9</span>
      </div>
    </div>
    <span class="process-badge"><i class="fas fa-certificate"></i> … → 认定准备 → 申报服务 → …</span>
  </header>

  <main class="page">
    <div class="card">
      <div class="card-head">
        <div class="title-wrap"><i class="fas fa-folder-open"></i> 培训项目</div>
        <a href="任务档案.html" class="btn btn-secondary btn-sm"><i class="fas fa-list"></i> 任务档案</a>
      </div>
      <div class="form-group">
        <label>选择企业培训项目（认定针对该项目已分班学员）</label>
        <select id="projectSelect">
          <option value="">请选择项目…</option>
        </select>
      </div>
      <div id="projectBanner" class="project-banner" style="display:none"></div>
    </div>

    <div id="workspaceEmpty" class="workspace-empty">
      <i class="fas fa-hand-pointer"></i>
      <p>请先选择<strong>企业培训项目</strong>，再办理技能等级认定与获证花名册。</p>
      <p style="margin-top:8px;font-size:13px">需先完成 <a href="人才识别.html">人才识别</a>、<a href="培训.html">培训</a>；也可从任务档案进入。</p>
    </div>

    <div id="rendingWorkspace" style="display:none">
      <div id="noStudentAlert" class="alert-banner warn" style="display:none">
        <i class="fas fa-exclamation-triangle"></i>
        <div>本项目尚无已分班学员，请先 <a href="#" id="linkRencai">分班</a> 并完成培训。</div>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <div class="val" id="statTotal">0</div>
          <div class="lbl">参考人数</div>
        </div>
        <div class="stat-card">
          <div class="val warn" id="statPending">0</div>
          <div class="lbl">待认定</div>
        </div>
        <div class="stat-card">
          <div class="val success" id="statPassRate">0%</div>
          <div class="lbl">通过率</div>
        </div>
        <div class="stat-card">
          <div class="val" id="statCertified">0</div>
          <div class="lbl">已获证</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="title-wrap"><i class="fas fa-route"></i> 认定流程</div>
          <span style="font-size:12px;color:var(--text-secondary)">条件审核 → 理论/实操考核 → 花名册 → 人社提交 → 证书发放</span>
        </div>
        <div class="flow-steps" id="flowSteps"></div>
        <div class="toolbar">
          <button type="button" class="btn btn-primary btn-sm" id="btnCheckCondition">
            <i class="fas fa-clipboard-check"></i> 批量条件审核
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnBatchExam">
            <i class="fas fa-pen-fancy"></i> 批量录入考核成绩
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnGenRoster">
            <i class="fas fa-file-excel"></i> 生成获证花名册
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnSubmitRsb">
            <i class="fas fa-cloud-upload-alt"></i> 提交人社系统
          </button>
          <button type="button" class="btn btn-success btn-sm" id="btnIssueCert">
            <i class="fas fa-award"></i> 证书发放登记
          </button>
        </div>

        <div class="filter-bar">
          <div class="form-group">
            <label>班级</label>
            <select id="filterClass"><option value="">全部</option></select>
          </div>
          <div class="form-group">
            <label>考核结果</label>
            <select id="filterResult">
              <option value="">全部</option>
              <option value="待考">待考</option>
              <option value="通过">通过</option>
              <option value="未通过">未通过</option>
            </select>
          </div>
        </div>

        <div class="table-wrap" style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>姓名</th>
                <th>班级</th>
                <th>工种</th>
                <th>条件</th>
                <th>理论</th>
                <th>实操</th>
                <th>结果</th>
                <th>人社</th>
                <th>证书</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="studentBody"></tbody>
          </table>
        </div>
      </div>

      <div style="display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap">
        <a href="培训.html" class="btn btn-secondary" id="linkBackPeixun"><i class="fas fa-chalkboard-teacher"></i> 返回培训</a>
        <a href="培训管理系统 主页面.html?panel=process" class="btn btn-secondary">保存并返回流程</a>
        <button type="button" class="btn btn-success" id="btnNextStep">
          <i class="fas fa-arrow-right"></i> 完成认定准备，进入申报服务
        </button>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="examModal">
    <div class="modal-box">
      <h3>录入考核成绩</h3>
      <input type="hidden" id="editStudentId">
      <p id="examStudentName" style="margin-bottom:16px;font-weight:600"></p>
      <div class="form-grid">
        <div class="form-group">
          <label>理论成绩</label>
          <input type="number" id="theoryScore" min="0" max="100" placeholder="0-100">
        </div>
        <div class="form-group">
          <label>实操成绩</label>
          <input type="number" id="practicalScore" min="0" max="100" placeholder="0-100">
        </div>
        <div class="form-group full">
          <label>认定条件符合</label>
          <select id="conditionOk">
            <option value="true">符合</option>
            <option value="false">不符合</option>
            <option value="">待审核</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
        <button type="button" class="btn btn-secondary" id="examModalCancel">取消</button>
        <button type="button" class="btn btn-primary" id="examModalSave">保存</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_TASKS = 'zhixun_tasks';
    const STORAGE_FENBAN = 'zhixun_fenban_by_project';
    const STORAGE_RENDING = 'zhixun_rending_by_project';
    const PASS_SCORE = 60;

    const FLOW_LABELS = ['条件审核', '理论/实操', '获证花名册', '人社提交', '证书发放'];

    let tasks = [];
    let currentProjectId = null;
    let currentProject = null;
    let candidates = [];

    function loadTasks() {
      try { tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS) || '[]'); }
      catch (e) { tasks = []; }
    }

    function getStore(key) {
      try { return JSON.parse(localStorage.getItem(key) || '{}'); }
      catch (e) { return {}; }
    }

    function buildCandidates(projectId, saved) {
      const fenban = getStore(STORAGE_FENBAN)[String(projectId)];
      if (!fenban) return [];
      const registry = fenban.studentRegistry || {};
      const classes = fenban.classes || [];
      const savedMap = {};
      (saved || []).forEach(s => { savedMap[s.studentId] = s; });

      const list = [];
      classes.forEach(cls => {
        (cls.studentIds || []).forEach(sid => {
          const base = registry[sid] || { id: sid, name: '学员' + String(sid).slice(-2), occupation: '—' };
          const existing = savedMap[sid];
          if (existing) {
            list.push({ ...existing, className: cls.name, classId: cls.id });
            return;
          }
          list.push({
            studentId: sid,
            name: base.name,
            classId: cls.id,
            className: cls.name,
            occupation: base.occupation || '—',
            conditionOk: null,
            theoryScore: null,
            practicalScore: null,
            result: '待考',
            rsbStatus: '未提交',
            certNo: '',
            certStatus: '未发证'
          });
        });
      });
      return list;
    }

    function computeResult(s) {
      if (s.conditionOk === false) return '未通过';
      if (s.theoryScore == null || s.practicalScore == null) return '待考';
      if (s.theoryScore >= PASS_SCORE && s.practicalScore >= PASS_SCORE) return '通过';
      return '未通过';
    }

    function loadProjectData(projectId) {
      const project = tasks.find(t => t.id === projectId);
      if (!project) return;
      currentProjectId = projectId;
      currentProject = project;

      const all = getStore(STORAGE_RENDING);
      const bundle = all[String(projectId)] || {};
      candidates = buildCandidates(projectId, bundle.candidates);

      if (!all[String(projectId)]) {
        all[String(projectId)] = { projectId, candidates };
        localStorage.setItem(STORAGE_RENDING, JSON.stringify(all));
      }

      document.getElementById('linkRencai').href = `人才识别.html?projectId=${projectId}`;
      document.getElementById('linkBackPeixun').href = `培训.html?projectId=${projectId}`;

      renderProjectBanner();
      populateClassFilter();
      toggleWorkspace(true);
      document.getElementById('noStudentAlert').style.display = candidates.length ? 'none' : 'flex';
      renderAll();
    }

    function saveData() {
      if (!currentProjectId) return;
      const all = getStore(STORAGE_RENDING);
      all[String(currentProjectId)] = { projectId: currentProjectId, candidates };
      localStorage.setItem(STORAGE_RENDING, JSON.stringify(all));
    }

    function renderProjectBanner() {
      const p = currentProject;
      const banner = document.getElementById('projectBanner');
      banner.style.display = 'grid';
      const passed = candidates.filter(s => s.result === '通过').length;
      banner.innerHTML = `
        <div class="item"><label>企业</label><strong>${p.enterprise || '—'}</strong></div>
        <div class="item"><label>培训项目</label><strong>${p.name || '—'}</strong></div>
        <div class="item"><label>工种 / 等级</label><strong>${p.occupation || '—'}${p.skillLevel ? ' · ' + p.skillLevel : ''}</strong></div>
        <div class="item"><label>参考人数</label><strong>${candidates.length} 人</strong></div>
        <div class="item"><label>已通过</label><strong>${passed} 人</strong></div>
      `;
      document.getElementById('pageSub').textContent = `${p.enterprise || ''} · ${p.name || ''} · 步骤 6 / 9`;
    }

    function toggleWorkspace(show) {
      document.getElementById('rendingWorkspace').style.display = show ? 'block' : 'none';
      document.getElementById('workspaceEmpty').style.display = show ? 'none' : 'block';
    }

    function populateProjectSelect() {
      document.getElementById('projectSelect').innerHTML =
        '<option value="">请选择项目…</option>' +
        tasks.map(t => `<option value="${t.id}">${t.enterprise || '—'} · ${t.name}</option>`).join('');
    }

    function populateClassFilter() {
      const classes = [...new Set(candidates.map(c => c.className))];
      document.getElementById('filterClass').innerHTML =
        '<option value="">全部</option>' +
        classes.map(n => `<option value="${n}">${n}</option>`).join('');
    }

    function filteredList() {
      const cls = document.getElementById('filterClass').value;
      const res = document.getElementById('filterResult').value;
      return candidates.filter(s => {
        if (cls && s.className !== cls) return false;
        if (res && s.result !== res) return false;
        return true;
      });
    }

    function updateStats() {
      const total = candidates.length;
      const pending = candidates.filter(s => s.result === '待考').length;
      const passed = candidates.filter(s => s.result === '通过').length;
      const rate = total ? Math.round((passed / total) * 1000) / 10 : 0;
      const certified = candidates.filter(s => s.certStatus === '已发证').length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statPassRate').textContent = rate + '%';
      document.getElementById('statCertified').textContent = certified;
    }

    function flowProgress() {
      if (!candidates.length) return 0;
      const cond = candidates.filter(s => s.conditionOk !== null).length / candidates.length;
      const exam = candidates.filter(s => s.result !== '待考').length / candidates.length;
      const pass = candidates.filter(s => s.result === '通过').length / candidates.length;
      const rsb = candidates.filter(s => s.rsbStatus !== '未提交').length / candidates.length;
      const cert = candidates.filter(s => s.certStatus === '已发证').length / candidates.length;
      if (cert > 0.5) return 5;
      if (rsb > 0.3) return 4;
      if (pass > 0.3) return 3;
      if (exam > 0.5) return 2;
      if (cond > 0.5) return 1;
      return 0;
    }

    function renderFlowSteps() {
      const step = flowProgress();
      const icons = ['fa-clipboard-check', 'fa-file-alt', 'fa-list-alt', 'fa-cloud-upload-alt', 'fa-award'];
      document.getElementById('flowSteps').innerHTML = FLOW_LABELS.map((label, i) => {
        let cls = 'flow-step';
        if (i < step) cls += ' done';
        else if (i === step) cls += ' active';
        return `<div class="${cls}"><i class="fas ${icons[i]}"></i>${label}</div>`;
      }).join('');
    }

    function conditionBadge(ok) {
      if (ok === true) return '<span class="status-badge st-pass">符合</span>';
      if (ok === false) return '<span class="status-badge st-fail">不符合</span>';
      return '<span class="status-badge st-pending">待审核</span>';
    }

    function resultBadge(r) {
      if (r === '通过') return '<span class="status-badge st-pass">通过</span>';
      if (r === '未通过') return '<span class="status-badge st-fail">未通过</span>';
      return '<span class="status-badge st-pending">待考</span>';
    }

    function rsbBadge(s) {
      const map = { '未提交': 'st-pending', '已提交': 'st-rsb', '审批中': 'st-rsb', '已通过': 'st-pass' };
      return `<span class="status-badge ${map[s] || 'st-pending'}">${s}</span>`;
    }

    function certBadge(s) {
      if (s === '已发证') return '<span class="status-badge st-cert">已发证</span>';
      return '<span class="status-badge st-pending">未发证</span>';
    }

    function renderTable() {
      const tbody = document.getElementById('studentBody');
      const list = filteredList();
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--text-secondary)">暂无学员，请先分班</td></tr>';
        updateStats();
        renderFlowSteps();
        return;
      }
      tbody.innerHTML = list.map(s => `
        <tr>
          <td><strong>${s.name}</strong></td>
          <td>${s.className || '—'}</td>
          <td>${s.occupation || '—'}</td>
          <td>${conditionBadge(s.conditionOk)}</td>
          <td>${s.theoryScore != null ? s.theoryScore : '—'}</td>
          <td>${s.practicalScore != null ? s.practicalScore : '—'}</td>
          <td>${resultBadge(s.result)}</td>
          <td>${rsbBadge(s.rsbStatus)}</td>
          <td>${certBadge(s.certStatus)}${s.certNo ? '<br><small>' + s.certNo + '</small>' : ''}</td>
          <td>
            <div class="action-btns">
              <button type="button" class="action-btn edit-exam" data-id="${s.studentId}" title="录入成绩"><i class="fas fa-edit"></i></button>
            </div>
          </td>
        </tr>
      `).join('');
      updateStats();
      renderFlowSteps();
      renderProjectBanner();
    }

    function renderAll() {
      candidates.forEach(s => { s.result = computeResult(s); });
      renderTable();
    }

    function openExamModal(studentId) {
      const s = candidates.find(x => x.studentId === studentId);
      if (!s) return;
      document.getElementById('editStudentId').value = studentId;
      document.getElementById('examStudentName').textContent = s.name + ' · ' + s.className;
      document.getElementById('theoryScore').value = s.theoryScore ?? '';
      document.getElementById('practicalScore').value = s.practicalScore ?? '';
      document.getElementById('conditionOk').value =
        s.conditionOk === true ? 'true' : (s.conditionOk === false ? 'false' : '');
      document.getElementById('examModal').classList.add('show');
    }

    function saveExamModal() {
      const sid = parseInt(document.getElementById('editStudentId').value);
      const s = candidates.find(x => x.studentId === sid);
      if (!s) return;
      const cond = document.getElementById('conditionOk').value;
      s.conditionOk = cond === '' ? null : cond === 'true';
      const th = document.getElementById('theoryScore').value;
      const pr = document.getElementById('practicalScore').value;
      s.theoryScore = th === '' ? null : parseInt(th, 10);
      s.practicalScore = pr === '' ? null : parseInt(pr, 10);
      s.result = computeResult(s);
      document.getElementById('examModal').classList.remove('show');
      saveData();
      renderAll();
    }

    document.getElementById('btnCheckCondition').addEventListener('click', () => {
      if (!candidates.length) { alert('暂无学员'); return; }
      candidates.forEach(s => {
        if (s.conditionOk === null) s.conditionOk = Math.random() > 0.08;
      });
      candidates.forEach(s => { s.result = computeResult(s); });
      saveData();
      renderAll();
      alert('已完成批量认定条件审核（演示：参训学时、考勤等）');
    });

    document.getElementById('btnBatchExam').addEventListener('click', () => {
      const eligible = candidates.filter(s => s.conditionOk !== false);
      if (!eligible.length) { alert('请先完成条件审核'); return; }
      eligible.forEach(s => {
        if (s.result === '待考') {
          s.theoryScore = 55 + Math.floor(Math.random() * 45);
          s.practicalScore = 55 + Math.floor(Math.random() * 45);
          s.result = computeResult(s);
        }
      });
      saveData();
      renderAll();
      alert(`已为 ${eligible.length} 名符合条件学员录入考核成绩（演示）`);
    });

    document.getElementById('btnGenRoster').addEventListener('click', () => {
      const passed = candidates.filter(s => s.result === '通过');
      if (!passed.length) { alert('暂无通过学员，无法生成花名册'); return; }
      saveData();
      alert(`已生成获证花名册：${passed.length} 人（演示，可导出 Excel）`);
    });

    document.getElementById('btnSubmitRsb').addEventListener('click', () => {
      const passed = candidates.filter(s => s.result === '通过' && s.rsbStatus === '未提交');
      if (!passed.length) { alert('暂无待提交人社的通过学员'); return; }
      passed.forEach(s => { s.rsbStatus = '审批中'; });
      saveData();
      renderAll();
      alert(`已向人社系统提交 ${passed.length} 人认定材料（演示）`);
    });

    document.getElementById('btnIssueCert').addEventListener('click', () => {
      const ready = candidates.filter(s => s.result === '通过' && (s.rsbStatus === '审批中' || s.rsbStatus === '已通过'));
      if (!ready.length) { alert('暂无待发证学员'); return; }
      ready.forEach((s, i) => {
        s.rsbStatus = '已通过';
        s.certStatus = '已发证';
        s.certNo = 'GX' + currentProjectId + String(s.studentId).slice(-4) + (1000 + i);
      });
      saveData();
      renderAll();
      alert(`已为 ${ready.length} 名学员登记证书发放（演示）`);
    });

    document.getElementById('filterClass').addEventListener('change', renderTable);
    document.getElementById('filterResult').addEventListener('change', renderTable);
    document.getElementById('examModalCancel').addEventListener('click', () => {
      document.getElementById('examModal').classList.remove('show');
    });
    document.getElementById('examModalSave').addEventListener('click', saveExamModal);
    document.getElementById('studentBody').addEventListener('click', e => {
      const btn = e.target.closest('.edit-exam');
      if (btn) openExamModal(parseInt(btn.dataset.id));
    });

    document.getElementById('btnNextStep').addEventListener('click', () => {
      if (!currentProjectId) { alert('请先选择项目'); return; }
      saveData();
      alert(`项目「${currentProject?.name || ''}」认定信息已保存，进入申报环节`);
      window.location.href = `申报.html?projectId=${currentProjectId}`;
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      populateProjectSelect();
      const params = new URLSearchParams(window.location.search);
      const pid = params.get('projectId');
      if (pid && tasks.some(t => String(t.id) === String(pid))) {
        document.getElementById('projectSelect').value = pid;
        loadProjectData(parseInt(pid, 10));
      } else {
        toggleWorkspace(false);
      }
      document.getElementById('projectSelect').addEventListener('change', e => {
        const v = e.target.value;
        if (!v) {
          if (currentProjectId) saveData();
          currentProjectId = null;
          currentProject = null;
          toggleWorkspace(false);
          document.getElementById('projectBanner').style.display = 'none';
          document.getElementById('pageSub').textContent = '按项目组织认定准备与获证 · 步骤 6 / 9';
          const url = new URL(window.location.href);
          url.searchParams.delete('projectId');
          history.replaceState(null, '', url);
          return;
        }
        if (currentProjectId) saveData();
        const url = new URL(window.location.href);
        url.searchParams.set('projectId', v);
        history.replaceState(null, '', url);
        loadProjectData(parseInt(v, 10));
      });
    });
  </script>
</body>
</html>
