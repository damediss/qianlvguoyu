<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>申报服务 - 智训企业版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #2A6DFF;
      --primary-hover: #1E5AE8;
      --primary-light: #E8F0FF;
      --bg: #F5F7FC;
      --card: #FFFFFF;
      --text: #1A2332;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(42, 109, 255, 0.06);
      --radius-card: 20px;
      --radius-btn: 12px;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: var(--radius-btn); transition: all 0.2s;
    }
    .back-link:hover { background: var(--primary-light); color: var(--primary); }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar .sub { font-size: 13px; color: var(--text-secondary); }
    .process-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 6px 12px;
      background: var(--primary-light); color: var(--primary);
      border-radius: 20px; font-weight: 500;
    }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stat-card .val { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat-card .val.success { color: var(--success); }
    .stat-card .val.warn { color: var(--warning); }
    .stat-card .lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .card-head {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-head .title-wrap { display: flex; align-items: center; gap: 10px; }
    .card-head i { color: var(--primary); }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
    }
    .form-group textarea { min-height: 72px; resize: vertical; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 8px 16px; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .project-banner {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--primary-light);
      border-radius: var(--radius-btn);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px 24px;
      font-size: 13px;
    }
    .project-banner .item label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
    .workspace-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .workspace-empty i { font-size: 40px; color: var(--border); margin-bottom: 16px; display: block; }
    .flow-steps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .flow-step {
      flex: 1; min-width: 120px; text-align: center; padding: 12px 8px;
      border-radius: var(--radius-btn); background: var(--bg);
      font-size: 12px; color: var(--text-secondary);
    }
    .flow-step.done { background: #D1FAE5; color: #059669; font-weight: 600; }
    .flow-step.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .flow-step i { display: block; font-size: 18px; margin-bottom: 6px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th {
      text-align: left; padding: 12px 14px; font-size: 12px; color: var(--text-secondary);
      background: #FAFBFD; border-bottom: 2px solid var(--border);
    }
    .data-table td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
    }
    .st-draft { background: #F1F5F9; color: #64748B; }
    .st-ready { background: #E8F0FF; color: var(--primary); }
    .st-submit { background: #FEF3C7; color: #D97706; }
    .st-pass { background: #D1FAE5; color: #059669; }
    .st-reject { background: #FEE2E2; color: #DC2626; }
    .reject-box {
      margin-top: 16px;
      padding: 14px 18px;
      background: #FEF2F2;
      border-radius: var(--radius-btn);
      font-size: 14px;
      color: #991B1B;
      display: none;
    }
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff; border-radius: 20px; padding: 28px;
      max-width: 480px; width: 100%;
    }
    .modal-box h3 { margin-bottom: 20px; font-size: 18px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="培训管理系统 主页面.html?panel=process" class="back-link">
        <i class="fas fa-arrow-left"></i> 返回培训流程
      </a>
      <div>
        <h1>申报服务</h1>
        <span class="sub" id="pageSub">补贴申报服务 · 步骤 7 / 9</span>
      </div>
    </div>
    <span class="process-badge"><i class="fas fa-file-upload"></i> … → 申报服务 → 培训结业 → …</span>
  </header>

  <main class="page">
    <div class="card">
      <div class="card-head">
        <div class="title-wrap"><i class="fas fa-folder-open"></i> 培训项目</div>
        <a href="任务档案.html" class="btn btn-secondary btn-sm"><i class="fas fa-list"></i> 任务档案</a>
      </div>
      <div class="form-group">
        <label>选择企业培训项目</label>
        <select id="projectSelect"><option value="">请选择项目…</option></select>
      </div>
      <div id="projectBanner" class="project-banner" style="display:none"></div>
    </div>

    <div id="workspaceEmpty" class="workspace-empty">
      <i class="fas fa-hand-pointer"></i>
      <p>请先选择<strong>企业培训项目</strong>，再准备并提交培训/补贴申报材料。</p>
      <p style="margin-top:8px;font-size:13px">建议先完成 <a href="认定.html">认定</a> 获证花名册；也可从任务档案进入。</p>
    </div>

    <div id="shenbaoWorkspace" style="display:none">
      <div class="stat-row">
        <div class="stat-card">
          <div class="val" id="statMaterials">0/0</div>
          <div class="lbl">材料齐备</div>
        </div>
        <div class="stat-card">
          <div class="val warn" id="statSubmit">草稿</div>
          <div class="lbl">申报状态</div>
        </div>
        <div class="stat-card">
          <div class="val success" id="statCert">0</div>
          <div class="lbl">获证人数</div>
        </div>
        <div class="stat-card">
          <div class="val" id="statRefund">—</div>
          <div class="lbl">拨款状态</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="title-wrap"><i class="fas fa-route"></i> 申报流程</div>
          <span style="font-size:12px;color:var(--text-secondary)">政策模板 → 生成材料包 → 提交人社 → 拨款跟踪</span>
        </div>
        <div class="flow-steps" id="flowSteps"></div>
        <div class="form-grid" style="margin-bottom:20px">
          <div class="form-group">
            <label>补贴政策模板</label>
            <select id="policyTemplate">
              <option value="企业职工岗位技能培训补贴">企业职工岗位技能培训补贴</option>
              <option value="职业技能提升行动补贴">职业技能提升行动补贴</option>
              <option value="鉴定考核补贴">鉴定考核补贴</option>
            </select>
          </div>
          <div class="form-group">
            <label>预计补贴金额（元）</label>
            <input type="number" id="subsidyAmount" min="0" placeholder="根据政策测算">
          </div>
        </div>
        <div class="toolbar">
          <button type="button" class="btn btn-primary btn-sm" id="btnGenPackage">
            <i class="fas fa-file-archive"></i> 生成申报材料包
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnVerify">
            <i class="fas fa-check-double"></i> 材料核验清单
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnSubmitRsb">
            <i class="fas fa-cloud-upload-alt"></i> 提交人社系统
          </button>
          <button type="button" class="btn btn-success btn-sm" id="btnTrackRefund">
            <i class="fas fa-money-bill-wave"></i> 拨款进度登记
          </button>
        </div>
        <div id="rejectBox" class="reject-box"></div>
        <div class="table-wrap" style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>材料名称</th>
                <th>所属环节</th>
                <th>状态</th>
                <th>提交日期</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="materialBody"></tbody>
          </table>
        </div>
      </div>

      <div style="display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap">
        <a href="认定.html" class="btn btn-secondary" id="linkBackRending"><i class="fas fa-certificate"></i> 返回认定</a>
        <a href="培训管理系统 主页面.html?panel=process" class="btn btn-secondary">保存并返回流程</a>
        <button type="button" class="btn btn-success" id="btnNextStep">
          <i class="fas fa-arrow-right"></i> 完成申报服务，进入培训结业
        </button>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="rejectModal">
    <div class="modal-box">
      <h3>退回原因</h3>
      <div class="form-group">
        <textarea id="rejectReasonInput" placeholder="填写人社退回原因及需补充材料"></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
        <button type="button" class="btn btn-secondary" id="rejectModalCancel">取消</button>
        <button type="button" class="btn btn-primary" id="rejectModalSave">保存并标记退回</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_TASKS = 'zhixun_tasks';
    const STORAGE_RENDING = 'zhixun_rending_by_project';
    const STORAGE_SHENBAO = 'zhixun_shenbao_by_project';

    const FLOW_LABELS = ['政策模板', '材料包', '人社提交', '拨款跟踪'];
    const DEFAULT_MATERIALS = [
      { key: 'plan', name: '培训计划备案表', stage: '项目立项', status: '草稿', submitDate: '', ready: false },
      { key: 'roster', name: '学员名册及考勤', stage: '培训执行', status: '草稿', submitDate: '', ready: false },
      { key: 'cert', name: '获证花名册', stage: '认定', status: '草稿', submitDate: '', ready: false },
      { key: 'subsidy', name: '补贴申报材料包', stage: '补贴申报', status: '草稿', submitDate: '', ready: false },
      { key: 'contract', name: '培训协议及承诺书', stage: '协议签订', status: '草稿', submitDate: '', ready: false },
      { key: 'evidence', name: '过程留痕证据链目录', stage: '培训执行', status: '草稿', submitDate: '', ready: false },
      { key: 'graduate', name: '结业证明申请', stage: '结业', status: '草稿', submitDate: '', ready: false }
    ];

    let tasks = [];
    let currentProjectId = null;
    let currentProject = null;
    let bundle = null;
    let certifiedCount = 0;

    function loadTasks() {
      try { tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS) || '[]'); }
      catch (e) { tasks = []; }
    }

    function getStore(key) {
      try { return JSON.parse(localStorage.getItem(key) || '{}'); }
      catch (e) { return {}; }
    }

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function getCertifiedCount(projectId) {
      const rending = getStore(STORAGE_RENDING)[String(projectId)];
      if (!rending?.candidates) return 0;
      return rending.candidates.filter(s => s.result === '通过' || s.certStatus === '已发证').length;
    }

    function initBundle(projectId, saved) {
      certifiedCount = getCertifiedCount(projectId);
      if (saved) {
        return {
          ...saved,
          materials: (saved.materials || []).map(m => ({ ...m }))
        };
      }
      const materials = DEFAULT_MATERIALS.map(m => ({ ...m }));
      if (certifiedCount > 0) {
        const cert = materials.find(m => m.key === 'cert');
        if (cert) { cert.ready = true; cert.status = '已齐'; }
      }
      return {
        projectId,
        policyTemplate: '企业职工岗位技能培训补贴',
        subsidyAmount: (certifiedCount || 40) * 1200,
        materials,
        submitStatus: '草稿',
        submitDate: '',
        refundStatus: '未拨款',
        rejectReason: ''
      };
    }

    function loadProjectData(projectId) {
      const project = tasks.find(t => t.id === projectId);
      if (!project) return;
      currentProjectId = projectId;
      currentProject = project;

      const all = getStore(STORAGE_SHENBAO);
      bundle = initBundle(projectId, all[String(projectId)]);
      all[String(projectId)] = bundle;
      localStorage.setItem(STORAGE_SHENBAO, JSON.stringify(all));

      document.getElementById('linkBackRending').href = `认定.html?projectId=${projectId}`;
      document.getElementById('policyTemplate').value = bundle.policyTemplate || '企业职工岗位技能培训补贴';
      document.getElementById('subsidyAmount').value = bundle.subsidyAmount || '';

      renderProjectBanner();
      toggleWorkspace(true);
      renderAll();
    }

    function saveData() {
      if (!currentProjectId || !bundle) return;
      bundle.policyTemplate = document.getElementById('policyTemplate').value;
      bundle.subsidyAmount = +document.getElementById('subsidyAmount').value || 0;
      const all = getStore(STORAGE_SHENBAO);
      all[String(currentProjectId)] = bundle;
      localStorage.setItem(STORAGE_SHENBAO, JSON.stringify(all));
    }

    function renderProjectBanner() {
      const p = currentProject;
      document.getElementById('projectBanner').style.display = 'grid';
      document.getElementById('projectBanner').innerHTML = `
        <div class="item"><label>企业</label><strong>${p.enterprise || '—'}</strong></div>
        <div class="item"><label>培训项目</label><strong>${p.name || '—'}</strong></div>
        <div class="item"><label>政策模板</label><strong>${bundle.policyTemplate || '—'}</strong></div>
        <div class="item"><label>获证人数</label><strong>${certifiedCount} 人</strong></div>
        <div class="item"><label>申报状态</label><strong>${bundle.submitStatus}</strong></div>
      `;
      document.getElementById('pageSub').textContent = `${p.enterprise || ''} · ${p.name || ''} · 步骤 7 / 9`;
    }

    function toggleWorkspace(show) {
      document.getElementById('shenbaoWorkspace').style.display = show ? 'block' : 'none';
      document.getElementById('workspaceEmpty').style.display = show ? 'none' : 'block';
    }

    function populateProjectSelect() {
      document.getElementById('projectSelect').innerHTML =
        '<option value="">请选择项目…</option>' +
        tasks.map(t => `<option value="${t.id}">${t.enterprise || '—'} · ${t.name}</option>`).join('');
    }

    function statusClass(st) {
      if (st === '已提交' || st === '已通过') return 'st-pass';
      if (st === '审核中' || st === '已齐') return 'st-submit';
      if (st === '待补充' || st === '已退回') return 'st-reject';
      if (st === '草稿') return 'st-draft';
      return 'st-ready';
    }

    function flowStep() {
      if (bundle.submitStatus === '已通过' || bundle.refundStatus === '已拨款') return 4;
      if (bundle.submitStatus === '审核中' || bundle.submitStatus === '已提交') return 3;
      const ready = bundle.materials.filter(m => m.ready).length;
      if (ready === bundle.materials.length) return 2;
      if (bundle.policyTemplate) return 1;
      return 0;
    }

    function renderFlowSteps() {
      const step = flowStep();
      const icons = ['fa-file-contract', 'fa-folder-open', 'fa-cloud-upload-alt', 'fa-money-bill-wave'];
      document.getElementById('flowSteps').innerHTML = FLOW_LABELS.map((label, i) => {
        let cls = 'flow-step';
        if (i < step) cls += ' done';
        else if (i === step) cls += ' active';
        return `<div class="${cls}"><i class="fas ${icons[i]}"></i>${label}</div>`;
      }).join('');
    }

    function updateStats() {
      const ready = bundle.materials.filter(m => m.ready).length;
      const total = bundle.materials.length;
      document.getElementById('statMaterials').textContent = ready + '/' + total;
      document.getElementById('statSubmit').textContent = bundle.submitStatus;
      document.getElementById('statSubmit').className = 'val' + (bundle.submitStatus === '草稿' ? ' warn' : ' success');
      document.getElementById('statCert').textContent = certifiedCount;
      document.getElementById('statRefund').textContent = bundle.refundStatus;

      const box = document.getElementById('rejectBox');
      if (bundle.submitStatus === '已退回' && bundle.rejectReason) {
        box.style.display = 'block';
        box.innerHTML = '<strong><i class="fas fa-exclamation-circle"></i> 退回原因：</strong>' + bundle.rejectReason;
      } else {
        box.style.display = 'none';
      }
    }

    function renderMaterials() {
      const tbody = document.getElementById('materialBody');
      tbody.innerHTML = bundle.materials.map(m => `
        <tr>
          <td><strong>${m.name}</strong></td>
          <td>${m.stage}</td>
          <td><span class="status-badge ${statusClass(m.status)}">${m.status}</span></td>
          <td>${m.submitDate || '—'}</td>
          <td>
            <button type="button" class="btn btn-secondary btn-sm toggle-ready" data-key="${m.key}">
              ${m.ready ? '标记草稿' : '标记已齐'}
            </button>
          </td>
        </tr>
      `).join('');
      updateStats();
      renderFlowSteps();
      renderProjectBanner();
    }

    function renderAll() {
      renderMaterials();
    }

    document.getElementById('btnGenPackage').addEventListener('click', () => {
      bundle.materials.forEach(m => {
        m.ready = true;
        m.status = m.status === '草稿' ? '已齐' : m.status;
      });
      if (certifiedCount > 0) {
        const cert = bundle.materials.find(m => m.key === 'cert');
        if (cert) { cert.status = '已齐'; cert.ready = true; }
      }
      saveData();
      renderAll();
      alert('已根据政策模板生成本项目申报材料包（演示）');
    });

    document.getElementById('btnVerify').addEventListener('click', () => {
      const notReady = bundle.materials.filter(m => !m.ready);
      if (notReady.length) {
        alert(`尚有 ${notReady.length} 项材料未齐备：\n` + notReady.map(m => '· ' + m.name).join('\n'));
        return;
      }
      alert('补贴申报材料核验清单已全部通过（演示）');
    });

    document.getElementById('btnSubmitRsb').addEventListener('click', () => {
      const notReady = bundle.materials.filter(m => !m.ready);
      if (notReady.length) {
        alert('请先齐备全部材料后再提交');
        return;
      }
      bundle.submitStatus = '审核中';
      bundle.submitDate = todayStr();
      bundle.materials.forEach(m => {
        if (m.ready) {
          m.status = '已提交';
          m.submitDate = bundle.submitDate;
        }
      });
      saveData();
      renderAll();
      alert('培训及补贴材料已提交人社系统（演示），进入审核中');
    });

    document.getElementById('btnTrackRefund').addEventListener('click', () => {
      if (bundle.submitStatus !== '审核中' && bundle.submitStatus !== '已通过') {
        alert('请先完成人社材料提交');
        return;
      }
      if (bundle.submitStatus === '审核中') {
        if (confirm('模拟审批通过并进入拨款？')) {
          bundle.submitStatus = '已通过';
          bundle.refundStatus = '拨款中';
        }
      } else if (bundle.refundStatus === '拨款中') {
        bundle.refundStatus = '已拨款';
        alert('拨款已到账（演示）');
      } else {
        alert('当前拨款状态：' + bundle.refundStatus);
        return;
      }
      saveData();
      renderAll();
    });

    document.getElementById('materialBody').addEventListener('click', e => {
      const btn = e.target.closest('.toggle-ready');
      if (!btn) return;
      const m = bundle.materials.find(x => x.key === btn.dataset.key);
      if (!m) return;
      m.ready = !m.ready;
      m.status = m.ready ? '已齐' : '草稿';
      saveData();
      renderAll();
    });

    document.getElementById('policyTemplate').addEventListener('change', saveData);
    document.getElementById('subsidyAmount').addEventListener('change', saveData);

    document.getElementById('btnNextStep').addEventListener('click', () => {
      if (!currentProjectId) { alert('请先选择项目'); return; }
      saveData();
      alert(`项目「${currentProject?.name || ''}」申报材料已保存`);
      window.location.href = '结业.html?projectId=' + currentProjectId;
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      populateProjectSelect();
      const params = new URLSearchParams(window.location.search);
      const pid = params.get('projectId');
      if (pid && tasks.some(t => String(t.id) === String(pid))) {
        document.getElementById('projectSelect').value = pid;
        loadProjectData(parseInt(pid, 10));
      } else {
        toggleWorkspace(false);
      }
      document.getElementById('projectSelect').addEventListener('change', e => {
        const v = e.target.value;
        if (!v) {
          if (currentProjectId) saveData();
          currentProjectId = null;
          currentProject = null;
          bundle = null;
          toggleWorkspace(false);
          document.getElementById('projectBanner').style.display = 'none';
          document.getElementById('pageSub').textContent = '补贴申报服务 · 步骤 7 / 9';
          const url = new URL(window.location.href);
          url.searchParams.delete('projectId');
          history.replaceState(null, '', url);
          return;
        }
        if (currentProjectId) saveData();
        const url = new URL(window.location.href);
        url.searchParams.set('projectId', v);
        history.replaceState(null, '', url);
        loadProjectData(parseInt(v, 10));
      });
    });
  </script>
</body>
</html>
