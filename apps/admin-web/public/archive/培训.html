<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>培训实施 - 智训企业版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #2A6DFF;
      --primary-hover: #1E5AE8;
      --primary-light: #E8F0FF;
      --bg: #F5F7FC;
      --card: #FFFFFF;
      --text: #1A2332;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(42, 109, 255, 0.06);
      --radius-card: 20px;
      --radius-btn: 12px;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar {
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: var(--radius-btn); transition: all 0.2s;
    }
    .back-link:hover { background: var(--primary-light); color: var(--primary); }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar .sub { font-size: 13px; color: var(--text-secondary); }
    .process-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 6px 12px;
      background: var(--primary-light); color: var(--primary);
      border-radius: 20px; font-weight: 500;
    }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stat-card .val { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat-card .val.success { color: var(--success); }
    .stat-card .val.warn { color: var(--warning); }
    .stat-card .lbl { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .card-head {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-head .title-wrap { display: flex; align-items: center; gap: 10px; }
    .card-head i { color: var(--primary); }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 8px 16px; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: flex-end; }
    .project-banner {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--primary-light);
      border-radius: var(--radius-btn);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px 24px;
      font-size: 13px;
    }
    .project-banner .item label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
    .workspace-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .workspace-empty i { font-size: 40px; color: var(--border); margin-bottom: 16px; display: block; }
    .alert-banner {
      padding: 14px 18px;
      border-radius: var(--radius-btn);
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .alert-banner.warn { background: #FEF3C7; color: #92400E; }
    .alert-banner a { font-weight: 600; color: inherit; }
    .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn {
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      background: var(--card);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th {
      text-align: left; padding: 12px 14px; font-size: 12px; color: var(--text-secondary);
      background: #FAFBFD; border-bottom: 2px solid var(--border);
    }
    .data-table td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .progress-bar {
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      min-width: 80px;
    }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 4px; }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
    }
    .st-normal { background: #D1FAE5; color: #059669; }
    .st-warn { background: #FEF3C7; color: #D97706; }
    .st-danger { background: #FEE2E2; color: #DC2626; }
    .action-btns { display: flex; gap: 6px; }
    .action-btn {
      width: 32px; height: 32px; border: none; border-radius: 8px;
      background: var(--bg); color: var(--text-secondary); cursor: pointer;
    }
    .action-btn:hover { background: var(--primary-light); color: var(--primary); }
    .panel { display: none; }
    .panel.active { display: block; }
    .log-item, .exc-item {
      padding: 14px 16px;
      background: var(--bg);
      border-radius: var(--radius-btn);
      margin-bottom: 10px;
      font-size: 14px;
    }
    .log-item .meta, .exc-item .meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .evidence-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .evidence-thumb {
      aspect-ratio: 4/3;
      background: var(--bg);
      border-radius: var(--radius-btn);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      border: 1px dashed var(--border);
    }
    .evidence-thumb i { font-size: 28px; color: var(--primary); }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h3 { margin-bottom: 20px; font-size: 18px; }
    .att-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; flex-wrap: wrap; }
    .att-row:last-child { border-bottom: none; }
    .filter-inline { min-width: 180px; margin: 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="培训管理系统 主页面.html?panel=process" class="back-link">
        <i class="fas fa-arrow-left"></i> 返回培训流程
      </a>
      <div>
        <h1>培训实施</h1>
        <span class="sub" id="pageSub">按项目跟踪培训过程 · 步骤 5 / 9</span>
      </div>
    </div>
    <span class="process-badge"><i class="fas fa-chalkboard-teacher"></i> … → 培训实施 → 认定准备 → …</span>
  </header>

  <main class="page">
    <div class="card">
      <div class="card-head">
        <div class="title-wrap"><i class="fas fa-folder-open"></i> 培训项目</div>
        <a href="任务档案.html" class="btn btn-secondary btn-sm"><i class="fas fa-list"></i> 任务档案</a>
      </div>
      <div class="form-group">
        <label>选择企业培训项目（培训针对已开班班级）</label>
        <select id="projectSelect">
          <option value="">请选择项目…</option>
        </select>
      </div>
      <div id="projectBanner" class="project-banner" style="display:none"></div>
    </div>

    <div id="workspaceEmpty" class="workspace-empty">
      <i class="fas fa-hand-pointer"></i>
      <p>请先选择<strong>企业培训项目</strong>，再管理各班级培训实施与考勤。</p>
      <p style="margin-top:8px;font-size:13px">需先完成 <a href="开班.html">开班</a>；也可从<a href="任务档案.html">任务档案</a>进入。</p>
    </div>

    <div id="peixunWorkspace" style="display:none">
      <div id="noClassAlert" class="alert-banner warn" style="display:none">
        <i class="fas fa-exclamation-triangle"></i>
        <div>本项目尚无在培班级，请先 <a href="#" id="linkKaiban">开班</a>。</div>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <div class="val" id="statClasses">0</div>
          <div class="lbl">在培班级</div>
        </div>
        <div class="stat-card">
          <div class="val success" id="statAttendance">0%</div>
          <div class="lbl">平均签到率</div>
        </div>
        <div class="stat-card">
          <div class="val" id="statProgress">0%</div>
          <div class="lbl">课程进度</div>
        </div>
        <div class="stat-card">
          <div class="val warn" id="statExceptions">0</div>
          <div class="lbl">待处理异常</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="title-wrap"><i class="fas fa-tasks"></i> 培训过程</div>
          <span style="font-size:12px;color:var(--text-secondary)">考勤管理 · 过程留痕 · 跟班日志 · 异常处理</span>
        </div>
        <div class="toolbar" style="margin-bottom:0">
          <div class="form-group filter-inline">
            <label>筛选班级</label>
            <select id="filterClass">
              <option value="">全部班级</option>
            </select>
          </div>
        </div>
        <div class="tab-bar">
          <button type="button" class="tab-btn active" data-tab="overview">班级概览</button>
          <button type="button" class="tab-btn" data-tab="attendance">课次考勤</button>
          <button type="button" class="tab-btn" data-tab="evidence">过程留痕</button>
          <button type="button" class="tab-btn" data-tab="logs">跟班日志</button>
          <button type="button" class="tab-btn" data-tab="exceptions">异常处理</button>
        </div>

        <div id="panel-overview" class="panel active">
          <div class="table-wrap" style="overflow-x:auto">
            <table class="data-table">
              <thead>
                <tr>
                  <th>班级</th>
                  <th>学员</th>
                  <th>课程进度</th>
                  <th>签到率</th>
                  <th>留痕</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="classBody"></tbody>
            </table>
          </div>
        </div>

        <div id="panel-attendance" class="panel">
          <div class="toolbar">
            <button type="button" class="btn btn-primary btn-sm" id="btnBatchCheckIn">
              <i class="fas fa-check-double"></i> 今日课次批量签到
            </button>
          </div>
          <div id="attendanceList"></div>
        </div>

        <div id="panel-evidence" class="panel">
          <div class="toolbar">
            <button type="button" class="btn btn-secondary btn-sm" id="btnUploadPhoto">
              <i class="fas fa-image"></i> 上传课堂照片
            </button>
            <button type="button" class="btn btn-secondary btn-sm" id="btnUploadVideo">
              <i class="fas fa-video"></i> 上传课堂视频
            </button>
          </div>
          <div id="evidenceList"></div>
        </div>

        <div id="panel-logs" class="panel">
          <div class="toolbar">
            <button type="button" class="btn btn-primary btn-sm" id="btnAddLog">
              <i class="fas fa-pen"></i> 新增跟班日志
            </button>
          </div>
          <div id="logsList"></div>
        </div>

        <div id="panel-exceptions" class="panel">
          <div class="toolbar">
            <button type="button" class="btn btn-primary btn-sm" id="btnAddException">
              <i class="fas fa-exclamation"></i> 登记异常
            </button>
          </div>
          <div id="exceptionsList"></div>
        </div>
      </div>

      <div style="display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap">
        <a href="开班.html" class="btn btn-secondary" id="linkBackKaiban"><i class="fas fa-door-open"></i> 返回开班</a>
        <a href="培训管理系统 主页面.html?panel=process" class="btn btn-secondary">保存并返回流程</a>
        <button type="button" class="btn btn-success" id="btnNextStep">
          <i class="fas fa-save"></i> 保存培训进度
        </button>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="classModal">
    <div class="modal-box">
      <h3 id="classModalTitle">班级培训详情</h3>
      <input type="hidden" id="modalClassId">
      <div id="modalClassContent"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
        <button type="button" class="btn btn-secondary" id="classModalClose">关闭</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="logModal">
    <div class="modal-box">
      <h3>新增跟班日志</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>班级</label>
          <select id="logClassId"></select>
        </div>
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="logDate">
        </div>
        <div class="form-group full">
          <label>日志内容</label>
          <textarea id="logContent" placeholder="考勤情况、课堂表现、异常学员沟通等"></textarea>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
        <button type="button" class="btn btn-secondary" id="logModalCancel">取消</button>
        <button type="button" class="btn btn-primary" id="logModalSave">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="excModal">
    <div class="modal-box">
      <h3>登记培训异常</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>班级</label>
          <select id="excClassId"></select>
        </div>
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="excDate">
        </div>
        <div class="form-group">
          <label>学员姓名</label>
          <input type="text" id="excStudent" placeholder="可选">
        </div>
        <div class="form-group">
          <label>异常类型</label>
          <select id="excType">
            <option value="缺勤">缺勤</option>
            <option value="迟到">迟到</option>
            <option value="违纪">课堂违纪</option>
            <option value="伤病">伤病请假</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-group full">
          <label>说明</label>
          <textarea id="excDesc"></textarea>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
        <button type="button" class="btn btn-secondary" id="excModalCancel">取消</button>
        <button type="button" class="btn btn-primary" id="excModalSave">保存</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_TASKS = 'zhixun_tasks';
    const STORAGE_FENBAN = 'zhixun_fenban_by_project';
    const STORAGE_PAIKE = 'zhixun_paike_by_project';
    const STORAGE_KAIBAN = 'zhixun_kaiban_by_project';
    const STORAGE_PEIXUN = 'zhixun_peixun_by_project';

    let tasks = [];
    let currentProjectId = null;
    let currentProject = null;
    let classRecords = [];
    let globalLogs = [];
    let globalExceptions = [];
    let logIdCounter = 1;
    let excIdCounter = 1;

    function loadTasks() {
      try { tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS) || '[]'); }
      catch (e) { tasks = []; }
    }

    function getStore(key) {
      try { return JSON.parse(localStorage.getItem(key) || '{}'); }
      catch (e) { return {}; }
    }

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function buildSessionsFromPaike(classId, paike, studentCount) {
      const courses = (paike?.courses || []).filter(c => c.classId === classId);
      return courses.map((c, i) => ({
        id: classId * 1000 + i + 1,
        date: c.date,
        courseName: c.courseName || c.name || '课程',
        timeRange: `${c.startTime || '09:00'}-${c.endTime || '12:00'}`,
        expected: studentCount,
        present: Math.max(0, studentCount - Math.floor(Math.random() * 2)),
        photos: 0,
        videos: 0,
        checked: false
      }));
    }

    function calcAttendanceRate(sessions) {
      if (!sessions.length) return 0;
      let totalExp = 0, totalPres = 0;
      sessions.forEach(s => {
        totalExp += s.expected || 0;
        totalPres += s.present ?? s.expected;
      });
      return totalExp ? Math.round((totalPres / totalExp) * 1000) / 10 : 0;
    }

    function calcProgress(sessions) {
      if (!sessions.length) return 0;
      const done = sessions.filter(s => s.checked || (s.present >= (s.expected || 0) * 0.8)).length;
      return Math.round((done / sessions.length) * 100);
    }

    function buildClassRecords(projectId, saved) {
      const fenban = getStore(STORAGE_FENBAN)[String(projectId)];
      const kaiban = getStore(STORAGE_KAIBAN)[String(projectId)];
      const paike = getStore(STORAGE_PAIKE)[String(projectId)];
      const classes = fenban?.classes || [];
      const kaibanMap = {};
      (kaiban?.records || []).forEach(r => { kaibanMap[r.classId] = r; });

      const opened = classes.filter(cls => {
        const k = kaibanMap[cls.id];
        return k && (k.status === '正式开班' || k.status === '已批准');
      });
      const source = opened.length ? opened : classes;

      const savedMap = {};
      (saved || []).forEach(r => { savedMap[r.classId] = r; });

      return source.map(cls => {
        const cnt = cls.studentIds?.length || 0;
        const existing = savedMap[cls.id];
        if (existing) {
          return {
            ...existing,
            className: cls.name,
            studentCount: cnt,
            attendanceRate: calcAttendanceRate(existing.sessions || []),
            progress: existing.progress ?? calcProgress(existing.sessions || [])
          };
        }
        const sessions = buildSessionsFromPaike(cls.id, paike, cnt || 40);
        sessions.forEach(s => { if (s.date && s.date <= todayStr()) s.checked = true; });
        return {
          classId: cls.id,
          className: cls.name,
          studentCount: cnt,
          progress: calcProgress(sessions),
          attendanceRate: calcAttendanceRate(sessions),
          status: '正常',
          sessions,
          evidenceCount: { photos: 0, videos: 0 }
        };
      });
    }

    function loadProjectData(projectId) {
      const project = tasks.find(t => t.id === projectId);
      if (!project) return;
      currentProjectId = projectId;
      currentProject = project;

      const all = getStore(STORAGE_PEIXUN);
      const bundle = all[String(projectId)] || {};
      classRecords = buildClassRecords(projectId, bundle.classes);
      globalLogs = bundle.logs || [];
      globalExceptions = bundle.exceptions || [];
      logIdCounter = globalLogs.length ? Math.max(...globalLogs.map(l => l.id)) + 1 : 1;
      excIdCounter = globalExceptions.length ? Math.max(...globalExceptions.map(e => e.id)) + 1 : 1;

      if (!all[String(projectId)]) {
        saveData();
      }

      document.getElementById('linkKaiban').href = `开班.html?projectId=${projectId}`;
      document.getElementById('linkBackKaiban').href = `开班.html?projectId=${projectId}`;

      renderProjectBanner();
      populateClassFilter();
      toggleWorkspace(true);
      document.getElementById('noClassAlert').style.display = classRecords.length ? 'none' : 'flex';
      renderAll();
    }

    function saveData() {
      if (!currentProjectId) return;
      const all = getStore(STORAGE_PEIXUN);
      all[String(currentProjectId)] = {
        projectId: currentProjectId,
        classes: classRecords,
        logs: globalLogs,
        exceptions: globalExceptions
      };
      localStorage.setItem(STORAGE_PEIXUN, JSON.stringify(all));
    }

    function renderProjectBanner() {
      const p = currentProject;
      const banner = document.getElementById('projectBanner');
      banner.style.display = 'grid';
      banner.innerHTML = `
        <div class="item"><label>企业</label><strong>${p.enterprise || '—'}</strong></div>
        <div class="item"><label>培训项目</label><strong>${p.name || '—'}</strong></div>
        <div class="item"><label>在培班级</label><strong>${classRecords.length} 个</strong></div>
        <div class="item"><label>工种</label><strong>${p.occupation || '—'}</strong></div>
        <div class="item"><label>负责人</label><strong>${p.owner || '—'}</strong></div>
      `;
      document.getElementById('pageSub').textContent = `${p.enterprise || ''} · ${p.name || ''} · 步骤 5 / 9`;
    }

    function toggleWorkspace(show) {
      document.getElementById('peixunWorkspace').style.display = show ? 'block' : 'none';
      document.getElementById('workspaceEmpty').style.display = show ? 'none' : 'block';
    }

    function populateProjectSelect() {
      document.getElementById('projectSelect').innerHTML =
        '<option value="">请选择项目…</option>' +
        tasks.map(t => `<option value="${t.id}">${t.enterprise || '—'} · ${t.name}</option>`).join('');
    }

    function populateClassFilter() {
      const opts = classRecords.map(r =>
        `<option value="${r.classId}">${r.className}</option>`
      ).join('');
      ['filterClass', 'logClassId', 'excClassId'].forEach(id => {
        const el = document.getElementById(id);
        if (id === 'filterClass') {
          el.innerHTML = '<option value="">全部班级</option>' + opts;
        } else {
          el.innerHTML = opts || '<option value="">无班级</option>';
        }
      });
    }

    function filteredClasses() {
      const v = document.getElementById('filterClass').value;
      if (!v) return classRecords;
      return classRecords.filter(r => String(r.classId) === v);
    }

    function updateStats() {
      const list = classRecords;
      const att = list.length
        ? Math.round(list.reduce((s, r) => s + (r.attendanceRate || 0), 0) / list.length * 10) / 10
        : 0;
      const prog = list.length
        ? Math.round(list.reduce((s, r) => s + (r.progress || 0), 0) / list.length)
        : 0;
      const pendingExc = globalExceptions.filter(e => !e.resolved).length;
      document.getElementById('statClasses').textContent = list.length;
      document.getElementById('statAttendance').textContent = att + '%';
      document.getElementById('statProgress').textContent = prog + '%';
      document.getElementById('statExceptions').textContent = pendingExc;
    }

    function statusClass(st) {
      if (st === '异常') return 'st-danger';
      if (st === '关注') return 'st-warn';
      return 'st-normal';
    }

    function renderClassTable() {
      const tbody = document.getElementById('classBody');
      const list = filteredClasses();
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-secondary)">暂无在培班级</td></tr>';
        updateStats();
        return;
      }
      tbody.innerHTML = list.map(r => {
        const ev = r.evidenceCount || { photos: 0, videos: 0 };
        const evText = `${ev.photos}图 ${ev.videos}视频`;
        return `
          <tr>
            <td><strong>${r.className}</strong></td>
            <td>${r.studentCount} 人</td>
            <td>
              <div style="display:flex;align-items:center;gap:8px">
                <div class="progress-bar"><div class="progress-fill" style="width:${r.progress || 0}%"></div></div>
                <span style="font-size:13px;font-weight:600">${r.progress || 0}%</span>
              </div>
            </td>
            <td>${r.attendanceRate || 0}%</td>
            <td>${evText}</td>
            <td><span class="status-badge ${statusClass(r.status)}">${r.status || '正常'}</span></td>
            <td>
              <div class="action-btns">
                <button type="button" class="action-btn view-class" data-id="${r.classId}" title="详情"><i class="fas fa-eye"></i></button>
                <button type="button" class="action-btn checkin-class" data-id="${r.classId}" title="签到"><i class="fas fa-user-check"></i></button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
      updateStats();
    }

    function renderAttendance() {
      const el = document.getElementById('attendanceList');
      const list = filteredClasses();
      if (!list.length) {
        el.innerHTML = '<p style="color:var(--text-secondary)">暂无课次</p>';
        return;
      }
      el.innerHTML = list.map(r => {
        const sessions = (r.sessions || []).slice().sort((a, b) => (a.date + a.timeRange).localeCompare(b.date + b.timeRange));
        return `
          <div class="card" style="padding:16px 20px;margin-bottom:12px;box-shadow:none;border:1px solid var(--border)">
            <strong>${r.className}</strong>
            ${sessions.map(s => `
              <div class="att-row">
                <span style="min-width:100px">${s.date}</span>
                <span style="flex:1">${s.courseName} · ${s.timeRange}</span>
                <span>应到 ${s.expected} / 实到 <input type="number" min="0" max="${s.expected}" value="${s.present}" style="width:56px;padding:4px" data-class="${r.classId}" data-sid="${s.id}" class="present-input"></span>
                <label><input type="checkbox" data-class="${r.classId}" data-sid="${s.id}" class="session-check" ${s.checked ? 'checked' : ''}> 已签到</label>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    function renderEvidence() {
      const el = document.getElementById('evidenceList');
      const list = filteredClasses();
      const totalP = list.reduce((s, r) => s + (r.evidenceCount?.photos || 0), 0);
      const totalV = list.reduce((s, r) => s + (r.evidenceCount?.videos || 0), 0);
      const thumbs = [];
      list.forEach(r => {
        const n = (r.evidenceCount?.photos || 0) + (r.evidenceCount?.videos || 0);
        for (let i = 0; i < Math.min(n, 3); i++) {
          const isVideo = i >= (r.evidenceCount?.photos || 0);
          thumbs.push(`
            <div class="evidence-thumb">
              <i class="fas ${isVideo ? 'fa-video' : 'fa-image'}"></i>
              <span>${r.className}</span>
            </div>
          `);
        }
      });
      if (!totalP && !totalV) {
        el.innerHTML = '<p style="color:var(--text-secondary)">暂无留痕，请上传课堂照片或视频（对应需求：签到表、图片、视频上传）</p>';
        return;
      }
      el.innerHTML = `
        <p style="margin-bottom:12px;font-size:14px">累计：${totalP} 张照片，${totalV} 个视频（演示）</p>
        <div class="evidence-grid">${thumbs.join('') || '<p>暂无预览</p>'}</div>
      `;
    }

    function renderLogs() {
      const el = document.getElementById('logsList');
      const classId = document.getElementById('filterClass').value;
      let logs = [...globalLogs].sort((a, b) => b.date.localeCompare(a.date));
      if (classId) logs = logs.filter(l => String(l.classId) === classId);
      el.innerHTML = logs.length
        ? logs.map(l => `
          <div class="log-item">
            <div class="meta">${l.date} · ${l.className} · ${l.author || '班主任'}</div>
            ${l.content}
          </div>
        `).join('')
        : '<p style="color:var(--text-secondary)">暂无跟班日志</p>';
    }

    function renderExceptions() {
      const el = document.getElementById('exceptionsList');
      const classId = document.getElementById('filterClass').value;
      let list = [...globalExceptions].sort((a, b) => b.date.localeCompare(a.date));
      if (classId) list = list.filter(e => String(e.classId) === classId);
      el.innerHTML = list.length
        ? list.map(e => `
          <div class="exc-item">
            <div class="meta">${e.date} · ${e.className} · ${e.type} ${e.student ? '· ' + e.student : ''}
              ${e.resolved ? '<span class="status-badge st-normal">已处理</span>' : '<span class="status-badge st-warn">待处理</span>'}
            </div>
            ${e.desc || '—'}
            ${!e.resolved ? `<button type="button" class="btn btn-secondary btn-sm resolve-exc" data-id="${e.id}" style="margin-top:8px">标记已处理</button>` : ''}
          </div>
        `).join('')
        : '<p style="color:var(--text-secondary)">暂无异常记录</p>';
    }

    function refreshClassMetrics(r) {
      r.attendanceRate = calcAttendanceRate(r.sessions || []);
      r.progress = calcProgress(r.sessions || []);
      const rate = r.attendanceRate;
      r.status = rate < 80 ? '异常' : (rate < 90 ? '关注' : '正常');
    }

    function renderAll() {
      classRecords.forEach(refreshClassMetrics);
      renderClassTable();
      renderAttendance();
      renderEvidence();
      renderLogs();
      renderExceptions();
    }

    function openClassModal(classId) {
      const r = classRecords.find(x => x.classId === classId);
      if (!r) return;
      document.getElementById('modalClassId').value = classId;
      document.getElementById('classModalTitle').textContent = r.className + ' · 培训详情';
      document.getElementById('modalClassContent').innerHTML = `
        <p><strong>学员：</strong>${r.studentCount} 人 · <strong>进度：</strong>${r.progress}% · <strong>签到率：</strong>${r.attendanceRate}%</p>
        <p style="margin-top:12px"><strong>课次：</strong>${(r.sessions || []).length} 节</p>
        <p style="margin-top:8px"><strong>留痕：</strong>${r.evidenceCount?.photos || 0} 照片 / ${r.evidenceCount?.videos || 0} 视频</p>
        <p style="margin-top:8px"><strong>状态：</strong>${r.status}</p>
      `;
      document.getElementById('classModal').classList.add('show');
    }

    function checkinClass(classId) {
      const r = classRecords.find(x => x.classId === classId);
      if (!r) return;
      const today = todayStr();
      const session = (r.sessions || []).find(s => s.date === today) || (r.sessions || [])[0];
      if (session) {
        session.checked = true;
        session.present = session.expected;
        refreshClassMetrics(r);
        saveData();
        renderAll();
        alert(`已为「${r.className}」完成课次签到（${session.courseName}）`);
      } else {
        alert('该班暂无课次记录');
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('filterClass').addEventListener('change', renderAll);

    document.getElementById('attendanceList').addEventListener('change', e => {
      const inp = e.target.closest('.present-input');
      const chk = e.target.closest('.session-check');
      const classId = parseInt((inp || chk)?.dataset.class);
      const sid = parseInt((inp || chk)?.dataset.sid);
      const r = classRecords.find(x => x.classId === classId);
      const s = r?.sessions?.find(x => x.id === sid);
      if (!s) return;
      if (inp) s.present = parseInt(inp.value) || 0;
      if (chk) s.checked = chk.checked;
      refreshClassMetrics(r);
      saveData();
      renderClassTable();
      updateStats();
    });

    document.getElementById('btnBatchCheckIn').addEventListener('click', () => {
      const today = todayStr();
      let n = 0;
      filteredClasses().forEach(r => {
        (r.sessions || []).forEach(s => {
          if (s.date === today) {
            s.checked = true;
            s.present = s.expected;
            n++;
          }
        });
        refreshClassMetrics(r);
      });
      saveData();
      renderAll();
      alert(n ? `已为 ${n} 个今日课次完成批量签到` : '今日无待签到课次');
    });

    document.getElementById('btnUploadPhoto').addEventListener('click', () => {
      const r = filteredClasses()[0] || classRecords[0];
      if (!r) { alert('请先选择项目并确保有班级'); return; }
      r.evidenceCount = r.evidenceCount || { photos: 0, videos: 0 };
      r.evidenceCount.photos += 1;
      const session = (r.sessions || []).find(s => s.date === todayStr()) || r.sessions?.[0];
      if (session) session.photos = (session.photos || 0) + 1;
      saveData();
      renderEvidence();
      renderClassTable();
      alert('课堂照片上传成功（演示）');
    });

    document.getElementById('btnUploadVideo').addEventListener('click', () => {
      const r = filteredClasses()[0] || classRecords[0];
      if (!r) { alert('请先选择项目并确保有班级'); return; }
      r.evidenceCount = r.evidenceCount || { photos: 0, videos: 0 };
      r.evidenceCount.videos += 1;
      const session = (r.sessions || []).find(s => s.date === todayStr()) || r.sessions?.[0];
      if (session) session.videos = (session.videos || 0) + 1;
      saveData();
      renderEvidence();
      renderClassTable();
      alert('课堂视频上传成功（演示）');
    });

    document.getElementById('btnAddLog').addEventListener('click', () => {
      document.getElementById('logDate').value = todayStr();
      document.getElementById('logModal').classList.add('show');
    });

    document.getElementById('logModalCancel').addEventListener('click', () => {
      document.getElementById('logModal').classList.remove('show');
    });

    document.getElementById('logModalSave').addEventListener('click', () => {
      const classId = parseInt(document.getElementById('logClassId').value);
      const r = classRecords.find(x => x.classId === classId);
      const content = document.getElementById('logContent').value.trim();
      if (!content) { alert('请填写日志内容'); return; }
      globalLogs.push({
        id: logIdCounter++,
        classId,
        className: r?.className || '—',
        date: document.getElementById('logDate').value,
        author: '班主任',
        content
      });
      document.getElementById('logContent').value = '';
      document.getElementById('logModal').classList.remove('show');
      saveData();
      renderLogs();
      updateStats();
    });

    document.getElementById('btnAddException').addEventListener('click', () => {
      document.getElementById('excDate').value = todayStr();
      document.getElementById('excModal').classList.add('show');
    });

    document.getElementById('excModalCancel').addEventListener('click', () => {
      document.getElementById('excModal').classList.remove('show');
    });

    document.getElementById('excModalSave').addEventListener('click', () => {
      const classId = parseInt(document.getElementById('excClassId').value);
      const r = classRecords.find(x => x.classId === classId);
      globalExceptions.push({
        id: excIdCounter++,
        classId,
        className: r?.className || '—',
        date: document.getElementById('excDate').value,
        student: document.getElementById('excStudent').value.trim(),
        type: document.getElementById('excType').value,
        desc: document.getElementById('excDesc').value.trim(),
        resolved: false
      });
      if (r) r.status = '关注';
      document.getElementById('excDesc').value = '';
      document.getElementById('excStudent').value = '';
      document.getElementById('excModal').classList.remove('show');
      saveData();
      renderAll();
    });

    document.getElementById('exceptionsList').addEventListener('click', e => {
      const btn = e.target.closest('.resolve-exc');
      if (!btn) return;
      const exc = globalExceptions.find(x => x.id === parseInt(btn.dataset.id));
      if (exc) exc.resolved = true;
      saveData();
      renderAll();
    });

    document.getElementById('classBody').addEventListener('click', e => {
      const view = e.target.closest('.view-class');
      const checkin = e.target.closest('.checkin-class');
      if (view) openClassModal(parseInt(view.dataset.id));
      if (checkin) checkinClass(parseInt(checkin.dataset.id));
    });

    document.getElementById('classModalClose').addEventListener('click', () => {
      document.getElementById('classModal').classList.remove('show');
    });

    document.getElementById('btnNextStep').addEventListener('click', () => {
      if (!currentProjectId) { alert('请先选择项目'); return; }
      saveData();
      alert(`项目「${currentProject?.name || ''}」培训过程已保存，进入认定环节`);
      window.location.href = `认定.html?projectId=${currentProjectId}`;
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      populateProjectSelect();
      const params = new URLSearchParams(window.location.search);
      const pid = params.get('projectId');
      if (pid && tasks.some(t => String(t.id) === String(pid))) {
        document.getElementById('projectSelect').value = pid;
        loadProjectData(parseInt(pid, 10));
      } else {
        toggleWorkspace(false);
      }
      document.getElementById('projectSelect').addEventListener('change', e => {
        const v = e.target.value;
        if (!v) {
          if (currentProjectId) saveData();
          currentProjectId = null;
          currentProject = null;
          toggleWorkspace(false);
          document.getElementById('projectBanner').style.display = 'none';
          document.getElementById('pageSub').textContent = '按项目跟踪培训过程 · 步骤 5 / 9';
          const url = new URL(window.location.href);
          url.searchParams.delete('projectId');
          history.replaceState(null, '', url);
          return;
        }
        if (currentProjectId) saveData();
        const url = new URL(window.location.href);
        url.searchParams.set('projectId', v);
        history.replaceState(null, '', url);
        loadProjectData(parseInt(v, 10));
      });
    });
  </script>
</body>
</html>
